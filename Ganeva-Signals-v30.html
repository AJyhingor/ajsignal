/* stocks & commodities: the 10x+ markets from the screenshots (Hyperliquid builder-deployed perps; exact symbol names are looked up at start-up) */
const HSC=[["GOLD","Gold"],["SILVER","Silver"],["COPPER","Copper"],["MSFT","Microsoft"],["AAPL","Apple"],["NFLX","Netflix"],["TSLA","Tesla"],["DELL","Dell"],["META","Meta"],["GOOGL","Google"],["AMZN","Amazon"],["INTC","Intel"],["HOOD","Robinhood"],["COIN","Coinbase"],["PLTR","Palantir"],["NET","Cloudflare"],["ORCL","Oracle"],["QCOM","Qualcomm"],["AMAT","Applied Materials"],["MRVL","Marvell"],["MU","Micron"],["SNDK","Sandisk"],["BABA","Alibaba"],["TSM","TSMC"],["LLY","Eli Lilly"],["NBIS","Nebius"],["CRWV","CoreWeave"],["CBRS","Cerebras"],["SKHY","SK Hynix"],["SPCX","SpaceX"],["SPY","S&P 500 ETF"],["QQQ","Nasdaq 100 ETF"],["TLT","20Y Treasury ETF"]];

const TVN={GOLD:"OANDA:XAUUSD",SILVER:"OANDA:XAGUSD",COPPER:"COMEX:HG1!",SPY:"AMEX:SPY",DELL:"NYSE:DELL",ORCL:"NYSE:ORCL",LLY:"NYSE:LLY",BABA:"NYSE:BABA",TSM:"NYSE:TSM",NET:"NYSE:NET"};"MSFT AAPL NFLX TSLA META GOOGL AMZN INTC HOOD COIN PLTR QCOM AMAT MRVL MU QQQ TLT".split(" ").forEach(c=>{TVN[c]="NASDAQ:"+c});
const TFS=[[15,"15m","15 minute"],[60,"1H","1 hour"],[240,"4H","4 hour"],[1440,"1D","1 day"]];
const TVB="BTC ETH SOL XRP DOGE ADA LINK BNB TRX UNI AAVE NEAR ONDO CRV ZEC JUP".split(" "),TVS={BOOM1000:"DERIV:BOOM1000",CRASH1000:"DERIV:CRASH1000",BOOM500:"DERIV:BOOM500",CRASH500:"DERIV:CRASH500",BOOM300N:"DERIV:BOOM300N",CRASH300N:"DERIV:CRASH300N"};TVB.forEach(c=>{TVS["HL:"+c]="BINANCE:"+c+"USDT"});for(const c in TVN)TVS["HS:"+c]=TVN[c];const TVI={15:"15",60:"60",240:"240",1440:"D"};

try{const z=JSON.parse(localStorage.getItem("gsig2")||"{}");if(z.m>=0&&z.m<MK.length)S.m=z.m;if(TFS.some(t=>t[0]===z.tf))S.tf=z.tf;S.tv=!!z.tv;if(z.rm)Object.assign(S.rm,z.rm);if(z.sma)Object.assign(S.sma,z.sma)}catch(e){}
S.sg=MK[S.m][3];const save=()=>{try{localStorage.setItem("gsig2",JSON.stringify(S))}catch(e){}},cs=()=>MK[S.m][1],tfn=f=>(TFS.find(t=>t[0]===f)||[0,f+"m"])[1];

/* ---------- data ---------- */
const bk=(f,e)=>f===10080?Math.floor((e+259200)/604800)*604800-259200:Math.floor(e/(f*60))*(f*60),baseG=f=>f===10080?1440:f;
const pipOf=p=>p>=1000?2:p>=100?3:p>=1?4:p>=0.1?5:p>=0.01?6:7,D={};MK.forEach(m=>{D[m[1]]={p:0,pip:2,t:{}}});
function CK(s,f){return"gsc|"+s+"|"+f}
function cacheLoad(s,f){try{const z=JSON.parse(localStorage.getItem(CK(s,f))||"null");if(Array.isArray(z)&&z.length)return z.map(a=>({epoch:a[0],open:a[1],high:a[2],low:a[3],close:a[4]}))}catch(e){}return[]}
function cacheSave(s,f){try{const t=D[s]&&D[s].t[f];if(!t||!t.ok||!t.c.length)return;localStorage.setItem(CK(s,f),JSON.stringify(t.c.slice(-400).map(k=>[k.epoch,k.open,k.high,k.low,k.close])))}catch(e){}}
function mergeC(o,a){if(!o.length||!a.length||o[o.length-1].epoch<a[0].epoch)return a;return o.filter(k=>k.epoch<a[0].epoch).concat(a)}
const getT=(s,f)=>D[s].t[f]||(D[s].t[f]={c:cacheLoad(s,f),ok:0,ld:0});
function aggr(a,f){const o=[];for(const k of a){const b=bk(f,k.epoch),l=o[o.length-1];if(l&&l.epoch===b){if(k.high>l.high)l.high=k.high;if(k.low<l.low)l.low=k.low;l.close=k.close}else o.push({epoch:b,open:k.open,high:k.high,low:k.low,close:k.close,b0:k.epoch})}
  if(o.length&&o[0].b0!==o[0].epoch)o.shift();o.forEach(k=>delete k.b0);return o}
/* ---------- connection (public Deriv market data, no login) ---------- */
let ws=null,up=false,req=0,reqs=new Map(),lastMsg=0,pingAt=0,rtt=0,retry=0;const q=[];let pw0=0;
function send(p){if(!ws||ws.readyState!==1)return false;try{ws.send(JSON.stringify(p));return true}catch(e){return false}}
function rq1(p,t){return new Promise((res,rej)=>{const id=++req;p.req_id=id;const tm=setTimeout(()=>{reqs.delete(id);rej(new Error("Request timed out"))},t||10000);reqs.set(id,{res,rej,tm});if(!send(p)){clearTimeout(tm);reqs.delete(id);rej(new Error("Not connected"))}})}
async function rq(p,t,n){n=n===undefined?2:n;for(let a=0;;a++){try{return await rq1(Object.assign({},p),t)}catch(e){if(a>=n||!/internal|server error|temporar|unavailable|error occurred/i.test(e.message))throw e;await sleep(250*(a+1))}}}
function swapSym(m,y){D[y]={p:0,pip:2,t:{}};delete D[m[1]];m[1]=y}
async function refOpen(){try{const d=await rq({active_symbols:"brief",product_type:"basic"},8000,0),list=d.active_symbols||[],bn={},keys=[];
  list.forEach(a=>{const y=a.underlying_symbol||a.symbol;keys.push(y);bn[String(a.display_name||a.underlying_symbol_name||a.symbol_name||"").toLowerCase()]=y});
  MK.forEach(m=>{if(m[3]!=="d")return;const k=/^(boom|crash)\s+(\d+)/i.exec(m[2]);let y=bn[m[2].toLowerCase()];if(!y&&k){const re=new RegExp("^"+k[1]+k[2]+"N?$","i");y=keys.find(z=>re.test(z))}if(y&&y!==m[1])swapSym(m,y)})}catch(e){}}
function connect(){if(ws)return;stat(false,"CONNECTING");const s=new WebSocket(PUB);ws=s;
  s.onopen=async()=>{if(ws!==s)return;up=true;retry=0;lastMsg=Date.now();stat(true,"ONLINE");MK.forEach(m=>{if(m[3]!=="d")return;for(const f in D[m[1]].t){D[m[1]].t[f].rl=1}});await refOpen();MK.forEach(m=>m[3]==="d"&&send({ticks:m[1],subscribe:1}));show()};
  s.onmessage=e=>{if(ws!==s)return;lastMsg=Date.now();let d;try{d=JSON.parse(e.data)}catch(x){return}onMsg(d)};
  const gone=()=>{if(ws!==s)return;ws=null;up=false;reqs.forEach(r=>{clearTimeout(r.tm);r.rej(new Error("Disconnected"))});reqs.clear();stat(false,"OFFLINE");setTimeout(connect,Math.min(15000,1000*(++retry)))};s.onclose=gone;s.onerror=gone}
function onMsg(d){
  if(d.error){const r=reqs.get(d.req_id);if(r){clearTimeout(r.tm);reqs.delete(d.req_id);r.rej(new Error(d.error.message||"Deriv error"));return}

setInterval(()=>{if(!up)return;if(Date.now()-lastMsg>20000){try{ws.close()}catch(e){}return}pingAt=Date.now();send({ping:1});stat(true,"ONLINE "+rtt+"ms")},8000);
let hlNext=0;

async function getHistH(s,f,end,count){const coin=COIN[s];if(!coin)throw new Error("symbol not resolved");const iv={15:"15m",60:"1h",240:"4h",1440:"1d"}[f],e=end==="latest"?Date.now():end*1000,r=await hlPost({type:"candleSnapshot",req:{coin:coin,interval:iv,startTime:e-count*f*60000,endTime:e}});
  const a=(Array.isArray(r)?r:[]).map(k=>({epoch:Math.floor(k.t/1000),open:+k.o,high:+k.h,low:+k.l,close:+k.c}));if(a.length)D[s].pip=pipOf(a[a.length-1].close);return a}

function openSig(q){S.m=q.mi;S.sg=MK[S.m][3];S.tf=q.f;save();paint();$("sp").classList.remove("show");show()}
/* ---------- UI ---------- */
function paint(){const g=MK[S.m][3];GRP.forEach(z=>{const b=$("mb_"+z[0]);b.textContent=g===z[0]?z[1]+": "+MK[S.m][0]+" ▾":z[1]+" ▾";b.classList.toggle("on",g===z[0]);[...$("mk_"+z[0]).children].forEach(x=>x.classList.toggle("on",+x.dataset.i===S.m))});[...$("tfs").children].forEach(b=>b.classList.toggle("on",+b.dataset.f===S.tf))}
function show(){V.off=0;const s=cs();want(s,S.tf,true);MK.forEach(m=>m[1]!==s&&want(m[1],S.tf));scanWant();draw()}
TFS.forEach(z=>{const b=document.createElement("button");b.className="b";b.dataset.f=z[0];b.textContent=z[1];b.onclick=()=>{S.tf=z[0];save();paint();show()};$("tfs").appendChild(b)});
const closeMenus=()=>["im"].concat(GRP.map(z=>"mp_"+z[0])).forEach(i=>$(i).classList.remove("show"));
GRP.forEach(z=>{const bb=document.createElement("button");bb.className="b";bb.id="mb_"+z[0];bb.style.cssText="flex:1;padding:0 4px;font-size:11px";bb.onclick=()=>{const was=$("mp_"+z[0]).classList.contains("show");closeMenus();if(!was)$("mp_"+z[0]).classList.add("show")};$("mbar").appendChild(bb);
  const pm=document.createElement("div");pm.id="mp_"+z[0];pm.className="pm mpx";const gr=document.createElement("div");gr.className="mg";gr.id="mk_"+z[0];pm.appendChild(gr);$("mbar").appendChild(pm);
  const tb=document.createElement("button");tb.className="b";tb.id="sg_"+z[0];tb.style.height="28px";tb.textContent=z[1];tb.onclick=()=>{S.sg=z[0];scanRender(0)};$("sgt").appendChild(tb)});
MK.forEach((m,i)=>{const b=document.createElement("button");b.className="b";b.dataset.i=i;b.textContent=m[0];b.onclick=()=>{S.m=i;S.sg=m[3];save();closeMenus();paint();show()};$("mk_"+m[3]).appendChild(b)});
$("ib").onclick=()=>{closeMenus();$("im").classList.remove("show");fill();$("im").classList.toggle("show")};
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#im,#ib,.mpx,#mbar button"))closeMenus();try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(x){}keep()},true);
const FM=[["in_lo","rm","lo","n"],["in_hi","rm","hi","n"],["in_rp","rm","rsiP","n"],["in_ra","rm","rsiApply","s"],["in_rw","rm","rsiW","n"],["in_rc","rm","rsiCol","s"],["in_mp","rm","maP","n"],["in_mm","rm","maM","s"],["in_ma","rm","maApply","s"],["in_mw","rm","maW","n"],["in_mc","rm","maCol","s"],["in_sc","rm","scale","n"],["in_sl","rm","sLo","n"],["in_sh","rm","sHi","n"],["in_sg","rm","sigMode","s"],["sm_p","sma","p","n"],["sm_a","sma","apply","s"],["sm_w","sma","w","n"],["sm_c","sma","col","s"]];
function fill(){$("rm_on").checked=S.rm.on;$("sm_on").checked=S.sma.on;FM.forEach(a=>{$(a[0]).value=S[a[1]][a[2]]});$("er").textContent=""}
$("app").onclick=()=>{const n={rm:Object.assign({},S.rm),sma:Object.assign({},S.sma)};n.rm.on=$("rm_on").checked;n.sma.on=$("sm_on").checked;let err="";
  FM.forEach(a=>{const e=$(a[0]);if(a[3]==="n"){const v=parseFloat(e.value);if(e.value===""||isNaN(v)){err="Fill in every number box";return}n[a[1]][a[2]]=v}else n[a[1]][a[2]]=e.value});
  const R=n.rm,Q=n.sma,ints=[["RSI period",R.rsiP,0,200],["MA period",R.maP,1,200],["RSI line px",R.rsiW,1,6],["MA line px",R.maW,1,6],["Scanner lookback bars",R.scale,20,1000],["Main MA period",Q.p,1,500],["Main MA px",Q.w,1,6]];
  for(const z of ints){if(!Number.isInteger(z[1])||z[1]<z[2]||z[1]>z[3]){err=z[0]+" must be a whole number "+z[2]+" to "+z[3];break}}
  if(!err&&!(R.lo>=0&&R.hi<=100&&R.lo<R.hi))err="Levels must satisfy 0 <= low < high <= 100";if(!err&&!(R.sLo>=0&&R.sHi<=100&&R.sLo<R.sHi))err="Scale low/high must satisfy 0 <= low < high <= 100";if(!err&&R.maApply==="rsi"&&R.rsiP<1)err="MA on RSI data needs an RSI period above 0";
  if(err){$("er").textContent=err;return}
  S.rm=R;S.sma=Q;save();for(const k in SIGM)delete SIGM[k];for(const k in SEEN)delete SEEN[k];$("im").classList.remove("show");msg("Settings applied");rd();scanTick()};
$("rst").onclick=()=>{S.rm=JSON.parse(JSON.stringify(DEF.rm));S.sma=JSON.parse(JSON.stringify(DEF.sma));save();fill();for(const k in SIGM)delete SIGM[k];for(const k in SEEN)delete SEEN[k];rd();scanTick()};
$("lv").onclick=()=>{V.off=0;rd()};
$("tv").onclick=()=>{if(!TVS[cs()]&&!S.tv){msg("No TradingView symbol for "+MK[S.m][0]+" - showing the Deriv chart","var(--gold)");return}S.tv=!S.tv;save();tvk="";rd()};
$("sb").onclick=()=>{S.sg=MK[S.m][3];SNEW=0;$("sn").textContent="";$("sp").classList.add("show");scanTick();scanRender(0)};$("spx").onclick=()=>$("sp").classList.remove("show");
$("spg").onclick=e=>{const td=e.target.closest("td[data-m]");if(!td)return;S.m=+td.dataset.m;S.sg=MK[S.m][3];S.tf=+td.dataset.f;save();paint();$("sp").classList.remove("show");show()};
setInterval(scanTick,1000);setInterval(()=>{if(up)scanWant()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){keep();if(!ws)connect();rd()}});
window.addEventListener("resize",rd);paint();draw();connect();connectH();scanWant();keep();
</script></body></html>
