<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AJ @ Ganeva</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
    overflow-y:hidden;
}

button,select,input{
    font:inherit;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:6px;
    box-sizing:border-box;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr 1.3fr;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    flex-shrink:0;
}

.logo{
    font-size:18px;
    font-weight:900;
    color:#fff;
    white-space:nowrap;
}

.headerMetric{
    text-align:center;
    min-width:0;
}

.headerLabel{
    font-size:9px;
    color:#71859a;
    text-transform:uppercase;
}

.headerValue{
    margin-top:2px;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#livePrice{
    color:#48d8ff;
    font-size:16px;
}

#balance{
    color:#ffc94d;
}

#digitalTime{
    font-size:10px;
    font-weight:700;
    color:#c3d2e2;
}

/* =========================================================
   CONNECTION
   ========================================================= */

.connection{
    display:flex;
    align-items:center;
    gap:5px;
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.patInput{
    width:235px;
    max-width:38%;
    height:36px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    padding:0 10px;
    outline:none;
    font-size:12px;
}

.patInput:focus{
    border-color:#269cff;
}

.connectBtn{
    height:36px;
    width:92px;
    border:0;
    border-radius:6px;
    background:#1675d1;
    color:#fff;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.connectBtn.connected{
    background:#158447;
}

.connectBtn:disabled{
    opacity:.55;
}

/* =========================================================
   TOP CONTROLS
   ========================================================= */

.controlGrid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.control{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:4px;
    min-height:50px;
}

.controlTitle{
    text-align:center;
    color:#52b7ff;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:3px;
}

.controlValue{
    width:100%;
    height:30px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#fff;
    text-align:center;
    font-weight:800;
    font-size:11px;
    outline:none;
}

.accountSwitch{
    display:flex;
    gap:4px;
}

.accountSwitch button{
    flex:1;
    height:30px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#aebfd2;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.accountSwitch button.active{
    background:#145e99;
    border-color:#2d9fea;
    color:#fff;
}

/* =========================================================
   MAIN / POSITION LAYOUT
   ========================================================= */

.mainRow{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    gap:6px;
    margin-bottom:6px;
    overflow:hidden;
}

.chartColumn{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    min-width:0;
    gap:6px;
    overflow:hidden;
}

@media(min-width:900px){
    .mainRow{
        flex:1;
        min-height:0;
    }
}

.chartPanel{
    background:#071321;
    border:1px solid #1c3855;
    border-radius:9px;
    overflow:hidden;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.chartTop{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    padding:5px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
}

.chartControl label{
    display:block;
    color:#7288a0;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.chartControl select{
    width:100%;
    height:40px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#fff;
    padding:0 6px;
    outline:none;
    font-size:13px;
}

.chartViewport{
    position:relative;
    width:100%;
    flex:1;
    min-height:110px;
    background:#071321;
    overflow:hidden;
    touch-action:none;
}

#chartCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

.chartInfo{
    display:none;
    position:absolute;
    top:7px;
    left:7px;
    z-index:5;
    padding:6px 8px;
    border-radius:6px;
    background:rgba(5,13,23,.88);
    border:1px solid rgba(83,130,170,.35);
    pointer-events:none;
}

.chartInfo .market{
    font-weight:900;
    font-size:11px;
}

.chartInfo .sub{
    color:#91a6bc;
    font-size:9px;
    margin-top:2px;
}

.chartStatus{
    display:none;
    position:absolute;
    right:7px;
    top:7px;
    z-index:5;
    font-size:9px;
    padding:4px 6px;
    border-radius:4px;
    background:rgba(0,0,0,.55);
    color:#65c5ff;
    pointer-events:none;
}

/* =========================================================
   OPEN POSITIONS TICKER
   ========================================================= */

.positionsTicker{
    position:absolute;
    top:5px;
    left:5px;
    right:5px;
    z-index:6;
    display:flex;
    flex-direction:row-reverse;
    gap:6px;
    overflow-x:auto;
    pointer-events:none;
}

.posTick{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:46px;
    background:rgba(5,13,23,.82);
    border:1px solid rgba(83,130,170,.3);
    border-radius:5px;
    padding:2px 5px;
    line-height:1.35;
}

.posTick .posSym{
    font-size:9px;
    font-weight:900;
    color:#dce8f5;
    white-space:nowrap;
}

.posTick .posArrow.up{
    color:#35d68d;
}

.posTick .posArrow.down{
    color:#ff526b;
}

.posTick .posPL{
    font-size:9px;
    font-weight:800;
}

.posTick .posPL.pos{
    color:#45d58b;
}

.posTick .posPL.neg{
    color:#ff6176;
}

.posTick .posTime{
    font-size:8px;
    color:#9fb3c8;
}

.chartNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:3px 5px;
    background:#0b192a;
    border-top:1px solid #162d45;
    flex-shrink:0;
}

.chartNav button{
    border:1px solid #294967;
    background:#071321;
    color:#a9bdd1;
    border-radius:5px;
    width:26px;
    height:26px;
    padding:0;
    font-size:14px;
    font-weight:900;
    line-height:1;
    cursor:pointer;
}

.chartNav span{
    color:#627991;
    font-size:9px;
}

/* =========================================================
   WINDOW 1
   ========================================================= */

.indicatorWindow{
    display:none;
    background:#071321;
    border:1px solid #1c3855;
    border-radius:8px;
    margin-top:0;
    overflow:hidden;
    flex-shrink:0;
}

.indicatorWindow.visible{
    display:block;
}

.indicatorHeader{
    height:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
    font-size:10px;
    font-weight:900;
    color:#52b7ff;
}

.indicatorHeader button{
    border:0;
    background:transparent;
    color:#7890a7;
    font-size:15px;
    line-height:1;
    cursor:pointer;
}

#indicatorCanvas{
    width:100%;
    height:clamp(64px,11vh,110px);
    display:block;
}

/* =========================================================
   TRADE PAD
   ========================================================= */

.tradePad{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:6px;
    flex-shrink:0;
}

.tradeBtn{
    height:clamp(52px,9vh,80px);
    border:0;
    border-radius:12px;
    color:#fff;
    font-weight:900;
    font-size:clamp(15px,3.4vh,20px);
    cursor:pointer;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
    user-select:none;
}

.tradeBtn.rise{
    background:#118447;
}

.tradeBtn.fall{
    background:#b92d43;
}

.tradeBtn:active{
    transform:scale(.97);
}

.tradeBtn.sending{
    opacity:.65;
    pointer-events:none;
    font-size:19px;
    letter-spacing:1px;
}

.tradeArrow{
    font-size:22px;
    margin-right:5px;
}

/* =========================================================
   BOTTOM CONTROL ROW
   ========================================================= */

.bottomRow{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.bottomBox{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:7px;
    padding:4px 3px;
    min-width:0;
}

.bottomLabel{
    display:block;
    text-align:center;
    color:#7288a0;
    font-size:8px;
    text-transform:uppercase;
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stakeInput,
.bottomSelect{
    width:100%;
    height:32px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:5px;
    text-align:center;
    font-weight:900;
    outline:none;
    font-size:11px;
}

.indicatorButton,
.logButton{
    width:100%;
    height:32px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:5px;
    font-weight:900;
    font-size:10px;
    cursor:pointer;
}

.indicatorMenu{
    display:none;
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    bottom:calc(100% + 4px);
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    overflow:hidden;
}

.indicatorMenu.show{
    display:block;
}

.indicatorMenu button{
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid #1c3855;
    background:#0d1a2b;
    color:#fff;
    text-align:left;
    padding:8px 10px;
    font-size:11px;
    cursor:pointer;
}

.indicatorMenu button:hover{
    background:#145e99;
}

.indicatorBox{
    position:relative;
}

.indicatorSettings{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:38px;
    z-index:50;
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    padding:7px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.indicatorSettings.show{
    display:block;
}

.settingRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:8px;
    font-size:12px;
    color:#a8bacd;
}

.settingRow:last-child{
    margin-bottom:0;
}

.settingRow input,
.settingRow select{
    width:86px;
    height:34px;
    background:#071321;
    border:1px solid #294967;
    border-radius:4px;
    color:#fff;
    text-align:center;
    font-size:12px;
}

/* =========================================================
   SYSTEM LOG
   ========================================================= */

.logBox{
    position:relative;
}

.logPanel{
    display:none;
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    bottom:calc(100% + 4px);
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    padding:6px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    max-height:26vh;
    overflow-y:auto;
}

.logPanel.show{
    display:block;
}

.log{
    max-height:100px;
    overflow-y:auto;
    font-family:monospace;
    font-size:9px;
    line-height:1.5;
}

.logLine{
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:2px 0;
}

.logTime{
    color:#597089;
}

.good{color:#45d58b}
.bad{color:#ff6176}
.info{color:#74c8ff}
.warn{color:#ffc857}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:850px){
    .header{
        grid-template-columns:1.4fr 1fr 1fr 1.2fr;
    }
}

@media(max-width:700px){
    .app{
        padding:4px;
    }
    .header{
        grid-template-columns:1.35fr .9fr .9fr 1.15fr;
        gap:4px;
    }
    .connection{
        padding:4px;
    }
    .patInput{
        width:auto;
        max-width:none;
        flex:1;
    }
    .tradeBtn{
        font-size:16px;
    }
}

@media(max-width:450px){
    .logo{
        font-size:16px;
    }
    .headerValue{
        font-size:11px;
    }
    #livePrice{
        font-size:14px;
    }
    .chartTop{
        gap:4px;
        padding:5px;
    }
    .chartControl select{
        height:34px;
        font-size:11px;
    }
    .bottomRow{
        gap:4px;
    }
    .bottomBox{
        min-height:auto;
        padding:3px 2px;
    }
    .bottomLabel{
        font-size:7px;
    }
    .stakeInput,
    .bottomSelect,
    .indicatorButton,
    .logButton{
        height:30px;
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">
        AJ @ Ganeva
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Balance</div>
        <div id="balance" class="headerValue">--</div>
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Time</div>
        <div id="digitalTime" class="headerValue">--:--:--</div>
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Deriv Live Price</div>
        <div id="livePrice" class="headerValue">--</div>
    </div>

</div>


<!-- =====================================================
     PAT
===================================================== -->

<div class="connection">

    <input
        id="pat"
        class="patInput"
        type="password"
        autocomplete="off"
        placeholder="Paste Deriv PAT here">

    <button id="connectBtn" class="connectBtn">
        CONNECT
    </button>

</div>


<!-- =====================================================
     COMPACT TOP CONTROLS
===================================================== -->

<div class="controlGrid">

    <div class="control">

        <div class="controlTitle">
            Account
        </div>

        <div class="accountSwitch">

            <button id="demoBtn"
                    class="active"
                    type="button">
                DEMO
            </button>

            <button id="liveBtn"
                    type="button">
                LIVE
            </button>

        </div>

    </div>


    <div class="control">

        <div class="controlTitle">
            Market
        </div>

        <select id="marketSelect"
                class="controlValue">

            <option value="R_25">R_25</option>
            <option value="R_50">R_50</option>
            <option value="R_75">R_75</option>
            <option value="R_100">R_100</option>

        </select>

    </div>


    <div class="control">

        <div class="controlTitle">
            Chart Time
        </div>

        <select id="chartTime"
                class="controlValue">

            <option value="1t">1T</option>
            <option value="5t">5T</option>
            <option value="1m" selected>1M</option>
            <option value="5m">5M</option>
            <option value="15m">15M</option>

        </select>

    </div>


    <div class="control">

        <div class="controlTitle">
            Chart
        </div>

        <select id="chartStyle"
                class="controlValue">

            <option value="candles" selected>
                Candles
            </option>

            <option value="line">
                Line
            </option>

        </select>

    </div>

</div>


<!-- =====================================================
     CHART
===================================================== -->

<div class="mainRow">

    <div class="chartColumn">

        <div class="chartPanel">

            <div id="chartViewport"
                 class="chartViewport">

                <canvas id="chartCanvas"></canvas>

                <div class="chartInfo">

                    <div id="chartMarketName"
                         class="market">
                        R_25
                    </div>

                    <div id="chartInfoText"
                         class="sub">
                        Waiting for Deriv live market...
                    </div>

                </div>

                <div id="chartStatus"
                     class="chartStatus">
                    DISCONNECTED
                </div>

                <div id="positionsTicker"
                     class="positionsTicker">
                </div>

            </div>


            <div class="chartNav">

                <button id="zoomOut">−</button>

                <span>
                    Drag to view older Deriv prices
                </span>

                <button id="zoomIn">+</button>

            </div>

        </div>


        <!-- =================================================
             INDICATOR WINDOW 1
        ================================================== -->

        <div id="indicatorWindow"
             class="indicatorWindow">

            <div class="indicatorHeader">

                <span id="indicatorTitle">
                    INDICATOR WINDOW 1
                </span>

                <button id="closeIndicator">
                    ×
                </button>

            </div>

            <canvas id="indicatorCanvas"></canvas>

        </div>

    </div>

</div>



<!-- =====================================================
     MANUAL ENTRY
===================================================== -->

<div class="tradePad">

    <button id="riseBtn"
            class="tradeBtn rise">

        <span class="tradeArrow">↑</span>
        RISE

    </button>


    <button id="fallBtn"
            class="tradeBtn fall">

        FALL
        <span class="tradeArrow">↓</span>

    </button>

</div>


<!-- =====================================================
     BOTTOM ROW
===================================================== -->

<div class="bottomRow">

    <div class="bottomBox">

        <label class="bottomLabel">
            Stake
        </label>

        <input
            id="stake"
            class="stakeInput"
            type="number"
            min="1"
            step="0.01"
            value="1">

    </div>


    <div class="bottomBox">

        <label class="bottomLabel">
            Expiry Time
        </label>

        <select id="tradeExpiry"
                class="bottomSelect">

            <option value="5t">5T</option>
            <option value="10t">10T</option>
            <option value="15t">15T</option>
            <option value="5m" selected>5M</option>
            <option value="10m">10M</option>
            <option value="custom">Custom</option>

        </select>

    </div>


    <div class="bottomBox indicatorBox">

        <label class="bottomLabel">
            Indicator
        </label>

        <button id="indicatorButton"
                class="indicatorButton">
            SELECT ▼
        </button>

        <div id="indicatorMenu"
             class="indicatorMenu">

            <button data-indicator="RSI">
                RSI
            </button>

            <button data-indicator="MACD">
                MACD
            </button>

            <button data-indicator="MA">
                MA
            </button>

            <button data-indicator="MA_SETTINGS">
                SETTING
            </button>

        </div>


        <div id="indicatorSettings"
             class="indicatorSettings">

            <div class="settingRow">

                <span>MA Length</span>

                <input
                    id="maLength"
                    type="number"
                    min="1"
                    value="20">

            </div>

            <div class="settingRow">

                <span>MA Location</span>

                <select id="maLocation">

                    <option value="main">
                        Main Chart
                    </option>

                    <option value="window">
                        Window 1
                    </option>

                </select>

            </div>

            <div class="settingRow">

                <span>RSI Period</span>

                <input
                    id="rsiPeriod"
                    type="number"
                    min="1"
                    value="14">

            </div>

            <div class="settingRow">

                <span>MACD Fast</span>

                <input
                    id="macdFast"
                    type="number"
                    min="1"
                    value="12">

            </div>

            <div class="settingRow">

                <span>MACD Slow</span>

                <input
                    id="macdSlow"
                    type="number"
                    min="2"
                    value="26">

            </div>

            <div class="settingRow">

                <span>MACD Signal</span>

                <input
                    id="macdSignal"
                    type="number"
                    min="1"
                    value="9">

            </div>

        </div>

    </div>


    <div class="bottomBox logBox">

        <label class="bottomLabel">
            System Log
        </label>

        <button id="logButton"
                class="logButton">
            LOG ▼
        </button>

        <div id="logPanel"
             class="logPanel">

            <div id="log"
                 class="log">
            </div>

        </div>

    </div>

</div>

</div>


<script>

/* =========================================================
   APP CONFIGURATION
========================================================= */

const APP_ID =
    "3447X0mxYSFx7iRN27jhP";

const API_BASE =
    "https://api.derivws.com";

const PUBLIC_WS =
    "wss://api.derivws.com/trading/v1/options/ws/public";


/* =========================================================
   STATE
========================================================= */

let pat = "";

let selectedAccountType =
    "demo";

/* =========================================================
   LOG
========================================================= */

function log(message,type="info"){

    const box =
        $("log");

    const line =
        document.createElement("div");

    const time =
        new Date()
        .toLocaleTimeString();

    line.className =
        "logLine " + type;

    line.innerHTML =
        `<span class="logTime">[${time}]</span> ${
            escapeHTML(message)
        }`;

    box.appendChild(line);

    while(box.children.length > 80){
        box.removeChild(box.firstChild);
    }

    box.scrollTop =
        box.scrollHeight;
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

    const rect =
        viewport.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(rect.width*dpr);

    canvas.height =
        Math.floor(rect.height*dpr);

    canvas.style.width =
        rect.width+"px";

    canvas.style.height =
        rect.height+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    resizeIndicatorCanvas();

    drawChart();
}


function resizeIndicatorCanvas(){

    const rect =
        indicatorCanvas
        .getBoundingClientRect();

    if(!rect.width) return;

    const dpr =
        window.devicePixelRatio || 1;

    indicatorCanvas.width =
        Math.floor(rect.width*dpr);

    indicatorCanvas.height =
        Math.floor(rect.height*dpr);

    ictx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   PRICE FORMAT
========================================================= */

function formatPrice(price){

    if(!Number.isFinite(price)){
        return "--";
    }

    return Number(price).toFixed(2);
}


/* =========================================================
   DERIV PUBLIC WS
========================================================= */

function openPublicWS(){

    if(
        publicWS &&
        (
            publicWS.readyState ===
            WebSocket.OPEN ||
            publicWS.readyState ===
            WebSocket.CONNECTING
        )
    ){
        return;
    }

    publicWS =
        new WebSocket(PUBLIC_WS);

    publicWS.onopen =
        ()=>{
            log(
                "Deriv live market stream connected.",
                "good"
            );

            subscribeMarketData();
        };

    publicWS.onmessage =
        event=>{

            let data;

            try{
                data =
                    JSON.parse(event.data);
            }catch{
                return;
            }

            handlePublicMessage(data);
        };

    publicWS.onerror =
        ()=>{
            log(
                "Deriv public market stream error.",
                "bad"
            );
        };

    publicWS.onclose =
        ()=>{
            if(connected){
                log(
                    "Deriv market stream closed.",
                    "warn"
                );
            }
        };
}


/* =========================================================
   MARKET STREAM
========================================================= */

function subscribeMarketData(){

    if(
        !publicWS ||
        publicWS.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    tickHistory = [];
    chartBars = [];
    currentTick = null;
    panOffset = 0;

    const historyReq =
        req();

    publicWS.send(
        JSON.stringify({
            ticks_history:
                currentMarket,
            count:1500,
            end:"latest",
            style:"ticks",
            req_id:historyReq
        })
    );

    const tickReq =
        req();

    tickSubscription = tickReq;

    publicWS.send(
        JSON.stringify({
            ticks:
                currentMarket,
            subscribe:1,
            req_id:tickReq
        })
    );
}


/* =========================================================
   PUBLIC MESSAGE
========================================================= */

function handlePublicMessage(data){

    if(data.error){

        log(
            data.error.message ||
            "Deriv market error.",
            "bad"
        );

        return;
    }

    if(
        data.msg_type ===
        "history"
    ){

        processHistoricalTicks(data);
        return;
    }

    if(
        data.msg_type ===
        "tick"
    ){

        const tick =
            data.tick;

        if(!tick) return;

        const quote =
            Number(tick.quote);

        const epoch =
            Number(tick.epoch);

        if(
            !Number.isFinite(quote) ||
            !Number.isFinite(epoch)
        ){
            return;
        }

        currentTick = {
            quote,
            epoch
        };

        tickHistory.push(
            currentTick
        );

        if(
            tickHistory.length > 3000
        ){
            tickHistory.shift();
        }

        $("livePrice")
            .textContent =
            formatPrice(quote);

        updateChartFromTicks();
    }
}


/* =========================================================
   HISTORICAL TICKS
========================================================= */

function processHistoricalTicks(data){

    const prices =
        data.history?.prices || [];

    const times =
        data.history?.times || [];

    tickHistory = [];

    for(
        let i=0;
        i<Math.min(
            prices.length,
            times.length
        );
        i++
    ){

        const quote =
            Number(prices[i]);

        const epoch =
            Number(times[i]);

        if(
            Number.isFinite(quote) &&
            Number.isFinite(epoch)
        ){

            tickHistory.push({
                quote,
                epoch
            });
        }
    }

    if(tickHistory.length){

        currentTick =
            tickHistory[
                tickHistory.length-1
            ];

        $("livePrice")
            .textContent =
            formatPrice(
                currentTick.quote
            );
    }

    updateChartFromTicks();

    log(
        "Loaded "+
        tickHistory.length+
        " Deriv market ticks.",
        "good"
    );
}


/* =========================================================
   BUILD BARS
========================================================= */

function buildBars(ticks,mode){

    if(!ticks.length) return [];

    const bars = [];

    if(mode === "1t"){

        for(const t of ticks){

            bars.push({
                time:t.epoch,
                open:t.quote,
                high:t.quote,
                low:t.quote,
                close:t.quote
            });
        }

        return bars.slice(-500);
    }

    if(mode === "5t"){

        for(
            let i=0;
            i<ticks.length;
            i+=5
        ){

            const group =
                ticks.slice(i,i+5);

            if(!group.length) continue;

            const values =
                group.map(
                    x=>x.quote
                );

            bars.push({
                time:group[0].epoch,
                open:values[0],
                high:Math.max(...values),
                low:Math.min(...values),
                close:
                    values[
                        values.length-1
                    ]
            });
        }

        return bars.slice(-500);
    }

    let seconds = 60;

    if(mode === "5m")
        seconds = 300;

    if(mode === "15m")
        seconds = 900;

    let bucket = null;
    let bar = null;

    for(const t of ticks){

        const key =
            Math.floor(
                t.epoch/seconds
            )*seconds;

        if(bucket !== key){

            if(bar)
                bars.push(bar);

            bucket = key;

            bar = {
                time:key,
                open:t.quote,
                high:t.quote,
                low:t.quote,
                close:t.quote
            };

        }else{

            bar.high =
                Math.max(
                    bar.high,
                    t.quote
                );

            bar.low =
                Math.min(
                    bar.low,
                    t.quote
                );

            bar.close =
                t.quote;
        }
    }

    if(bar)
        bars.push(bar);

    return bars.slice(-500);
}


/* =========================================================
   VISIBLE RANGE
========================================================= */

function getVisibleRange(totalBars){

    const visible =
        Math.max(
            20,
            Math.floor(
                75/zoomLevel
            )
        );

    const end =
        totalBars -
        Math.max(
            0,
            Math.floor(panOffset)
        );

    const start =
        Math.max(
            0,
            end-visible
        );

    return {
        start,
        end
    };
}


/* =========================================================
   PLOT GEOMETRY
========================================================= */

function getPlotGeometry(W){

    const left = 4;

    const priceLabelReserve = 48;

    const gridGap =
        W/8;

    const plotW =
        Math.max(
            40,
            W-
            priceLabelReserve-
            gridGap
        );

    return {
        left,
        plotW
    };
}

/* =========================================================
   CHART DRAW
========================================================= */

function drawChart(){

    const rect =
        viewport.getBoundingClientRect();

    const W = rect.width;
    const H = rect.height;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle =
        "#071321";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!chartBars.length){

        ctx.fillStyle =
            "#60768c";

        ctx.font =
            "12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            connected
            ? "Waiting for Deriv live price..."
            : "Connect to load Deriv market",
            W/2,
            H/2
        );

        return;
    }

    const {
        start,
        end
    } = getVisibleRange(
        chartBars.length
    );

    const view =
        chartBars.slice(
            start,
            end
        );

    if(!view.length) return;

    let min =
        Math.min(
            ...view.map(
                b=>b.low
            )
        );

    let max =
        Math.max(
            ...view.map(
                b=>b.high
            )
        );

    const range =
        max-min || 1;

    min -= range*.08;
    max += range*.08;

    const topPad = 28;
    const bottomPad = 25;

    ctx.strokeStyle =
        "rgba(90,120,150,.14)";

    ctx.lineWidth = 1;

    const gridCols = 8;

    const cellSize =
        W/gridCols;

    const plotAreaH =
        H-topPad-bottomPad;

    const gridRows =
        Math.max(
            2,
            Math.round(
                plotAreaH/cellSize
            )
        );

    for(let i=1;i<gridRows;i++){

        const y =
            topPad+
            plotAreaH*i/gridRows;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    for(let i=1;i<gridCols;i++){

        const x =
            W*i/gridCols;

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    function priceY(price){

        return (
            topPad+
            (
                max-price
            )/(max-min)*
            (
                H-topPad-bottomPad
            )
        );
    }

    ctx.font =
        "9px Arial";

    ctx.textAlign =
        "right";

    ctx.fillStyle =
        "#61778d";

    for(let i=0;i<=gridRows;i++){

        const p =
            max-
            (
                max-min
            )*i/gridRows;

        const y =
            topPad+
            plotAreaH*i/gridRows;

        ctx.fillText(
            formatPrice(p),
            W-4,
            y-2
        );
    }

    const {
        left,
        plotW
    } = getPlotGeometry(W);

    if(currentChartStyle === "line"){

        ctx.beginPath();

        view.forEach(
            (bar,i)=>{

                const x =
                    left+
                    i*
                    (
                        plotW/
                        Math.max(
                            1,
                            view.length-1
                        )
                    );

                const y =
                    priceY(
                        bar.close
                    );

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }
        );

        ctx.strokeStyle =
            "#3ab8ff";

        ctx.lineWidth = 1.6;

        ctx.stroke();

    }else{

        const spacing =
            plotW/view.length;

        const candleW =
            Math.max(
                2,
                spacing*.65
            );

        view.forEach(
            (bar,i)=>{

                const x =
                    left+
                    i*spacing+
                    spacing/2;

                const openY =
                    priceY(bar.open);

                const closeY =
                    priceY(bar.close);

                const highY =
                    priceY(bar.high);

                const lowY =
                    priceY(bar.low);

                const up =
                    bar.close >=
                    bar.open;

                ctx.strokeStyle =
                    up
                    ? "#23c88a"
                    : "#ef536a";

                ctx.fillStyle =
                    ctx.strokeStyle;

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    highY
                );

                ctx.lineTo(
                    x,
                    lowY
                );

                ctx.stroke();

                ctx.fillRect(
                    x-candleW/2,
                    Math.min(
                        openY,
                        closeY
                    ),
                    candleW,
                    Math.max(
                        1,
                        Math.abs(
                            openY-closeY
                        )
                    )
                );
            }
        );
    }

    /* MA ON MAIN CHART */

    if(
        activeIndicator === "MA" &&
        maLocation === "main"
    ){

        const values =
            calculateSMA(
                view.map(
                    b=>b.close
                ),
                maLength
            );

        drawMainMA(
            values,
            view,
            priceY,
            left,
            plotW
        );
    }

    /* LIVE PRICE */

    if(currentTick){

        const y =
            priceY(
                currentTick.quote
            );

        ctx.setLineDash([
            4,
            4
        ]);

        ctx.strokeStyle =
            "#39b9ff";

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle =
            "#1675d1";

        ctx.fillRect(
            W-49,
            y-9,
            49,
            18
        );

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "9px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            formatPrice(
                currentTick.quote
            ),
            W-24,
            y+3
        );
    }

    /* POSITION LINES */

    for(const position of positions){

        if(
            position.entrySpot == null
        ){
            continue;
        }

        const entry =
            Number(
                position.entrySpot
            );

        const y =
            priceY(entry);

        ctx.setLineDash([
            7,
            4
        ]);

        ctx.strokeStyle =
            position.direction === "RISE"
            ? "#21d68c"
            : "#ff4e69";

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle =
            position.direction === "RISE"
            ? "#21d68c"
            : "#ff4e69";

        ctx.font =
            "bold 9px Arial";

        ctx.textAlign =
            "left";

        ctx.fillText(
            position.direction+
            " "+
            formatPrice(entry),
            7,
            y-4
        );
    }
}


/* =========================================================
   SMA
========================================================= */

function calculateSMA(prices,period){

    const result =
        new Array(
            prices.length
        ).fill(null);

    if(
        !prices.length ||
        period < 1
    ){
        return result;
    }

    let sum = 0;

    for(
        let i=0;
        i<prices.length;
        i++
    ){

        sum +=
            Number(prices[i]);

        if(i>=period){
            sum -=
                Number(
                    prices[i-period]
                );
        }

        if(
            i>=period-1
        ){
            result[i] =
                sum/period;
        }
    }

    return result;
}


/* =========================================================
   RSI
========================================================= */

function calculateRSIValues(
    prices,
    period=14
){

    const result =
        new Array(
            prices.length
        ).fill(null);

    if(
        prices.length <= period ||
        period < 1
    ){
        return result;
    }

    let gains = 0;
    let losses = 0;

    for(
        let i=1;
        i<=period;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];

        if(change>0)
            gains += change;
        else
            losses -= change;
    }

    let avgGain =
        gains/period;

    let avgLoss =
        losses/period;

    result[period] =
        avgLoss===0
        ? 100
        : 100-
          (
            100/
            (
                1+
                avgGain/avgLoss
            )
          );

    for(
        let i=period+1;
        i<prices.length;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];

        const gain =
            change>0
            ? change
            : 0;

        const loss =
            change<0
            ? -change
            : 0;

        avgGain =
            (
                avgGain*(period-1)+
                gain
            )/period;

        avgLoss =
            (
                avgLoss*(period-1)+
                loss
            )/period;

        result[i] =
            avgLoss===0
            ? 100
            : 100-
              (
                100/
                (
                    1+
                    avgGain/avgLoss
                )
              );
    }

    return result;
}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
    values,
    period
){

    const result =
        new Array(
            values.length
        ).fill(null);

    if(
        values.length===0 ||
        period<1
    ){
        return result;
    }

    const k =
        2/(period+1);

    let seed = 0;
    let count = 0;
    let previous = null;

    for(
        let i=0;
        i<values.length;
        i++
    ){

        const value =
            Number(values[i]);

        if(!Number.isFinite(value))
            continue;

        if(count<period){

            seed += value;
            count++;

            if(count===period){

                previous =
                    seed/period;

                result[i] =
                    previous;
            }

        }else{

            previous =
                value*k+
                previous*(1-k);

            result[i] =
                previous;
        }
    }

    return result;
}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(
    prices,
    fast=12,
    slow=26,
    signal=9
){

    const fastEMA =
        calculateEMA(
            prices,
            fast
        );

    const slowEMA =
        calculateEMA(
            prices,
            slow
        );

    const macd =
        new Array(
            prices.length
        ).fill(null);

    for(
        let i=0;
        i<prices.length;
        i++
    ){

        if(
            fastEMA[i] != null &&
            slowEMA[i] != null
        ){

            macd[i] =
                fastEMA[i]-
                slowEMA[i];
        }
    }

    const validMACD =
        macd.map(
            x =>
                x == null
                ? 0
                : x
        );

    const signalLine =
        calculateEMA(
            validMACD,
            signal
        );

    const histogram =
        macd.map(
            (x,i)=>
                x == null ||
                signalLine[i] == null
                ? null
                : x-signalLine[i]
        );

    return {
        macd,
        signal:signalLine,
        histogram
    };
}


/* =========================================================
   DRAW MAIN MA
========================================================= */

function drawMainMA(
    values,
    bars,
    priceY,
    left,
    plotW
){

    const spacing =
        plotW/bars.length;

    ctx.beginPath();

    let started = false;

    values.forEach(
        (value,i)=>{

            if(value==null)
                return;

            const x =
                left+
                i*spacing+
                spacing/2;

            const y =
                priceY(value);

            if(!started){

                ctx.moveTo(x,y);
                started=true;

            }else{

                ctx.lineTo(x,y);
            }
        }
    );

    if(started){

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 1.7;

        ctx.stroke();
    }
}


/* =========================================================
   INDICATOR WINDOW
========================================================= */

function updateIndicatorWindow(){

    if(!activeIndicator){

        $("indicatorWindow")
            .classList.remove(
                "visible"
            );

        return;
    }

    if(
        activeIndicator === "MA" &&
        maLocation === "main"
    ){

        $("indicatorWindow")
            .classList.remove(
                "visible"
            );

        return;
    }

    $("indicatorWindow")
        .classList.add(
            "visible"
        );

    resizeIndicatorCanvas();

    drawIndicatorWindow();
}


/* =========================================================
   INDICATOR DRAW
========================================================= */

function drawIndicatorWindow(){

    const W =
        indicatorCanvas.clientWidth;

    const H =
        indicatorCanvas.clientHeight;

    ictx.clearRect(
        0,
        0,
        W,
        H
    );

    ictx.fillStyle =
        "#071321";

    ictx.fillRect(
        0,
        0,
        W,
        H
    );

    if(
        !chartBars.length ||
        !activeIndicator
    ){
        return;
    }

    const {
        start,
        end
    } = getVisibleRange(
        chartBars.length
    );

    const bars =
        chartBars.slice(
            start,
            end
        );

    if(!bars.length) return;

    const fullPrices =
        chartBars.map(
            b=>b.close
        );

    if(
        activeIndicator ===
        "RSI"
    ){

        drawRSI(
            fullPrices,
            start,
            end
        );

    }else if(
        activeIndicator ===
        "MACD"
    ){

        drawMACD(
            fullPrices,
            start,
            end
        );

    }else if(
        activeIndicator ===
        "MA"
    ){

        drawWindowMA(
            fullPrices,
            start,
            end
        );
    }
}

function drawIndicatorGrid(
    min,
    max,
    W,
    H,
    top=8,
    bottom=18
){

    ictx.strokeStyle =
        "rgba(90,120,150,.15)";

    ictx.lineWidth=1;

    for(
        let i=1;
        i<5;
        i++
    ){

            top+

                H-top-bottom
            )*i/5;

        ictx.beginPath();
        ictx.moveTo(0,y);
        ictx.lineTo(W,y);
        ictx.stroke();
    }
}

/* =========================================================
   MACD WINDOW
========================================================= */

function drawMACD(
    fullPrices,
    start,
    end
){

    const W =
        indicatorCanvas.clientWidth;

    const H =
        indicatorCanvas.clientHeight;

    const fullResult =
        calculateMACD(
            fullPrices,
            macdFast,
            macdSlow,
            macdSignal
        );

    const result = {
        macd:
            fullResult.macd.slice(
                start,
                end
            ),
        signal:
            fullResult.signal.slice(
                start,
                end
            ),
        histogram:
            fullResult.histogram.slice(
                start,
                end
            )
    };

    let all = [];

    result.macd.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    result.signal.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    result.histogram.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    if(!all.length)
        return;

    let max =
        Math.max(
            ...all
        );

    let min =
        Math.min(
            ...all
        );

    const range =
        max-min || 1;

    max += range*.12;
    min -= range*.12;

    function y(v){

        return 8+
            (
                max-v
            )/
            (max-min)*
            (
                H-26
            );
    }

    const zeroY =
        y(0);

    ictx.strokeStyle =
        "rgba(120,140,160,.35)";

    ictx.beginPath();

    ictx.moveTo(
        0,
        zeroY
    );

    ictx.lineTo(
        W,
        zeroY
    );

    ictx.stroke();

    const {
        left:histLeft,
        plotW:histPlotW
    } = getPlotGeometry(W);

    const spacing =
        histPlotW/
        result.histogram.length;

    result.histogram.forEach(
        (value,i)=>{

            if(value==null)
                return;

            const x =
                histLeft+
                i*spacing+
                spacing/2;

            const yy =
                y(value);

            ictx.fillStyle =
                value>=0
                ? "rgba(45,210,145,.75)"
                : "rgba(239,83,106,.75)";

            ictx.fillRect(
                x-spacing*.3,
                Math.min(
                    yy,
                    zeroY
                ),
                spacing*.6,
                Math.max(
                    1,
                    Math.abs(
                        yy-zeroY
                    )
                )
            );
        }
    );

    drawIndicatorLine(
        result.macd,
        y,
        W,
        H,
        "#45b9ff"
    );

    drawIndicatorLine(
        result.signal,
        y,
        W,
        H,
        "#ffc857"
    );

    drawIndicatorLabel(
        "MACD "+
        macdFast+
        ","+
        macdSlow+
        ","+
        macdSignal,
        "#45b9ff"
    );
}


/* =========================================================
   MA WINDOW
========================================================= */

function drawWindowMA(
    fullPrices,
    start,
    end
){

        calculateSMA(

    let min =
        Math.min(...valid);

    let max =
        Math.max(...valid);

    const range =
        max-min || 1;

    min -= range*.1;
    max += range*.1;

    function y(v){

        return 8+
            (
                max-v
            )/
            (max-min)*
            (
                H-26
            );
    }

    drawIndicatorLine(
        values,
        y,
        W,

        "#ffffff"
    );

    drawIndicatorLabel(
        "SMA "+maLength,
        "#ffffff"
    );
}


/* =========================================================
   GENERIC INDICATOR LINE
========================================================= */

function drawIndicatorLine(
    values,
    y,
    W,
    H,
    strokeColor
){

    if(!values.length)
        return;

    const {
        left,
        plotW
    } = getPlotGeometry(W);

    const spacing =
        plotW/
        values.length;

    ictx.beginPath();

    let started=false;

    values.forEach(
        (value,i)=>{

            if(
                value==null ||
                !Number.isFinite(value)
            ){
                return;
            }

            const x =
                left+
                i*spacing+
                spacing/2;

            const yy =
                y(value);

            if(!started){

                ictx.moveTo(
                    x,
                    yy
                );

                started=true;

            }else{

                ictx.lineTo(
                    x,
                    yy
                );
            }
        }
    );

    if(started){

        ictx.strokeStyle =
            strokeColor;

        ictx.lineWidth=1.6;

        ictx.stroke();
    }
}

/* =========================================================
   REMAINING TIME
========================================================= */

function formatRemaining(
    expiryTime
){

    if(!expiryTime)
        return "--";

    const remaining =
        Math.max(
            0,
            expiryTime-
            Date.now()
        );

    const seconds =
        Math.ceil(
            remaining/1000
        );

    if(seconds<=0)
        return "SETTLING";

    const m =
        Math.floor(
            seconds/60
        );

    const s =
        seconds%60;

    return (
        m+
        ":"+
        String(s)
            .padStart(2,"0")
    );
}


/* =========================================================
   EXPIRY OBJECT
========================================================= */

function expiryToObject(value){

    if(value === "custom"){

        return {
            duration:
                customExpirySeconds,
            unit:"s"
        };
    }

    if(value.endsWith("t")){

        return {
            duration:
                Number(
                    value.replace("t","")
                ),
            unit:"t"
        };
    }

    if(value.endsWith("m")){

        return {
            duration:
                Number(
                    value.replace("m","")
                ),
            unit:"m"
        };
    }

    return {
        duration:5,
        unit:"m"
    };
}


/* =========================================================
   REFRESH LIVE PROPOSALS
========================================================= */

function refreshLiveProposals(){

    if(
        !connected ||
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    const stake =
        Number(
            $("stake").value
        );

    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){
        return;
    }

    const expiryValue =
        $("tradeExpiry").value;

    const exp =
        expiryToObject(
            expiryValue
        );

    const key =
        currentMarket+
        "|"+
        stake+
        "|"+
        exp.duration+
        exp.unit;

    if(key === liveProposalKey){
        return;
    }

    liveProposalKey = key;

    ["RISE","FALL"].forEach(
        direction=>{

            const subId =
                liveProposalSubIds[
                    direction
                ];

            if(
                subId &&
                authenticatedWS.readyState ===
                WebSocket.OPEN
            ){

                authenticatedWS.send(
                    JSON.stringify({
                        forget:subId
                    })
                );
            }

            liveProposalSubIds[
                direction
            ] = null;

            liveProposals[
                direction
            ] = null;
        }
    );

    ["RISE","FALL"].forEach(
        direction=>{

            const contractType =
                direction === "RISE"
                ? "CALL"
                : "PUT";

            const reqId =
                req();

            liveProposalReqIds[
                reqId
            ] = direction;

            authenticatedWS.send(
                JSON.stringify({
                    proposal:1,
                    subscribe:1,
                    amount:stake,
                    basis:"stake",
                    contract_type:
                        contractType,
                    currency:
                        accountCurrency,
                    duration:
                        exp.duration,
                    duration_unit:
                        exp.unit,
                    underlying_symbol:
                        currentMarket,
                    req_id:reqId
                })
            );
        }
    );
}

/* =========================================================
   GET ACCOUNTS
========================================================= */

async function getAccounts(){

    log(
        "Requesting Deriv accounts...",
        "info"
    );

    const response =
        await fetch(
            API_BASE+
            "/trading/v1/options/accounts",
            {
                method:"GET",
                headers:{
                    "Deriv-App-ID":
                        APP_ID,
                    "Authorization":
                        "Bearer "+pat,
                    "Accept":
                        "application/json"
                }
            }
        );

    const json =
        await response.json();

    if(!response.ok){

        const message =
            json?.errors?.[0]?.message ||
            json?.message ||
            "Unable to retrieve Deriv Options accounts.";

        throw new Error(message);
    }

    let result = [];

    if(Array.isArray(json.data)){
        result = json.data;
    }else if(json.data && Array.isArray(json.data.accounts)){
        result = json.data.accounts;
    }else if(Array.isArray(json.accounts)){
        result = json.accounts;
    }else if(json.data && (json.data.account_id || json.data.loginid)){
        result = [json.data];
    }

    if(!result.length){
        throw new Error("Deriv returned no Options accounts.");
    }

    return result;
}


/* =========================================================
   FIND SELECTED ACCOUNT
========================================================= */

function findSelectedAccount(
    accounts
){

    const wanted =
        selectedAccountType ===
        "demo"
            ? "demo"
            : "real";

    let account =
        accounts.find(
            a =>
                String(
                    a.account_type ||
                    ""
                ).toLowerCase() ===
                wanted
        );

    if(account){
        return account;
    }

    const prefix =
        selectedAccountType ===
        "demo"
            ? "DOT"
            : "CR";

    account =
        accounts.find(
            a =>
                String(
                    a.account_id ||
                    a.loginid ||
                    ""
                ).toUpperCase()
                .startsWith(
                    prefix
                )
        );

    return account ||
        null;
}

/* =========================================================
   AUTHENTICATED WS
========================================================= */

function openAuthenticatedWS(
    url,
    generation
){

    return new Promise(
        (resolve,reject)=>{

            let settled=false;

            const ws =
                new WebSocket(url);

            authenticatedWS =
                ws;

            const timeout =
                setTimeout(
                    ()=>{

                        if(!settled){

                            settled=true;

                            try{
                                ws.close();
                            }catch{}

                            reject(
                                new Error(
                                    "Deriv trading connection timed out."
                                )
                            );
                        }

                    },
                    15000
                );

            ws.onopen =
                ()=>{

                    clearTimeout(timeout);

                    if(
                        generation !==
                        connectionGeneration
                    ){

                        try{
                            ws.close();
                        }catch{}

                        return;
                    }

                    if(!settled){

                        settled=true;

                        resolve();
                    }
                };

            ws.onerror =
                ()=>{

                    clearTimeout(timeout);

                    if(!settled){

                        settled=true;

                        reject(
                            new Error(
                                "Deriv authenticated WebSocket connection failed."
                            )
                        );
                    }
                };

            ws.onclose =
                ()=>{

                    if(ws !== authenticatedWS){
                        return;
                    }

                    if(connected){

                        connected=false;

                        $("connectBtn")
                            .textContent =
                            "CONNECT";

                        $("connectBtn")
                            .classList
                            .remove(
                                "connected"
                            );

                        $("chartStatus")
                            .textContent =
                            "DISCONNECTED";

                        log(
                            "Deriv trading connection closed.",
                            "warn"
                        );
                    }
                };

            ws.onmessage =
                event=>{

                    let data;

                    try{
                        data =
                            JSON.parse(
                                event.data
                            );
                    }catch{
                        return;
                    }

                    handleAuthenticatedMessage(
                        data
                    );
                };
        }
    );
}


/* =========================================================
   AUTHENTICATED MESSAGE
========================================================= */

function handleAuthenticatedMessage(data){

    if(data.error){

        log(
            data.error.message ||
            "Deriv trading API error.",
            "bad"
        );

        const failedTrade =
            pendingTrades.get(
                Number(data.req_id)
            );

        if(failedTrade && failedTrade.btn){

            unlockTradeButton(
                failedTrade.direction,
                failedTrade.btn,
                failedTrade.originalHTML
            );

            pendingTrades.delete(
                Number(data.req_id)
            );
        }

        return;
    }

    if(
        data.msg_type ===
        "balance"
    ){

        const b =
            data.balance;

        if(b){

            $("balance")
                .textContent =
                "$"+
                Number(
                    b.balance
                ).toFixed(2);
        }

        return;
    }

    if(
        data.msg_type ===
        "proposal"
    ){

        handleProposal(data);

        return;
    }

    if(
        data.msg_type ===
        "buy"
    ){

        handleBuyResponse(data);

        return;
    }

    if(
        data.msg_type ===
        "proposal_open_contract"
    ){

        handleOpenContract(
            data.proposal_open_contract
        );

        return;
    }

    if(
        data.msg_type ===
        "tick"
    ){
        return;
    }
}

    );

    log(
        "Account balance and trading streams started.",
        "good"
    );
}


/* =========================================================
   TRADE BUTTONS
========================================================= */

let tradeLock = {
    RISE:false,
    FALL:false
};

let lastTradeFire = {
    RISE:0,
    FALL:0
};

function fireTrade(direction,event){

    if(event && event.cancelable){
        event.preventDefault();
    }

    const now =
        Date.now();

    if(
        now-lastTradeFire[direction] <
        600
    ){
        return;
    }

    lastTradeFire[direction] =
        now;

    placeTrade(direction);
}

["riseBtn","fallBtn"].forEach(
    id=>{

        const direction =
            id === "riseBtn"
            ? "RISE"
            : "FALL";

        const btn =
            $(id);

        btn.addEventListener(
            "pointerdown",
            e=>fireTrade(direction,e)
        );

        btn.addEventListener(
            "click",
            e=>fireTrade(direction,e)
        );
    }
);


/* =========================================================
   PLACE TRADE
========================================================= */

function placeTrade(direction){

    if(tradeLock[direction]){
        return;
    }

    if(!connected){

        log(
            "Connect to Deriv before trading.",
            "bad"
        );

        return;
    }

    if(
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){

        log(
            "Trading connection is not ready.",
            "bad"
        );

        return;
    }

    const stake =
        Number(
            $("stake").value
        );

    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){

        log(
            "Minimum stake is 1.",
            "bad"
        );

        return;
    }

    const expiry =
        $("tradeExpiry").value;

    const exp =
        expiryToObject(
            expiry
        );

    const contractType =
        direction === "RISE"
        ? "CALL"
        : "PUT";

    tradeLock[direction] = true;

    const btn =
        direction === "RISE"
        ? $("riseBtn")
        : $("fallBtn");

    const originalHTML =
        btn.innerHTML;

    btn.classList.add(
        "sending"
    );

    btn.innerHTML =
        "SENDING…";

    /* FAST PATH: cached live proposal */

    const key =
        currentMarket+
        "|"+
        stake+
        "|"+
        exp.duration+
        exp.unit;

    const cached =
        liveProposals[direction];

    if(
        cached &&
        key === liveProposalKey &&
        (Date.now()-cached.updatedAt) <
        LIVE_PROPOSAL_MAX_AGE_MS
    ){

        const buyReq =
            req();

        pendingTrades.set(
            buyReq,
            {
                direction,
                stake,
                expiry,
                market:currentMarket,
                btn,
                originalHTML,
                buyReq:true
            }
        );

        authenticatedWS.send(
            JSON.stringify({
                buy:
                    cached.id,
                price:
                    cached.price,
                req_id:
                    buyReq
            })
        );

        log(
            "Fast entry: "+
            direction+
            " (live price).",
            "info"
        );

        setTimeout(
            ()=>{
                if(
                    tradeLock[direction] &&
                    btn.classList.contains(
                        "sending"
                    )
                ){
                    unlockTradeButton(
                        direction,
                        btn,
                        originalHTML
                    );
                }
            },
            8000
        );

        return;
    }

    /* FALLBACK: request proposal */

    const request =
        req();

    pendingTrades.set(
        request,
        {
            direction,
            stake,
            expiry,
            market:currentMarket,
            btn,
            originalHTML,
            proposalReq:true
        }
    );

    authenticatedWS.send(
        JSON.stringify({
            proposal:1,
            amount:stake,
            basis:"stake",
            contract_type:
                contractType,
            currency:
                accountCurrency,
            duration:
                exp.duration,
            duration_unit:
                exp.unit,
            underlying_symbol:
                currentMarket,
            req_id:request
        })
    );

    log(
        "Requesting Deriv "+
        direction+
        " proposal...",
        "info"
    );

    setTimeout(
        ()=>{
            if(
                tradeLock[direction] &&
                btn.classList.contains(
                    "sending"
                )
            ){
                unlockTradeButton(
                    direction,
                    btn,
                    originalHTML
                );
            }
        },
        8000
    );
}


function unlockTradeButton(
    direction,
    btn,
    originalHTML
){

    tradeLock[direction] = false;

    btn.classList.remove(
        "sending"
    );

    btn.innerHTML =
        originalHTML;
}


/* =========================================================
   PROPOSAL
========================================================= */

function handleProposal(data){

    const proposal =
        data.proposal;

    if(!proposal)
        return;

    const reqId =
        Number(data.req_id);

    /* Background live-stream update */

    const liveDirection =
        liveProposalReqIds[reqId];

    if(liveDirection){

        const liveAsk =
            Number(
                proposal.ask_price
            );

        if(
            proposal.id &&
            Number.isFinite(liveAsk)
        ){

            liveProposals[
                liveDirection
            ] = {
                id:proposal.id,
                price:liveAsk,
                updatedAt:Date.now()
            };

            if(
                data.subscription &&
                data.subscription.id
            ){

                liveProposalSubIds[
                    liveDirection
                ] =
                    data.subscription.id;
            }
        }

        return;
    }

    const trade =
        pendingTrades.get(reqId);

    if(!trade)
        return;

    pendingTrades.delete(reqId);

    const askPrice =
        Number(
            proposal.ask_price
        );

    if(
        !proposal.id ||
        !Number.isFinite(askPrice)
    ){

        log(
            "Invalid Deriv proposal.",
            "bad"
        );

        if(trade.btn){

            unlockTradeButton(
                trade.direction,
                trade.btn,
                trade.originalHTML
            );
        }

        return;
    }

    const buyReq =
        req();

    pendingTrades.set(
        buyReq,
        {
            ...trade,
            proposalId:
                proposal.id,
            askPrice,
            buyReq:true
        }
    );

    authenticatedWS.send(
        JSON.stringify({
            buy:
                proposal.id,
            price:
                askPrice,
            req_id:
                buyReq
        })
    );
}


/* =========================================================
   BUY
========================================================= */

function handleBuyResponse(data){

    const buy =
        data.buy;

    if(!buy)
        return;

    let trade =
        pendingTrades.get(
            Number(data.req_id)
        );

    if(!trade){

        /* Try to find any pending buy request */
        for(
            const [
                key,
                value
            ] of pendingTrades
        ){

            if(
                value &&
                value.buyReq
            ){

                trade =
                    value;

                pendingTrades.delete(
                    key
                );

                break;
            }
        }

        if(!trade){

            log(
                "Received buy response without matching request.",
                "warn"
            );

            return;
        }
    }else{

        pendingTrades.delete(
            Number(data.req_id)
        );
    }

    if(trade.btn){

        unlockTradeButton(
            trade.direction,
            trade.btn,
            trade.originalHTML
        );
    }

    if(!buy.contract_id){

        log(
            "No contract ID returned by Deriv.",
            "bad"
        );

        return;
    }

    const position = {

        id:
            buy.contract_id,

        contractId:
            buy.contract_id,

        market:
            trade.market || currentMarket,

        direction:
            trade.direction,

        stake:
            trade.stake,

        entrySpot:
            null,

        profit:0,

        expiryTime:null,

        buyPrice:
            Number(
                buy.buy_price ||
                trade.askPrice ||
                0
            ),

        status:"open"
    };

    positions.push(
        position
    );

    renderPositions();

    drawChart();

    log(
        "Opened "+
        trade.direction+
        " position on "+
        (trade.market || currentMarket)+
        ".",
        "good"
    );

    authenticatedWS.send(
        JSON.stringify({
            proposal_open_contract:1,
            contract_id:
                position.id,
            subscribe:1,
            req_id:req()
        })
    );
}


/* =========================================================
   OPEN CONTRACT
========================================================= */

function handleOpenContract(contract){

    if(!contract)
        return;

    const id =
        String(
            contract.contract_id
        );

    const position =
        positions.find(
            p =>
                String(p.id) === id
        );

    if(!position)
        return;

    if(
        contract.entry_spot != null
    ){

        position.entrySpot =
            Number(
                contract.entry_spot
            );
    }

    if(
        contract.date_expiry != null
    ){

        position.expiryTime =
            Number(
                contract.date_expiry
            )*1000;
    }

    if(
        contract.profit != null
    ){

        position.profit =
            Number(
                contract.profit
            );
    }

    position.status =
        contract.status ||
        (
            contract.is_sold
                ? "sold"
                : "open"
        );

    renderPositions();

    drawChart();

    if(
        contract.is_sold ||
        contract.status === "sold" ||
        contract.status === "won" ||
        contract.status === "lost"
    ){

        finishPosition(
            position,
            contract
        );
    }
}


/* =========================================================
   FINISH POSITION
========================================================= */

function finishPosition(
    position,
    contract
){

    const profit =
        Number(
            contract.profit ||
            position.profit ||
            0
        );

    position.profit =
        profit;

    renderPositions();

    log(
        position.market+
        " "+
        position.direction+
        " settled: "+
        (
            profit>=0
            ? "WIN "
            : "LOSS "
        )+
        profit.toFixed(2),
        profit>=0
        ? "good"
        : "bad"
    );

    setTimeout(
        ()=>{

            positions =
                positions.filter(
                    p =>
                        String(p.id) !==
                        String(position.id)
                );

            renderPositions();

            drawChart();

        },
        1200
    );
}


/* =========================================================
   MARKET CHANGE
========================================================= */

function changeMarket(symbol){

    if(!symbol)
        return;

    currentMarket =
        symbol;

    $("marketSelect")
        .value =
        symbol;

    tickHistory=[];
    chartBars=[];
    currentTick=null;
    panOffset=0;

    $("livePrice")
        .textContent =
        "--";

    $("chartMarketName")
        .textContent =
        symbol;

    if(
        publicWS &&
        publicWS.readyState ===
        WebSocket.OPEN
    ){

        if(tickSubscription){
            try{
                publicWS.send(
                    JSON.stringify({
                        forget:tickSubscription
                    })
                );
            }catch{}
        }

        subscribeMarketData();

    }else if(connected){

        openPublicWS();
    }

    if(
        authenticatedWS &&
        authenticatedWS.readyState ===
        WebSocket.OPEN
    ){

        try{
            authenticatedWS.send(
                JSON.stringify({
                    ticks:currentMarket,
                    subscribe:1,
                    req_id:req()
                })
            );
        }catch{}
    }

    refreshLiveProposals();

    drawChart();
}


/* =========================================================
   CHART TIME
========================================================= */

function changeChartTime(mode){

    currentChartMode =
        mode;

    $("chartTime")
        .value =
        mode;

    panOffset=0;

    updateChartFromTicks();
}

   SELECT EVENTS
========================================================= */

/* =========================================================
   STAKE INPUT
========================================================= */

let stakeDebounceTimer = null;

$("stake").addEventListener(
    "input",

/* =========================================================
   ZOOM
========================================================= */

$("zoomIn").onclick =

        zoomLevel =
            Math.min(
                4,
                zoomLevel*1.25
            );

        drawChart();
    };


$("zoomOut").onclick =

            Math.max(

            );
