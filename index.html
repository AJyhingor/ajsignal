<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Ganeva Options Bot</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
select,
input{
    font:inherit;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:8px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#fff;
    letter-spacing:.4px;
}

.logo span{
    color:#39a9ff;
}

.priceBox{
    margin-left:auto;
    text-align:right;
}

.priceLabel{
    font-size:10px;
    color:#8192a8;
}

.livePrice{
    font-size:21px;
    font-weight:800;
    color:#48d8ff;
}


/* =========================================================
   CONNECTION
   ========================================================= */

.connection{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:10px;
    padding:9px;
    margin-bottom:8px;
}

.patRow{
    display:flex;
    gap:7px;
}

.patInput{
    flex:1;
    min-width:0;
    height:42px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:7px;
    padding:0 11px;
    outline:none;
}

.patInput:focus{
    border-color:#269cff;
}

.connectBtn{
    width:112px;
    border:0;
    border-radius:7px;
    background:#1675d1;
    color:white;
    font-weight:800;
    cursor:pointer;
}

.connectBtn.connected{
    background:#158447;
}

.connectBtn:disabled{
    opacity:.55;
}


/* =========================================================
   TOP CONTROL BLOCKS
   ========================================================= */

.controlGrid{
    display:grid;
    grid-template-columns:1.15fr 1.35fr 1.15fr;
    gap:9px;
    margin-bottom:8px;
}

.control{
    min-height:92px;
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:10px;
    padding:10px 11px;
}

.controlTitle{
    text-align:center;
    color:#52b7ff;
    font-size:13px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:8px;
}

.controlValue{
    width:100%;
    height:42px;
    border:1px solid #294967;
    border-radius:7px;
    background:#071321;
    color:white;
    text-align:center;
    font-weight:800;
    outline:none;
    font-size:14px;
}

.accountValue{
    font-size:13px;
}


/* =========================================================
   ACCOUNT TYPE
   ========================================================= */

.accountSwitch{
    display:flex;
    gap:6px;
}

.accountSwitch button{
    flex:1;
    height:40px;
    border:1px solid #294967;
    border-radius:7px;
    background:#071321;
    color:#aebfd2;
    font-size:13px;
    font-weight:800;
}

.accountSwitch button.active{
    background:#145e99;
    border-color:#2d9fea;
    color:#fff;
}


/* =========================================================
   CHART
   ========================================================= */

.chartPanel{
    background:#071321;
    border:1px solid #1c3855;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:8px;
}

.chartTop{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    padding:8px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
}

.chartControl label{
    display:block;
    color:#7288a0;
    font-size:9px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.chartControl select{
    width:100%;
    height:34px;
    border:1px solid #294967;
    border-radius:6px;
    background:#071321;
    color:white;
    padding:0 6px;
    outline:none;
}

.chartViewport{
    position:relative;
    width:100%;
    height:430px;
    background:#071321;
    overflow:hidden;
    touch-action:none;
}

#chartCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

.chartInfo{
    position:absolute;
    top:9px;
    left:9px;
    z-index:5;
    padding:8px 10px;
    border-radius:7px;
    background:rgba(5,13,23,.88);
    border:1px solid rgba(83,130,170,.35);
    pointer-events:none;
}

.chartInfo .market{
    font-weight:800;
    color:#fff;
}

.chartInfo .sub{
    color:#91a6bc;
    font-size:10px;
    margin-top:3px;
}

.chartStatus{
    position:absolute;
    right:8px;
    top:8px;
    z-index:5;
    font-size:10px;
    padding:5px 7px;
    border-radius:5px;
    background:rgba(0,0,0,.55);
    color:#65c5ff;
    pointer-events:none;
}


/* =========================================================
   CHART NAVIGATION
   ========================================================= */

.chartNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 8px;
    background:#0b192a;
    border-top:1px solid #162d45;
}

.chartNav button{
    border:1px solid #294967;
    background:#071321;
    color:#a9bdd1;
    border-radius:5px;
    padding:5px 10px;
    font-size:10px;
}

.chartNav span{
    color:#627991;
    font-size:9px;
}


/* =========================================================
   ACCOUNT METRICS
   ========================================================= */

.accountBar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:8px;
}

.metric{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:8px;
    text-align:center;
}

.metricLabel{
    color:#7288a0;
    font-size:9px;
    text-transform:uppercase;
}

.metricValue{
    margin-top:4px;
    font-weight:800;
    font-size:15px;
}


/* =========================================================
   TRADE PAD
   ========================================================= */

.tradePad{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
}

.tradeBtn{
    height:65px;
    border:0;
    border-radius:10px;
    color:white;
    font-weight:900;
    font-size:17px;
    cursor:pointer;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);
    transition:
        transform .08s ease,
        filter .08s ease;
}

.tradeBtn.rise{
    background:#118447;
}

.tradeBtn.fall{
    background:#b92d43;
}

.tradeBtn:active{
    transform:translateY(1px) scale(.995);
    filter:brightness(1.1);
}

.tradeArrow{
    font-size:22px;
    margin-right:5px;
}


/* =========================================================
   STAKE / EXPIRY
   ========================================================= */

.tradeSettings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:8px;
}

.stakeBox,
.expiryBox{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:8px;
}

.stakeBox label,
.expiryBox label{
    display:block;
    text-align:center;
    color:#7288a0;
    font-size:9px;
    margin-bottom:5px;
}

.stakeInput{
    width:100%;
    height:38px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    text-align:center;
    font-weight:800;
    outline:none;
}


/* =========================================================
   OPEN POSITION
   ========================================================= */

.positionPanel{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:10px;
    padding:9px;
    margin-bottom:8px;
}

.positionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    user-select:none;
}

.sectionTitle{
    color:#52b7ff;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.positionArrow{
    color:#7ea7c8;
    font-size:15px;
    transition:transform .15s ease;
}

.positionArrow.open{
    transform:rotate(180deg);
}

.positionBody{
    margin-top:8px;
}

.positionEmpty{
    text-align:center;
    color:#627991;
    font-size:11px;
    padding:9px;
}

.positionsList{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.positionCard{
    background:#071321;
    border:1px solid #1c3855;
    border-radius:7px;
    padding:8px;
}

.positionCard.rise{
    border-left:3px solid #21d68c;
}

.positionCard.fall{
    border-left:3px solid #ff4e69;
}

.positionCardTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.positionDirection{
    font-size:12px;
    font-weight:900;
}

.positionDirection.rise{
    color:#21d68c;
}

.positionDirection.fall{
    color:#ff4e69;
}

.positionContractId{
    color:#627991;
    font-size:8px;
}

.positionGrid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.positionCell{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:6px;
    padding:6px;
    text-align:center;
}

.positionCell small{
    display:block;
    color:#71869b;
    font-size:8px;
    text-transform:uppercase;
}

.positionCell strong{
    display:block;
    margin-top:4px;
    font-size:11px;
}


/* =========================================================
   SYSTEM LOG
   ========================================================= */

.logPanel{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:10px;
    padding:8px;
}

.log{
    max-height:115px;
    overflow-y:auto;
    font-family:monospace;
    font-size:10px;
    line-height:1.6;
}

.logLine{
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:2px 0;
}

.logTime{
    color:#597089;
}

.good{
    color:#45d58b;
}

.bad{
    color:#ff6176;
}

.info{
    color:#74c8ff;
}

.warn{
    color:#ffc857;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    .app{
        padding:5px;
    }

    .controlGrid{
        grid-template-columns:1fr;
    }

    .control{
        min-height:82px;
    }

    .chartTop{
        grid-template-columns:1fr 1fr 1fr;
    }

    .chartViewport{
        height:390px;
    }

    .positionGrid{
        grid-template-columns:1fr 1fr;
    }

    .logo{
        font-size:19px;
    }

    .livePrice{
        font-size:18px;
    }

}

@media(max-width:420px){

    .chartViewport{
        height:350px;
    }

    .tradeBtn{
        height:59px;
        font-size:15px;
    }

    .chartTop{
        gap:4px;
        padding:6px;
    }

    .chartControl select{
        font-size:11px;
    }

    .control{
        padding:9px;
    }

}

</style>
</head>

<body>

<div class="app">


<!-- ======================================================
     HEADER
====================================================== -->

<div class="header">

    <div class="logo">
        Ganeva<span>_Options</span>
    </div>

    <div class="priceBox">

        <div class="priceLabel">

        </div>

        <div id="livePrice"

        </div>

    </div>

</div>


<!-- ======================================================

====================================================== -->

<div class="connection">

        <input

<!-- ======================================================

<div class="controlGrid">

    <!-- EXPIRY -->

        </div>

            <option value="5t">

            </option>

            <option value="10t">

            <option value="15t">

            </option>

            <option value="5m"

            </option>

            <option value="10m">
                10 minutes
            </option>

            <option value="custom">

            </option>

</div>


<!-- ======================================================
     CHART
====================================================== -->

<div class="chartPanel">

    <div class="chartTop">


        <div class="chartControl">

            <label>
                Chart Time
            </label>

            <select id="chartTime">

                <option value="1t">

                </option>

                <option value="5t">

                <option value="1m"
                        selected>
                    1 Minute

                <option value="5m">

                </option>

                <option value="15m">
                    15 Minutes
                </option>

            </select>

        </div>


        <div class="chartControl">

            <label>
                Market
            </label>

            <select id="chartMarket">

                <option value="R_25"
                        selected>
                    R_25
                </option>

                <option value="R_50">
                    R_50
                </option>

                <option value="R_75">
                    R_75
                </option>

                <option value="R_100">
                    R_100
                </option>

            </select>

        </div>


        <div class="chartControl">

            <label>
                Chart
            </label>

            <select id="chartStyle">

                <option value="candles"
                        selected>
                    Candles
                </option>

                <option value="line">

    </div>


    <div

        class="chartViewport">

        <canvas id="chartCanvas"></canvas>


        <div class="chartInfo">

            <div

            <div

</div>


<!-- ======================================================

====================================================== -->

<div class="accountBar">

    <div class="metric">

        <div class="metricLabel">
            Balance
        </div>

        <div
            id="balance"
            class="metricValue">
            --
        </div>

    </div>


    <div class="metric">

            Market
        </div>

        <div

        </div>

    <div class="metric">

        </div>

        <div

<!-- ======================================================

====================================================== -->

        id="positionBody"

     SYSTEM LOG

    <div class="sectionTitle">
        System Log
    </div>

    <div
        id="log"
        class="log">
    </div>

</div>

</div>


<script>

/* =========================================================
   GANEVA OPTIONS
   DERIV CURRENT OPTIONS API
   ========================================================= */

const APP_ID =
    "3447X0mxYSFx7iRN27jhP";

const API_BASE =
    "https://api.derivws.com";

const PUBLIC_WS =
    "wss://api.derivws.com/trading/v1/options/ws/public";


/* =========================================================
   STATE
   ========================================================= */

let pat = "";

let selectedAccountType =
    "demo";

let accountId =
    null;

let accountCurrency =
    "USD";

let authenticatedWS =
    null;

let publicWS =
    null;

let connected =
    false;

let currentMarket =
    "R_25";

let currentChartMode =
    "1m";

let currentChartStyle =
    "candles";

let currentExpiry =
    "5m";

let currentTradeExpiry =
    "5m";

let requestId =
    1000;

let tickHistory =
    [];

let chartBars =
    [];

let currentTick =
    null;

let zoomLevel =
    1;

let panOffset =
    0;

let dragging =
    false;

let dragStartX =
    0;

let dragStartPan =
    0;

let customExpirySeconds =
    300;

let tickSubscription =
    null;

let balanceSubscription =
    null;

let positions =
    new Map();

let pendingTrades =
    new Map();

let connectionGeneration =
    0;


/* =========================================================
   DOM
   ========================================================= */

const $ =
    id => document.getElementById(id);

const canvas =
    $("chartCanvas");

const ctx =
    canvas.getContext("2d");

const viewport =
    $("chartViewport");


/* =========================================================
   LOG
   ========================================================= */

function log(message,type="info"){

    const logBox =
        $("log");

    const time =
        new Date().toLocaleTimeString();

    const line =
        document.createElement("div");

    line.className =
        "logLine " + type;

    line.innerHTML =
        `<span class="logTime">[${time}]</span> ${
            escapeHTML(message)
        }`;

    logBox.appendChild(line);

    while(
        logBox.children.length > 80
    ){
        logBox.removeChild(
            logBox.firstChild
        );
    }

    logBox.scrollTop =
        logBox.scrollHeight;
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   REQUEST ID
   ========================================================= */

function req(){

    requestId++;

    return requestId;
}


/* =========================================================
   CANVAS
   ========================================================= */

function resizeCanvas(){

    const rect =
        viewport.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(
            rect.width * dpr
        );

    canvas.height =
        Math.floor(
            rect.height * dpr
        );

    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawChart();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   PRICE FORMAT
   ========================================================= */

function formatPrice(price){

    const n =
        Number(price);

    if(
        !Number.isFinite(n)
    ){
        return "--";
    }

    return n.toFixed(2);
}


/* =========================================================
   PUBLIC DERIV MARKET STREAM
   ========================================================= */

function openPublicWS(){

    if(
        publicWS &&
        (
            publicWS.readyState ===
            WebSocket.OPEN ||
            publicWS.readyState ===
            WebSocket.CONNECTING
        )
    ){
        return;
    }


    publicWS =
        new WebSocket(
            PUBLIC_WS
        );


    publicWS.onopen =
        () => {

            log(
                "Deriv public market stream connected.",
                "good"
            );

            subscribeMarketData();
        };


    publicWS.onmessage =
        event => {

            let data;

            try{
                data =
                    JSON.parse(
                        event.data
                    );
            }
            catch{
                return;
            }

            handlePublicMessage(
                data
            );
        };


    publicWS.onerror =
        () => {

            log(
                "Deriv public market stream error.",
                "bad"
            );
        };


    publicWS.onclose =
        () => {

            if(
                publicWS
            ){

                log(
                    "Deriv public market stream closed.",
                    "warn"
                );
            }
        };
}


/* =========================================================
   PUBLIC MARKET SUBSCRIPTION
   ========================================================= */

function subscribeMarketData(){

    if(
        !publicWS ||
        publicWS.readyState !==
        WebSocket.OPEN
    ){
        return;
    }


    tickHistory =
        [];

    chartBars =
        [];

    currentTick =
        null;

    panOffset =
        0;


    const historyReq =
        req();


    publicWS.send(
        JSON.stringify({

            ticks_history:
                currentMarket,

            count:
                1500,

            end:
                "latest",

            style:
                "ticks",

            req_id:
                historyReq

        })
    );


    const tickReq =
        req();


    publicWS.send(
        JSON.stringify({

            ticks:
                currentMarket,

            subscribe:
                1,

            req_id:
                tickReq

        })
    );


    tickSubscription =
        tickReq;


    updateChartLabels();


    log(
        "Loading Deriv live prices for " +
        currentMarket + "...",
        "info"
    );
}


/* =========================================================
   PUBLIC MESSAGE
   ========================================================= */

function handlePublicMessage(data){

    if(
        data.error
    ){

        log(
            data.error.message ||
            "Deriv public market error.",
            "bad"
        );

        return;
    }


    if(
        data.msg_type ===
        "history"
    ){

        processHistoricalTicks(
            data
        );

        return;
    }


    if(
        data.msg_type ===
        "tick"
    ){

        const tick =
            data.tick;

        if(!tick){
            return;
        }


        const epoch =
            Number(
                tick.epoch
            );

        const quote =
            Number(
                tick.quote
            );


        if(
            !Number.isFinite(epoch) ||
            !Number.isFinite(quote)
        ){
            return;
        }


        currentTick = {
            epoch,
            quote
        };


        tickHistory.push(
            currentTick
        );


        if(
            tickHistory.length >
            3000
        ){

            tickHistory.shift();

        }


        $("livePrice").textContent =
            formatPrice(
                quote
            );


        updateChartFromTicks();

    }
}


/* =========================================================
   HISTORICAL TICKS
   ========================================================= */

function processHistoricalTicks(data){

    const prices =
        data.history &&
        data.history.prices
            ? data.history.prices
            : [];

    const times =
        data.history &&
        data.history.times
            ? data.history.times
            : [];


    tickHistory =
        [];


    const count =
        Math.min(
            prices.length,
            times.length
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const quote =
            Number(
                prices[i]
            );

        const epoch =
            Number(
                times[i]
            );


        if(
            Number.isFinite(quote) &&
            Number.isFinite(epoch)
        ){

            tickHistory.push({
                quote,
                epoch
            });

        }
    }


    if(
        tickHistory.length
    ){

        currentTick =
            tickHistory[
                tickHistory.length - 1
            ];

        $("livePrice").textContent =
            formatPrice(
                currentTick.quote
            );
    }


    updateChartFromTicks();


    log(
        "Loaded " +
        tickHistory.length +
        " Deriv live ticks.",
        "good"
    );
}


/* =========================================================
   BUILD CHART BARS
   ========================================================= */

function buildBars(
    ticks,
    mode
){

    if(
        !ticks.length
    ){
        return [];
    }


    const bars = [];


    /* 1 TICK */

    if(
        mode === "1t"
    ){

        for(
            const t of ticks
        ){

            bars.push({

                time:
                    t.epoch,

                open:
                    t.quote,

                high:
                    t.quote,

                low:
                    t.quote,

                close:
                    t.quote,

                volume:
                    1

            });
        }


        return bars.slice(
            -500
        );
    }


    /* 5 TICKS */

    if(
        mode === "5t"
    ){

        for(
            let i=0;
            i<ticks.length;
            i+=5
        ){

            const group =
                ticks.slice(
                    i,
                    i+5
                );

            if(
                !group.length
            ){
                continue;
            }


            const values =
                group.map(
                    x => x.quote
                );


            bars.push({

                time:
                    group[0].epoch,

                open:
                    values[0],

                high:
                    Math.max(
                        ...values
                    ),

                low:
                    Math.min(
                        ...values
                    ),

                close:
                    values[
                        values.length-1
                    ],

                volume:
                    values.length

            });
        }


        return bars.slice(
            -500
        );
    }


    let seconds =
        60;


    if(
        mode === "5m"
    ){
        seconds =
            300;
    }


    if(
        mode === "15m"
    ){
        seconds =
            900;
    }


    let bucket =
        null;

    let bar =
        null;


    for(
        const t of ticks
    ){

        const key =
            Math.floor(
                t.epoch /
                seconds
            ) *
            seconds;


        if(
            bucket !== key
        ){

            if(bar){
                bars.push(
                    bar
                );
            }


            bucket =
                key;


            bar = {

                time:
                    key,

                open:
                    t.quote,

                high:
                    t.quote,

                low:
                    t.quote,

                close:
                    t.quote,

                volume:
                    1

            };

        }
        else{

            bar.high =
                Math.max(
                    bar.high,
                    t.quote
                );

            bar.low =
                Math.min(
                    bar.low,
                    t.quote
                );

            bar.close =
                t.quote;

            bar.volume++;

        }
    }


    if(bar){
        bars.push(
            bar
        );
    }


    return bars.slice(
        -500
    );
}


/* =========================================================
   UPDATE CHART
   ========================================================= */

function updateChartFromTicks(){

    chartBars =
        buildBars(
            tickHistory,
            currentChartMode
        );

    drawChart();
}


/* =========================================================
   DRAW CHART
   ========================================================= */

function drawChart(){

    const rect =
        viewport.getBoundingClientRect();

    const W =
        rect.width;

    const H =
        rect.height;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#071321";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(
        !chartBars.length
    ){

        ctx.fillStyle =
            "#60768c";

        ctx.font =
            "12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            connected
                ? "Waiting for Deriv live price..."
                : "Connect to load Deriv market",
            W/2,
            H/2
        );

        return;
    }


    const bars =
        chartBars;


    const visible =
        Math.max(
            20,
            Math.floor(
                75 /
                zoomLevel
            )
        );


    const end =
        bars.length -
        Math.max(
            0,
            Math.floor(
                panOffset
            )
        );


    const start =
        Math.max(
            0,
            end-visible
        );


    const view =
        bars.slice(
            start,
            end
        );


    if(
        !view.length
    ){
        return;
    }


    let min =
        Math.min(
            ...view.map(
                b => b.low
            )
        );


    let max =
        Math.max(
            ...view.map(
                b => b.high
            )
        );


    const range =
        max-min || 1;


    min -=
        range*.08;

    max +=
        range*.08;


    const topPad =
        35;

    const bottomPad =
        30;


    /* GRID */

    ctx.strokeStyle =
        "rgba(90,120,150,.14)";

    ctx.lineWidth =
        1;


    for(
        let i=1;
        i<6;
        i++
    ){

        const y =
            topPad +
            (
                H -
                topPad -
                bottomPad
            ) *
            i/6;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();
    }


    for(
        let i=1;
        i<8;
        i++
    ){

        const x =
            W*i/8;


        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();
    }


    /* PRICE LABELS */

    ctx.textAlign =
        "right";

    ctx.font =
        "10px Arial";

    ctx.fillStyle =
        "#61778d";


    for(
        let i=0;
        i<=5;
        i++
    ){

        const p =
            max -
            (
                max-min
            ) *
            i/5;


        const y =
            topPad +
            (
                H -
                topPad -
                bottomPad
            ) *
            i/5;


        ctx.fillText(
            formatPrice(p),
            W-5,
            y-2
        );
    }


    const plotW =
        W-50;


    const candleW =
        Math.max(
            3,
            plotW /
            view.length *
            .68
        );


    function priceY(price){

        return (
            topPad +
            (
                max-price
            ) /
            (
                max-min
            ) *
            (
                H -
                topPad -
                bottomPad
            )
        );
    }


    /* LINE CHART */

    if(
        currentChartStyle ===
        "line"
    ){

        ctx.beginPath();


        view.forEach(
            (bar,i) => {

                const x =
                    5 +
                    i *
                    (
                        plotW /
                        Math.max(
                            1,
                            view.length-1
                        )
                    );


                const y =
                    priceY(
                        bar.close
                    );


                if(
                    i===0
                ){

                    ctx.moveTo(
                        x,
                        y
                    );

                }
                else{

                    ctx.lineTo(
                        x,
                        y
                    );

                }
            }
        );


        ctx.strokeStyle =
            "#3ab8ff";

        ctx.lineWidth =
            1.5;

        ctx.stroke();

    }
    else{

        /* CANDLES */

        const spacing =
            plotW /
            view.length;


        view.forEach(
            (bar,i) => {

                const x =
                    5 +
                    i *
                    spacing +
                    spacing/2;


                const openY =
                    priceY(
                        bar.open
                    );

                const closeY =
                    priceY(
                        bar.close
                    );

                const highY =
                    priceY(
                        bar.high
                    );

                const lowY =
                    priceY(
                        bar.low
                    );


                const bullish =
                    bar.close >=
                    bar.open;


                ctx.strokeStyle =
                    bullish
                        ? "#23c88a"
                        : "#ef536a";

                ctx.fillStyle =
                    bullish
                        ? "#23c88a"
                        : "#ef536a";


                /* WICK */

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    highY
                );

                ctx.lineTo(
                    x,
                    lowY
                );

                ctx.stroke();


                /* BODY */

                const bodyTop =
                    Math.min(
                        openY,
                        closeY
                    );


                const bodyHeight =
                    Math.max(
                        1,
                        Math.abs(
                            openY-closeY
                        )
                    );


                ctx.fillRect(
                    x-candleW/2,
                    bodyTop,
                    candleW,
                    bodyHeight
                );

            }
        );
    }


    /* CURRENT DERIV PRICE */

    if(
        currentTick
    ){

        const y =
            priceY(
                currentTick.quote
            );


        ctx.setLineDash([
            4,
            4
        ]);


        ctx.strokeStyle =
            "#39b9ff";


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();


        ctx.setLineDash([]);


        ctx.fillStyle =
            "#1675d1";


        ctx.fillRect(
            W-49,
            y-9,
            49,
            18
        );


        ctx.fillStyle =
            "#fff";


        ctx.font =
            "10px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            formatPrice(
                currentTick.quote
            ),
            W-24,
            y+4
        );
    }


    /* OPEN POSITION ENTRY LINES */

    for(
        const position of positions.values()
    ){

        if(
            position.entrySpot == null
        ){
            continue;
        }


        const entry =
            Number(
                position.entrySpot
            );


        if(
            !Number.isFinite(entry)
        ){
            continue;
        }


        const y =
            priceY(
                entry
            );


        const rise =
            position.direction ===
            "RISE";


        ctx.setLineDash([
            6,
            4
        ]);


        ctx.strokeStyle =
            rise
                ? "#21d68c"
                : "#ff4e69";


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();


        ctx.setLineDash([]);


        ctx.fillStyle =
            rise
                ? "#21d68c"
                : "#ff4e69";


        ctx.font =
            "bold 10px Arial";


        ctx.textAlign =
            "left";


        ctx.fillText(
            (
                rise
                    ? "RISE "
                    : "FALL "
            ) +
            formatPrice(entry),
            8,
            y-5
        );
    }

}

                JSON.stringify({

                    ticks:

                        req()

            );

        }
        catch{}

/* =========================================================
   EXPIRY
   ========================================================= */

function expiryToObject(value){

    if(
        value ===
        "custom"
    ){

        return {

            duration:
                customExpirySeconds,

            unit:
                "s"

        };
    }


    if(
        value.endsWith("t")
    ){

        return {

            duration:
                Number(
                    value.replace(
                        "t",
                        ""
                    )
                ),

            unit:
                "t"

        };
    }


    if(
        value.endsWith("m")
    ){

        return {

            duration:
                Number(
                    value.replace(
                        "m",
                        ""
                    )
                ),

            unit:
                "m"

        };
    }


    return {

        duration:
            5,

        unit:
            "m"

    };
}


/* =========================================================
   GET ACCOUNTS
========================================================= */

async function getAccounts(){

    const response =
        await fetch(
            API_BASE +
            "/trading/v1/options/accounts",
            {

                method:
                    "GET",

                headers:{

                    "Deriv-App-ID":
                        APP_ID,

                    "Authorization":
                        "Bearer " +
                        pat,

                    "Accept":
                        "application/json"

                }

            }
        );


    const json =
        await response.json();


    if(
        !response.ok
    ){

        const message =
            json?.errors?.[0]?.message ||
            "Unable to retrieve Deriv Options accounts.";

        throw new Error(
            message
        );
    }


    let result = [];


    if(
        Array.isArray(
            json.data
        )
    ){

        result =
            json.data;

    }
    else if(
        json.data &&
        Array.isArray(
            json.data.accounts
        )
    ){

        result =
            json.data.accounts;

    }
    else if(
        Array.isArray(
            json.accounts
        )
    ){

        result =
            json.accounts;

    }
    else if(
        json.data &&
        (
            json.data.account_id ||
            json.data.loginid
        )
    ){

        result =
            [json.data];

    }


    if(
        !result.length
    ){

        throw new Error(
            "Deriv returned no Options accounts."
        );
    }


    return result;
}


/* =========================================================
   FIND ACCOUNT
   ========================================================= */

function findSelectedAccount(
    accounts
){

    const wanted =
        selectedAccountType ===
        "demo"
            ? "demo"
            : "real";


    /* First use explicit account_type */

    let account =
        accounts.find(
            a =>
                String(
                    a.account_type ||
                    ""
                ).toLowerCase() ===
                wanted
        );


    if(
        account
    ){
        return account;
    }


    /* Then login/account ID prefix */

    const prefix =
        selectedAccountType ===
        "demo"
            ? "DOT"
            : "CR";


    account =
        accounts.find(
            a =>
                String(
                    a.account_id ||
                    a.loginid ||
                    ""
                ).toUpperCase()
                .startsWith(
                    prefix
                )
        );


    return account ||
        null;
}

async function getOTP(

    ){

/* =========================================================
   AUTHENTICATED WS
   ========================================================= */

function openAuthenticatedWS(
    url,
    generation
){

    return new Promise(
        (resolve,reject) => {

            let settled =
                false;


            const ws =
                new WebSocket(
                    url
                );


            authenticatedWS =
                ws;


            const timeout =
                setTimeout(
                    () => {

                        if(
                            !settled
                        ){

                            settled =
                                true;

                            try{
                                ws.close();
                            }
                            catch{}

                            reject(
                                new Error(
                                    "Deriv trading connection timed out."
                                )
                            );
                        }

                    },
                    15000
                );


            ws.onopen =
                () => {

                    clearTimeout(
                        timeout
                    );


                    if(
                        generation !==
                        connectionGeneration
                    ){

                        try{
                            ws.close();
                        }
                        catch{}

                        return;
                    }


                    if(
                        !settled
                    ){

                        settled =
                            true;

                        resolve();

                    }
                };


            ws.onerror =
                () => {

                    clearTimeout(
                        timeout
                    );


                    if(
                        !settled
                    ){

                        settled =
                            true;

                        reject(
                            new Error(
                                "Deriv authenticated WebSocket connection failed."
                            )
                        );
                    }
                };


            ws.onclose =
                () => {

                    if(
                        ws !==
                        authenticatedWS
                    ){
                        return;
                    }


                    if(
                        connected
                    ){

                        connected =
                            false;


                        $("connectBtn")
                            .textContent =
                            "CONNECT";


                        $("connectBtn")
                            .classList.remove(
                                "connected"
                            );


                        $("chartStatus")
                            .textContent =
                            "DISCONNECTED";


                        log(
                            "Deriv trading connection closed.",
                            "warn"
                        );

                    }
                };


            ws.onmessage =
                event => {

                    let data;

                    try{

                        data =
                            JSON.parse(
                                event.data
                            );

                    }
                    catch{
                        return;
                    }


                    handleAuthenticatedMessage(
                        data
                    );
                };

        }
    );
}


/* =========================================================
   AUTHENTICATED MESSAGE
   ========================================================= */

function handleAuthenticatedMessage(
    data
){

    if(
        data.error
    ){

        log(
            data.error.message ||
            "Deriv trading API error.",
            "bad"
        );

        return;
    }


    /* BALANCE */

    if(
        data.msg_type ===
        "balance"
    ){

        updateBalance(
            data.balance
        );

        return;
    }


    /* PROPOSAL */

    if(
        data.msg_type ===
        "proposal"
    ){

        handleProposal(
            data
        );

        return;
    }


    /* BUY */

    if(
        data.msg_type ===
        "buy"
    ){

        handleBuyResponse(
            data.buy
        );

        return;
    }


    /* OPEN CONTRACT */

    if(
        data.msg_type ===
        "proposal_open_contract"
    ){

        handleOpenContract(
            data.proposal_open_contract
        );

        return;
    }


    /* TICK */

    if(
        data.msg_type ===
        "tick"
    ){

        return;
    }
}


/* =========================================================
   BALANCE
   ========================================================= */

function updateBalance(

/* =========================================================
   PLACE TRADE
========================================================= */

function placeTrade(
    direction
){

    if(
        !connected ||
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){

        log(
            "Connect to Deriv before placing a trade.",
            "bad"
        );

        return;
    }


    const stake =
        Number(
            $("stake").value
        );


    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){

        log(
            "Minimum stake is 1.",
            "bad"
        );

        return;
    }


    const expiry =
        $("tradeExpiry").value;


    const exp =
        expiryToObject(
            expiry
        );


    const directionRequest =
        req();


    const contractType =
        direction ===
        "RISE"
            ? "CALL"
            : "PUT";


    /*
       Store direction against THIS
       proposal request.

       This avoids the old bug where
       multiple requests could overwrite
       lastTradeDirection.
    */

    pendingTrades.set(
        directionRequest,
        {
            direction,
            stake,
            expiry,
            contractType,
            created:
                Date.now()
        }
    );


    log(
        "Requesting Deriv " +
        direction +
        " proposal...",
        "info"
    );


    try{

        authenticatedWS.send(
            JSON.stringify({

                proposal:
                    1,

                amount:
                    stake,

                basis:
                    "stake",

                contract_type:
                    contractType,

                currency:
                    accountCurrency,

                duration:
                    exp.duration,

                duration_unit:
                    exp.unit,

                underlying_symbol:
                    currentMarket,

                req_id:
                    directionRequest

            })
        );

    }
    catch(error){

        pendingTrades.delete(
            directionRequest
        );

        log(
            "Could not send trade request: " +
            error.message,
            "bad"
        );
    }
}


/* =========================================================
   PROPOSAL RESPONSE
========================================================= */

function handleProposal(
    data
){

    const proposal =
        data.proposal;


    if(
        !proposal
    ){
        return;
    }


    const reqId =
        Number(
            data.req_id
        );


    const pending =
        pendingTrades.get(
            reqId
        );


    if(
        !pending
    ){

        log(
            "Received a Deriv proposal without a matching trade request.",
            "warn"
        );

        return;
    }


    pendingTrades.delete(
        reqId
    );


    const proposalId =
        proposal.id;


    const askPrice =
        Number(
            proposal.ask_price
        );


    if(
        !proposalId ||
        !Number.isFinite(
            askPrice
        )
    ){

        log(
            "Deriv returned an invalid trade proposal.",
            "bad"
        );

        return;
    }


    log(
        pending.direction +
        " proposal received. Buying at Deriv price " +
        askPrice.toFixed(2) +
        ".",
        "info"
    );


    const buyReq =
        req();


    pendingTrades.set(
        buyReq,
        {
            ...pending,
            proposalId,
            askPrice,
            buyReq
        }
    );


    try{

        authenticatedWS.send(
            JSON.stringify({

                buy:
                    proposalId,

                price:
                    askPrice,

                req_id:
                    buyReq

            })
        );

    }
    catch(error){

        pendingTrades.delete(
            buyReq
        );

        log(
            "Unable to send Deriv buy request: " +
            error.message,
            "bad"
        );
    }
}


/* =========================================================
   BUY RESPONSE
========================================================= */

function handleBuyResponse(
    buy
){

    if(
        !buy
    ){
        return;
    }


    const contractId =
        buy.contract_id;


    if(
        !contractId
    ){

        log(
            "Deriv buy response did not contain a contract ID.",
            "bad"
        );

        return;
    }


    const id =
        String(
            contractId
        );


    /*
       Find the most recent pending buy
       that has not yet been converted
       to an open position.
    */

    let pending =
        null;

    let pendingKey =
        null;


    for(
        const [
            key,
            value
        ] of pendingTrades
    ){

        if(
            value &&
            value.buyReq
        ){

            pending =
                value;

            pendingKey =
                key;

            break;
        }
    }


    if(
        pendingKey !== null
    ){

        pendingTrades.delete(
            pendingKey
        );

    }


    const direction =
        pending?.direction ||
        "RISE";


    const position = {

        id,

        contractId,

        direction,

        market:
            currentMarket,

        stake:
            pending?.stake ||
            Number(
                buy.buy_price ||
                0
            ),

        buyPrice:
            Number(
                buy.buy_price ||
                0
            ),

        payout:
            Number(
                buy.payout ||
                0
            ),

        entrySpot:
            null,

        expiryTime:
            null,

        profit:
            0,

        status:
            "open"

    };


    positions.set(
        id,
        position
    );


    renderPositions();

    drawChart();


    log(
        direction +
        " contract purchased. ID: " +
        contractId,
        "good"
    );


    /*
       Subscribe to Deriv's actual
       open-contract stream.
    */

    try{

        authenticatedWS.send(
            JSON.stringify({

                proposal_open_contract:
                    1,

                contract_id:
                    contractId,

                subscribe:
                    1,

                req_id:
                    req()

            })
        );

    }
    catch(error){

        log(
            "Open-contract subscription failed: " +
            error.message,
            "bad"
        );
    }
}


/* =========================================================
   OPEN CONTRACT
========================================================= */

function handleOpenContract(
    contract
){

    if(
        !contract
    ){
        return;
    }


    const id =
        String(
            contract.contract_id ||
            ""
        );


    if(
        !id
    ){
        return;
    }


    const position =
        positions.get(
            id
        );


    if(
        !position
    ){
        return;
    }


    /* Actual Deriv entry spot */

    if(
        contract.entry_spot !==
        undefined &&
        contract.entry_spot !==
        null
    ){

        position.entrySpot =
            Number(
                contract.entry_spot
            );

    }


    /* Actual expiry */

    if(
        contract.date_expiry !==
        undefined &&
        contract.date_expiry !==
        null
    ){

        position.expiryTime =
            Number(
                contract.date_expiry
            ) * 1000;

    }


    /* Actual Deriv P/L */

    if(
        contract.profit !==
        undefined &&
        contract.profit !==
        null
    ){

        position.profit =
            Number(
                contract.profit
            );

    }


    position.status =
        contract.status ||
        (
            contract.is_sold
                ? "sold"
                : "open"
        );


    renderPositions();

    drawChart();


    if(
        contract.is_sold ||
        contract.status ===
        "sold" ||
        contract.status ===
        "won" ||
        contract.status ===
        "lost"
    ){

        finishPosition(
            id,
            contract
        );

    }
}


/* =========================================================
   FINISH POSITION
========================================================= */

function finishPosition(
    id,
    contract
){

    const position =
        positions.get(
            String(id)
        );


    if(
        !position
    ){
        return;
    }


    const profit =
        Number(
            contract.profit ||
            position.profit ||
            0
        );


    position.profit =
        profit;


    renderPositions();


    log(
        position.direction +
        " contract settled: " +
        (
            profit >= 0
                ? "WIN "
                : "LOSS "
        ) +
        profit.toFixed(2),
        profit >= 0
            ? "good"
            : "bad"
    );


    setTimeout(
        () => {

            positions.delete(
                String(id)
            );

            renderPositions();

            drawChart();

        },
        1200
    );
}

/* =========================================================
   COUNTDOWN
========================================================= */

function getRemainingText(
    expiry
){

    if(
        !expiry
    ){
        return "--";
    }


    const remaining =
        Math.max(
            0,
            expiry -
            Date.now()
        );


    const seconds =
        Math.ceil(
            remaining / 1000
        );


    if(
        seconds <= 0
    ){
        return "SETTLING";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(
                2,
                "0"
            )
    );
}

========================================================= */

viewport.addEventListener(
    "pointerdown",
    event => {

        dragging =
            true;

        dragStartX =
            event.clientX;

        dragStartPan =
            panOffset;


        try{

            viewport.setPointerCapture(
                event.pointerId
            );

        }
        catch{}

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if(
            !dragging
        ){
            return;
        }


        const dx =
            event.clientX -
            dragStartX;


        const barsPerPixel =
            Math.max(
                .08,
                90 /
                Math.max(
                    100,
                    viewport.clientWidth
                )
            );


        panOffset =
            dragStartPan +
            Math.round(
                dx *
                barsPerPixel *
                -1
            );


        const maxPan =
            Math.max(
                0,
                chartBars.length -
                20
            );


        panOffset =
            Math.max(
                0,
                Math.min(
                    maxPan,
                    panOffset
                )
            );


        drawChart();

    }
);


viewport.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;

    }
);

/* =========================================================
   COMPLETE DISCONNECT
========================================================= */

function disconnectAll(){

    /*
       Increment generation so an old
       asynchronous connection cannot
       restore itself after disconnect.
    */

    connectionGeneration++;


    connected =
        false;


    /* Close authenticated stream */

    try{

        if(
            authenticatedWS
        ){

            authenticatedWS.onclose =
                null;

            authenticatedWS.close();

        }

    }
    catch{}


    /* Close public stream */

    try{

        if(
            publicWS
        ){

            publicWS.onclose =
                null;

            publicWS.close();

        }

    }
    catch{}


    authenticatedWS =
        null;

    publicWS =
        null;


    accountId =
        null;


    accountCurrency =
        "USD";


    tickSubscription =
        null;

    balanceSubscription =
        null;


    /*
       Clear only local UI/session state.
       The PAT remains in the box so the user
       can reconnect after selecting another
       account type.
    */

    pendingTrades.clear();

    positions.clear();


    tickHistory =
        [];

    chartBars =
        [];

    currentTick =
        null;


    $("connectBtn")
        .textContent =
        "CONNECT";


    $("connectBtn")
        .classList.remove(
            "connected"
        );


    $("chartStatus")
        .textContent =
        "DISCONNECTED";


    $("accountValue")
        .textContent =
        "Not connected";


    $("balance")
        .textContent =
        "--";


    $("livePrice")
        .textContent =
        "--";


    renderPositions();


    drawChart();


    log(
        "Disconnected. Select DEMO or LIVE and press CONNECT to start a new account session.",
        "warn"
    );
}


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

    pat =
        $("pat")
            .value
            .trim();


    if(
        !pat
    ){

        log(
            "Paste your PAT before connecting.",
            "bad"
        );

        return;
    }


    /*
       Every connection gets a new generation.
       This prevents stale async operations
       from the previous account session.
    */

    const generation =
        ++connectionGeneration;


    $("connectBtn")
        .disabled =
        true;


    $("chartStatus")
        .textContent =
        "AUTHENTICATING";


    try{

        /*
           Always clear old account state
           before selecting the new account.
        */

        accountId =
            null;

        accountCurrency =
            "USD";

        pendingTrades.clear();

        positions.clear();

        renderPositions();


        /*
           Fetch accounts again from Deriv.
           This is important when changing
           DEMO -> LIVE.
        */

        const accounts =
            await getAccounts();


        if(
            generation !==
            connectionGeneration
        ){
            return;
        }


        const account =
            findSelectedAccount(
                accounts
            );


        if(
            !account
        ){

            throw new Error(
                "No " +
                selectedAccountType.toUpperCase() +
                " Options account was found for this PAT."
            );
        }


        accountId =
            account.account_id ||
            account.loginid ||
            account.id;


        accountCurrency =
            account.currency ||
            "USD";


        $("accountValue")
            .textContent =
            maskAccount(
                accountId
            );


        log(
            "Selected " +
            selectedAccountType.toUpperCase() +
            " account " +
            maskAccount(accountId) +
            ".",
            "good"
        );


        /*
           Get a fresh one-time WebSocket URL
           for THIS account.
        */

        const wsUrl =
            await getOTP(
                accountId
            );


        if(
            generation !==
            connectionGeneration
        ){
            return;
        }


        await openAuthenticatedWS(
            wsUrl,
            generation
        );


        if(
            generation !==
            connectionGeneration
        ){
            return;
        }


        connected =
            true;


        $("connectBtn")
            .textContent =
            "CONNECTED";


        $("connectBtn")
            .classList.add(
                "connected"
            );


        $("chartStatus")
            .textContent =
            "CONNECTED";


        log(
            selectedAccountType.toUpperCase() +
            " account connected.",
            "good"
        );


        /*
           IMPORTANT:
           Request balance AGAIN after
           every connection.
        */

        subscribeAuthenticatedData();


        /*
           Public Deriv chart stream.
        */

        startChartAfterConnect();


    }
    catch(error){

        if(
            generation ===
            connectionGeneration
        ){

            connected =
                false;


            $("connectBtn")
                .textContent =
                "CONNECT";


            $("connectBtn")
                .classList.remove(
                    "connected"
                );


            $("chartStatus")
                .textContent =
                "CONNECTION FAILED";


            $("accountValue")
                .textContent =
                "Not connected";


            $("balance")
                .textContent =
                "--";


            log(
                error.message ||
                "Connection failed.",
                "bad"
            );

        }

    }
    finally{

        if(
            generation ===
            connectionGeneration
        ){

            $("connectBtn")
                .disabled =
                false;

        }

    }
}
