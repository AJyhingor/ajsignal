/* =========================================================
   CHART DRAG
========================================================= */

viewport.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        dragStartX =
            event.clientX;

        dragStartPan =
            panOffset;

        try{
            viewport.setPointerCapture(
                event.pointerId
            );
        }catch{}
    }
);


viewport.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;

        const dx =
            event.clientX-
            dragStartX;

        const barsPerPixel =
            Math.max(
                .08,
                90/
                Math.max(
                    100,
                    viewport.clientWidth
                )
            );

        panOffset =
            dragStartPan+
            Math.round(
                dx*
                barsPerPixel*
                -1
            );

        const maxPan =
            Math.max(
                0,
                chartBars.length-20
            );

        panOffset =
            Math.max(
                0,
                Math.min(
                    maxPan,
                    panOffset
                )
            );

        drawChart();
    }
);


viewport.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

viewport.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =========================================================
   DISCONNECT ALL
========================================================= */

function disconnectAll(){

    connectionGeneration++;

    connected=false;

    shouldStayConnected=false;

    try{
        if(authenticatedWS){
            authenticatedWS.onclose=null;
            authenticatedWS.close();
        }
    }catch{}

    try{
        if(publicWS){
            publicWS.onclose=null;
            publicWS.close();
        }
    }catch{}

    authenticatedWS=null;
    publicWS=null;

    accountId=null;
    accountCurrency="USD";
    tickSubscription=null;
    balanceSubscription=null;

    liveProposals = {
        RISE:null,
        FALL:null
    };

    liveProposalReqIds = {};
    liveProposalSubIds = {
        RISE:null,
        FALL:null
    };
    liveProposalKey = null;

    pendingTrades.clear();
    positions = [];

    tickHistory = [];
    chartBars = [];
    currentTick = null;

    $("connectBtn")
        .textContent =
        "CONNECT";

    $("connectBtn")
        .classList
        .remove(
            "connected"
        );

    $("chartStatus")
        .textContent =
        "DISCONNECTED";

    $("balance")
        .textContent =
        "--";

    $("livePrice")
        .textContent =
        "--";

    renderPositions();

    drawChart();

    log(
        "Disconnected.",
        "warn"
    );
}


/* =========================================================
   CONNECT
========================================================= */

async function connectToDeriv(isAutoRetry){

    if(!isAutoRetry){

        pat =
            $("pat")
            .value
            .trim();
    }

    if(!pat){

        log(
            "Paste your PAT before connecting.",
            "bad"
        );

        return false;
    }

    if(!isAutoRetry){

        $("connectBtn")
            .disabled =
            true;
    }

    const generation =
        ++connectionGeneration;

    $("chartStatus")
        .textContent =
        isAutoRetry
        ? "RECONNECTING"
        : "AUTHENTICATING";

    try{

        /* Always clear old state before connecting */
        accountId=null;
        accountCurrency="USD";
        pendingTrades.clear();
        positions = [];
        renderPositions();

        const accounts =
            await getAccounts();

        if(
            generation !==
            connectionGeneration
        ){
            return false;
        }

        const account =
            findSelectedAccount(
                accounts
            );

        if(!account){

            throw new Error(
                "No "+
                selectedAccountType.toUpperCase()+
                " Options account found for this PAT."
            );
        }

        accountId =
            account.account_id ||
            account.loginid ||
            account.id;

        if(!accountId){

            throw new Error(
                "Deriv account ID was not returned."
            );
        }

        accountCurrency =
            account.currency ||
            "USD";

        const wsUrl =
            await getOTP(
                accountId
            );

        if(
            generation !==
            connectionGeneration
        ){
            return false;
        }

        await openAuthenticatedWS(
            wsUrl,
            generation
        );

        if(
            generation !==
            connectionGeneration
        ){
            return false;
        }

        connected=true;

        shouldStayConnected=true;

        reconnectAttempts=0;

        $("connectBtn")
            .textContent =
            "CONNECTED";

        $("connectBtn")
            .classList
            .add(
                "connected"
            );

        $("chartStatus")
            .textContent =
            "CONNECTED";

        subscribeAuthenticatedData();

        openPublicWS();

        liveProposalKey = null;

        refreshLiveProposals();

        log(
            (
                isAutoRetry
                ? "Reconnected - "
                : ""
            )+
            selectedAccountType
            .toUpperCase()+
            " Deriv account connected.",
            "good"
        );

        return true;

    }catch(error){

        if(
            generation ===
            connectionGeneration
        ){

            connected=false;

            $("connectBtn")
                .textContent =
                "CONNECT";

            $("connectBtn")
                .classList
                .remove(
                    "connected"
                );

            $("chartStatus")
                .textContent =
                isAutoRetry
                ? "RECONNECT FAILED"
                : "CONNECTION FAILED";

            $("balance")
                .textContent =
                "--";

            log(
                error.message ||
                "Connection failed.",
                "bad"
            );
        }

        return false;

    }finally{

        if(
            !isAutoRetry &&
            generation ===
            connectionGeneration
        ){

            $("connectBtn")
                .disabled =
                false;
        }
    }
}


/* =========================================================
   CONNECT BUTTON
========================================================= */

$("connectBtn").onclick =
    async ()=>{

        if(connected){

            shouldStayConnected=false;

            disconnectAll();

            return;
        }

        await connectToDeriv(false);
    };


/* =========================================================
   AUTO-RECONNECT WATCHDOG
========================================================= */

setInterval(
    ()=>{

        if(
            !shouldStayConnected ||
            reconnecting
        ){
            return;
        }

        const authDead =
            !authenticatedWS ||
            authenticatedWS.readyState !==
            WebSocket.OPEN;

        const pubDead =
            !publicWS ||
            publicWS.readyState !==
            WebSocket.OPEN;

        if(
            !authDead &&
            pubDead
        ){

            log(
                "Live price stream dropped - reconnecting...",
                "warn"
            );

            openPublicWS();

            return;
        }

        if(authDead){

            reconnecting=true;

            reconnectAttempts++;

            log(
                "Connection lost - attempting to reconnect (#"+
                reconnectAttempts+
                ")...",
                "warn"
            );

            connectToDeriv(true)
                .finally(
                    ()=>{
                        reconnecting=false;
                    }
                );
        }
    },
    5000
);
