<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AJ @ Ganeva Options</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
select,
input{
    font:inherit;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:6px;
}

/* =========================================================
   TOP LINE
   ========================================================= */

.header{
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    align-items:center;
    gap:10px;
    min-height:40px;
    margin-bottom:6px;
}

.logo{
    font-size:19px;
    font-weight:900;
    color:#fff;
    white-space:nowrap;
}

.logo span{
    color:#39a9ff;
}

.headerMetric{
    text-align:center;
    min-width:70px;
}

.headerLabel{
    font-size:8px;
    color:#6f8499;
    text-transform:uppercase;
}

.headerValue{
    margin-top:2px;
    font-size:14px;
    font-weight:900;
}

#digitalTime{
    color:#d8e5f1;
    letter-spacing:.5px;
}

.livePrice{
    font-size:19px;
    font-weight:900;
    color:#48d8ff;
}

/* =========================================================
   CONNECTION / PAT
   ========================================================= */

.connection{
    display:flex;
    align-items:center;
    gap:5px;
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:9px;
    padding:5px;
    margin-bottom:6px;
}

.patInput{
    width:145px;
    height:34px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    padding:0 8px;
    outline:none;
    font-size:11px;
}

.patInput:focus{
    border-color:#269cff;
}

.connectBtn{
    height:34px;
    width:86px;
    border:0;
    border-radius:6px;
    background:#1675d1;
    color:white;
    font-size:11px;
    font-weight:900;
}

.connectBtn.connected{
    background:#158447;
}

.connectBtn:disabled{
    opacity:.55;
}

.connectionMarket{
    width:78px;
    height:34px;
    border:1px solid #294967;
    border-radius:6px;
    background:#071321;
    color:#fff;
    text-align:center;
    font-size:11px;
    font-weight:800;
}

/* =========================================================
   ACCOUNT SWITCH
   ========================================================= */

.accountSwitch{
    display:flex;
    gap:5px;
    margin-bottom:6px;
}

.accountSwitch button{
    flex:1;
    height:34px;
    border:1px solid #294967;
    border-radius:6px;
    background:#071321;
    color:#aebfd2;
    font-size:11px;
    font-weight:900;
}

.accountSwitch button.active{
    background:#145e99;
    border-color:#2d9fea;
    color:#fff;
}

/* =========================================================
   CHART
   ========================================================= */

.chartPanel{
    background:#071321;
    border:1px solid #1c3855;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:7px;
}

.chartTop{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:6px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
}

.chartControl label{
    display:block;
    color:#7288a0;
    font-size:8px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.chartControl select{
    width:100%;
    height:32px;
    border:1px solid #294967;
    border-radius:6px;
    background:#071321;
    color:white;
    padding:0 5px;
    outline:none;
    font-size:11px;
    font-weight:800;
}

.chartViewport{
    position:relative;
    width:100%;
    height:465px;
    background:#071321;
    overflow:hidden;
    touch-action:none;
}

#chartCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

.chartInfo{
    position:absolute;
    top:7px;
    left:7px;
    z-index:5;
    padding:6px 8px;
    border-radius:6px;
    background:rgba(5,13,23,.88);
    border:1px solid rgba(83,130,170,.35);
    pointer-events:none;
}

.chartInfo .market{
    font-size:12px;
    font-weight:900;
}

.chartInfo .sub{
    color:#91a6bc;
    font-size:9px;
    margin-top:2px;
}

.chartStatus{
    position:absolute;
    right:7px;
    top:7px;
    z-index:5;
    font-size:8px;
    padding:4px 6px;
    border-radius:5px;
    background:rgba(0,0,0,.55);
    color:#65c5ff;
    pointer-events:none;
}

/* =========================================================
   INDICATOR WINDOW
   ========================================================= */

.indicatorWindow{
    position:relative;
    width:100%;
    height:190px;
    background:#071321;
    border-top:1px solid #294967;
    overflow:hidden;
    display:none;
}

.indicatorWindow.active{
    display:block;
}

#indicatorCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

.indicatorTitle{
    position:absolute;
    left:7px;
    top:6px;
    z-index:3;
    font-size:10px;
    font-weight:900;
    color:#8ecfff;
    background:rgba(5,13,23,.82);
    padding:4px 6px;
    border-radius:4px;
    pointer-events:none;
}

.indicatorStatus{
    position:absolute;
    right:7px;
    top:6px;
    z-index:3;
    color:#71869b;
    font-size:8px;
    pointer-events:none;
}

.chartNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 7px;
    background:#0b192a;
    border-top:1px solid #162d45;
}

.chartNav button{
    width:34px;
    height:27px;
    border:1px solid #294967;
    background:#071321;
    color:#a9bdd1;
    border-radius:5px;
    font-size:14px;
}

.chartNav span{
    color:#627991;
    font-size:8px;
}

/* =========================================================
   OPEN POSITIONS
   ========================================================= */

.positionPanel{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:9px;
    margin-bottom:7px;
    overflow:hidden;
}

.positionHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:36px;
    padding:7px 9px;
    cursor:pointer;
}

.sectionTitle{
    color:#52b7ff;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.positionArrow{
    color:#8fa7bc;
    font-size:14px;
    transition:.15s;
}

.positionPanel.open .positionArrow{
    transform:rotate(180deg);
}

.positionBody{
    display:none;
    padding:0 7px 7px;
}

.positionPanel.open .positionBody{
    display:block;
}

.positionTable{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.positionTable th{
    color:#71869b;
    font-size:8px;
    font-weight:800;
    text-align:center;
    padding:5px 2px;
    border-bottom:1px solid #1c3855;
}

.positionTable td{
    text-align:center;
    padding:7px 2px;
    border-bottom:1px solid rgba(255,255,255,.05);
    font-size:10px;
    font-weight:800;
}

.positionTable tr:last-child td{
    border-bottom:0;
}

.posRise{
    color:#32d993;
}

.posFall{
    color:#ff5570;
}

.posPositive{
    color:#45d58b;
}

.posNegative{
    color:#ff6176;
}

.noPositions{
    text-align:center;
    color:#627991;
    padding:10px;
    font-size:10px;
}

/* =========================================================
   ENTRY PAD
   ========================================================= */

.tradePad{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:7px;
}

.tradeBtn{
    height:76px;
    border:0;
    border-radius:11px;
    color:white;
    font-weight:900;
    font-size:18px;
    cursor:pointer;
    box-shadow:
        inset 0 -4px 0 rgba(0,0,0,.20),
        0 1px 5px rgba(0,0,0,.2);
    touch-action:manipulation;
}

.tradeBtn.rise{
    background:#118447;
}

.tradeBtn.fall{
    background:#b92d43;
}

.tradeBtn:active{
    transform:scale(.985);
}

.tradeArrow{
    font-size:25px;
    margin-right:5px;
}

/* =========================================================
   BOTTOM CONTROLS
   ========================================================= */

.bottomControls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:6px;
    margin-bottom:7px;
}

.bottomBox{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:6px;
    min-width:0;
}

.bottomLabel{
    text-align:center;
    color:#7288a0;
    font-size:8px;
    text-transform:uppercase;
    margin-bottom:4px;
}

.bottomInput,
.bottomSelect{
    width:100%;
    height:35px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    text-align:center;
    outline:none;
    font-size:11px;
    font-weight:900;
}

/* INDICATOR DROPDOWN */

.indicatorMenu{
    position:relative;
}

.indicatorButton{
    width:100%;
    height:35px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    font-size:11px;
    font-weight:900;
}

.indicatorDropdown{
    position:absolute;
    left:0;
    right:0;
    bottom:40px;
    z-index:100;
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:7px;
    overflow:hidden;
    display:none;
    box-shadow:0 5px 20px rgba(0,0,0,.45);
}

.indicatorMenu.open .indicatorDropdown{
    display:block;
}

.indicatorOption{
    width:100%;
    border:0;
    border-bottom:1px solid #1c3855;
    background:#0d1a2b;
    color:#fff;
    padding:10px 8px;
    text-align:left;
    font-size:11px;
    font-weight:800;
}

.indicatorOption:last-child{
    border-bottom:0;
}

.indicatorOption:active{
    background:#145e99;
}

/* =========================================================
   INDICATOR SETTINGS
   ========================================================= */

.settingsPanel{
    display:none;
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:8px;
    padding:8px;
    margin-bottom:7px;
}

.settingsPanel.open{
    display:block;
}

.settingsGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.settingField label{
    display:block;
    color:#7288a0;
    font-size:8px;
    margin-bottom:3px;
}

.settingField input,
.settingField select{
    width:100%;
    height:31px;
    background:#071321;
    border:1px solid #294967;
    color:#fff;
    border-radius:5px;
    text-align:center;
    font-size:10px;
    font-weight:800;
}

/* =========================================================
   LOG
   ========================================================= */

.logPanel{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    overflow:hidden;
}

.logHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px;
    cursor:pointer;
}

.logArrow{
    color:#8fa7bc;
    font-size:13px;
}

.logPanel.open .logArrow{
    transform:rotate(180deg);
}

.logBody{
    display:none;
    padding:0 8px 8px;
}

.logPanel.open .logBody{
    display:block;
}

.log{
    max-height:100px;
    overflow-y:auto;
    font-family:monospace;
    font-size:9px;
    line-height:1.5;
}

.logLine{
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:2px 0;
}

.logTime{
    color:#597089;
}

.good{
    color:#45d58b;
}

.bad{
    color:#ff6176;
}

.info{
    color:#74c8ff;
}

.warn{
    color:#ffc857;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

    .app{
        padding:5px;
    }

    .header{
        grid-template-columns:auto 1fr auto auto;
        gap:6px;
    }

    .logo{
        font-size:16px;
    }

    .headerMetric{
        min-width:52px;
    }

    .headerLabel{
        font-size:7px;
    }

    .headerValue{
        font-size:12px;
    }

    .livePrice{
        font-size:17px;
    }

    .patInput{
        width:128px;
    }

    .connectBtn{
        width:78px;
    }

    .connectionMarket{
        width:70px;
    }

    .chartViewport{
        height:475px;
    }

    .indicatorWindow{
        height:190px;
    }

    .tradeBtn{
        height:82px;
        font-size:18px;
    }
}

@media(max-width:430px){

    .header{
        gap:4px;
    }

    .logo{
        font-size:14px;
    }

    .headerMetric{
        min-width:48px;
    }

    .headerValue{
        font-size:11px;
    }

    .livePrice{
        font-size:15px;
    }

    .patInput{
        width:115px;
        font-size:10px;
    }

    .connectBtn{
        width:73px;
        font-size:10px;
    }

    .connectionMarket{
        width:63px;
        font-size:10px;
    }

    .chartViewport{
        height:460px;
    }

    .indicatorWindow{
        height:185px;
    }

    .tradeBtn{
        height:84px;
        font-size:17px;
    }

    .bottomControls{
        gap:4px;
    }

    .bottomLabel{
        font-size:7px;
    }

    .bottomInput,
    .bottomSelect,
    .indicatorButton{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

    <div class="logo">
        AJ @ Ganeva
    </div>

    <div class="headerMetric">

        <div class="headerLabel">
            Balance
        </div>

        <div
            id="balance"
            class="headerValue">
            --
        </div>

    </div>

    <div class="headerMetric">

        <div class="headerLabel">
            Time
        </div>

        <div
            id="digitalTime"
            class="headerValue">
            --:--:--
        </div>

    </div>

    <div class="headerMetric">

        <div class="headerLabel">
            Live
        </div>

        <div
            id="livePrice"
            class="livePrice">
            --
        </div>

    </div>

</div>


<!-- =====================================================
     PAT / MARKET / CONNECT
     ===================================================== -->

<div class="connection">

    <input
        id="pat"
        class="patInput"
        type="password"
        autocomplete="off"
        placeholder="Paste Deriv PAT">

    <button
        id="connectBtn"
        class="connectBtn">
        CONNECT
    </button>

    <select
        id="marketSelect"
        class="connectionMarket">

        <option value="R_25">R25</option>
        <option value="R_50">R50</option>
        <option value="R_75">R75</option>
        <option value="R_100">R100</option>

    </select>

</div>


<!-- =====================================================
     DEMO / LIVE
     ===================================================== -->

<div class="accountSwitch">

    <button
        id="demoBtn"
        class="active">
        DEMO
    </button>

    <button
        id="liveBtn">
        LIVE
    </button>

</div>


<!-- =====================================================
     CHART
     ===================================================== -->

<div class="chartPanel">

    <div class="chartTop">

        <div class="chartControl">

            <label>
                Chart Time
            </label>

            <select id="chartTime">

                <option value="1t">
                    1 Tick
                </option>

                <option value="5t">
                    5 Ticks
                </option>

                <option value="1m" selected>
                    1 Minute
                </option>

                <option value="5m">
                    5 Minutes
                </option>

                <option value="15m">
                    15 Minutes
                </option>

            </select>

        </div>


        <div class="chartControl">

            <label>
                Chart
            </label>

            <select id="chartStyle">

                <option value="candles" selected>
                    Candles
                </option>

                <option value="line">
                    Line
                </option>

            </select>

        </div>

    </div>


    <div
        id="chartViewport"
        class="chartViewport">

        <canvas id="chartCanvas"></canvas>

        <div class="chartInfo">

            <div
                id="chartMarketName"
                class="market">
                R_25
            </div>

            <div
                id="chartInfoText"
                class="sub">
                Waiting for Deriv live market...
            </div>

        </div>

        <div
            id="chartStatus"
            class="chartStatus">
            DISCONNECTED
        </div>

    </div>


    <!-- =================================================
         INDICATOR WINDOW 1
         ================================================= -->

    <div
        id="indicatorWindow"
        class="indicatorWindow">

        <canvas
            id="indicatorCanvas">
        </canvas>

        <div
            id="indicatorTitle"
            class="indicatorTitle">
            Window 1
        </div>

        <div
            id="indicatorStatus"
            class="indicatorStatus">
        </div>

    </div>


    <div class="chartNav">

        <button id="zoomOut">
            −
        </button>

        <span>
            Deriv live chart
        </span>

        <button id="zoomIn">
            +
        </button>

    </div>

</div>


<!-- =====================================================
     OPEN POSITIONS
     ===================================================== -->

<div
    id="positionPanel"
    class="positionPanel">

    <div
        id="positionHeader"
        class="positionHeader">

        <div class="sectionTitle">
            Open Position
        </div>

        <div
            id="positionArrow"
            class="positionArrow">
            ▼
        </div>

    </div>


    <div class="positionBody">

        <table class="positionTable">

            <thead>

                <tr>

                    <th>Mkt</th>
                    <th>Stake</th>
                    <th>Live PL</th>
                    <th>EPT</th>

                </tr>

            </thead>

            <tbody id="positionsBody">

            </tbody>

        </table>


        <div
            id="noPositions"
            class="noPositions">
            No open positions
        </div>

    </div>

</div>


<!-- =====================================================
     ENTRY PAD
     ===================================================== -->

<div class="tradePad">

    <button
        id="riseBtn"
        class="tradeBtn rise">

        <span class="tradeArrow">
            ↑
        </span>

        RISE

    </button>


    <button
        id="fallBtn"
        class="tradeBtn fall">

        FALL

        <span class="tradeArrow">
            ↓
        </span>

    </button>

</div>


<!-- =====================================================
     BOTTOM CONTROLS
     ===================================================== -->

<div class="bottomControls">

    <!-- STAKE -->

    <div class="bottomBox">

        <div class="bottomLabel">
            Stake
        </div>

        <input
            id="stake"
            class="bottomInput"
            type="number"
            min="1"
            step="0.01"
            value="1">

    </div>


    <!-- EXPIRY -->

    <div class="bottomBox">

        <div class="bottomLabel">
            Expiry
        </div>

        <select
            id="tradeExpiry"
            class="bottomSelect">

            <option value="5t">
                5t
            </option>

            <option value="10t">
                10t
            </option>

            <option value="15t">
                15t
            </option>

            <option value="5m" selected>
                5m
            </option>

            <option value="10m">
                10m
            </option>

            <option value="custom">
                Custom
            </option>

        </select>

    </div>


    <!-- INDICATOR -->

    <div
        id="indicatorMenu"
        class="bottomBox indicatorMenu">

        <div class="bottomLabel">
            Indicator
        </div>

        <button
            id="indicatorButton"
            class="indicatorButton">
            Add
        </button>


        <div
            id="indicatorDropdown"
            class="indicatorDropdown">

            <button
                class="indicatorOption"
                data-indicator="RSI">
                RSI
            </button>

            <button
                class="indicatorOption"
                data-indicator="MACD">
                MACD
            </button>

            <button
                class="indicatorOption"
                data-indicator="MA">
                MA
            </button>

            <button
                class="indicatorOption"
                data-indicator="CLEAR">
                Remove Indicator
            </button>

        </div>

    </div>


    <!-- SETTING -->

    <div
        class="bottomBox">

        <div class="bottomLabel">
            Setting
        </div>

        <button
            id="settingsButton"
            class="indicatorButton">
            Setting
        </button>

    </div>

</div>


<!-- =====================================================
     INDICATOR SETTINGS
     ===================================================== -->

<div
    id="settingsPanel"
    class="settingsPanel">

    <div class="sectionTitle">
        Indicator Settings
    </div>

    <div
        id="settingsContent"
        class="settingsGrid">

    </div>

</div>


<!-- =====================================================
     SYSTEM LOG
     ===================================================== -->

<div
    id="logPanel"
    class="logPanel">

    <div
        id="logHeader"
        class="logHeader">

        <div class="sectionTitle">
            System Log
        </div>

        <div class="logArrow">
            ▼
        </div>

    </div>

    <div class="logBody">

        <div
            id="log"
            class="log">
        </div>

    </div>

</div>

</div>


<script>

/* =========================================================
   DERIV CONFIG
   ========================================================= */

const APP_ID =
    "3447X0mxYSFx7iRN27jhP";

const API_BASE =
    "https://api.derivws.com";

const PUBLIC_WS =
    "wss://api.derivws.com/trading/v1/options/ws/public";


/* =========================================================
   STATE
   ========================================================= */

let pat = "";

let selectedAccountType =
    "demo";

let accountId = null;

let accountCurrency =
    "USD";

let authenticatedWS =
    null;

let publicWS =
    null;

let connected =
    false;

let currentMarket =
    "R_25";

let currentChartMode =
    "1m";

/* =========================================================
   LOG
   ========================================================= */

function log(
    message,
    type="info"
){

    const box =
        $("log");

    const time =
        new Date()
        .toLocaleTimeString();

    const line =
        document.createElement("div");

    line.className =
        "logLine " + type;

    line.innerHTML =
        `<span class="logTime">[${time}]</span> ${escapeHTML(message)}`;

    box.appendChild(line);

    while(
        box.children.length > 80
    ){

        box.removeChild(
            box.firstChild
        );

    }

    box.scrollTop =
        box.scrollHeight;
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas(){

    const rect =
        viewport
        .getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(
            rect.width * dpr
        );

    canvas.height =
        Math.floor(
            rect.height * dpr
        );

    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    const irect =
        $("indicatorWindow")
        .getBoundingClientRect();

    indicatorCanvas.width =
        Math.floor(
            irect.width * dpr
        );

    indicatorCanvas.height =
        Math.floor(
            irect.height * dpr
        );

    indicatorCanvas.style.width =
        irect.width + "px";

    indicatorCanvas.style.height =
        irect.height + "px";

    ictx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawAll();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   PUBLIC DERIV WS
   ========================================================= */

function openPublicWS(){

    if(
        publicWS &&
        (
            publicWS.readyState ===
            WebSocket.OPEN ||

            publicWS.readyState ===
            WebSocket.CONNECTING
        )
    ){

        return;

    }


    publicWS =
        new WebSocket(
            PUBLIC_WS
        );


    publicWS.onopen =
        () => {

            subscribeMarketData();

            log(
                "Deriv live market stream connected.",
                "good"
            );

        };


    publicWS.onmessage =
        event => {

            let data;

            try{

                data =
                    JSON.parse(
                        event.data
                    );

            }
            catch{

                return;

            }

            handlePublicMessage(
                data
            );

        };


    publicWS.onerror =
        () => {

            log(
                "Deriv market stream error.",
                "bad"
            );

        };


    publicWS.onclose =
        () => {

            log(
                "Deriv market stream closed.",
                "warn"
            );

        };

}


/* =========================================================
   SUBSCRIBE MARKET
   ========================================================= */

function subscribeMarketData(){

    if(
        !publicWS ||
        publicWS.readyState !==
        WebSocket.OPEN
    ){

        return;

    }


    tickHistory =
        [];

    chartBars =
        [];

    currentTick =
        null;

    panOffset =
        0;


    const historyReq =
        req();


    publicWS.send(
        JSON.stringify({

            ticks_history:
                currentMarket,

            count:
                1500,

            end:
                "latest",

            style:
                "ticks",

            req_id:
                historyReq

        })
    );


    const tickReq =
        req();


    publicWS.send(
        JSON.stringify({

            ticks:
                currentMarket,

            subscribe:
                1,

            req_id:
                tickReq

        })
    );


    tickSubscription =
        tickReq;


    updateChartLabels();

}


/* =========================================================
   PUBLIC MESSAGE
   ========================================================= */

function handlePublicMessage(
    data
){

    if(data.error){

        log(
            data.error.message ||
            "Deriv market error.",
            "bad"
        );

        return;

    }


    if(
        data.msg_type ===
        "history"
    ){

        processHistoricalTicks(
            data
        );

        return;

    }


    if(
        data.msg_type ===
        "tick"
    ){

        const tick =
            data.tick;

        if(!tick) return;


        const epoch =
            Number(
                tick.epoch
            );

        const quote =
            Number(
                tick.quote
            );


        if(
            !Number.isFinite(epoch) ||
            !Number.isFinite(quote)
        ){

            return;

        }


        currentTick = {
            epoch,
            quote
        };


        tickHistory.push(
            currentTick
        );


        if(
            tickHistory.length >
            3000
        ){

            tickHistory.shift();

        }


        $("livePrice")
            .textContent =
            formatPrice(
                quote
            );


        updateChartFromTicks();

    }

}


/* =========================================================
   HISTORICAL
   ========================================================= */

function processHistoricalTicks(
    data
){

    const prices =
        data.history &&
        data.history.prices
        ? data.history.prices
        : [];


    const times =
        data.history &&
        data.history.times
        ? data.history.times
        : [];


    tickHistory =
        [];


    const count =
        Math.min(
            prices.length,
            times.length
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const quote =
            Number(
                prices[i]
            );

        const epoch =
            Number(
                times[i]
            );


        if(
            Number.isFinite(quote) &&
            Number.isFinite(epoch)
        ){

            tickHistory.push({

                quote,
                epoch

            });

        }

    }


    if(
        tickHistory.length
    ){

        currentTick =
            tickHistory[
                tickHistory.length-1
            ];

        $("livePrice")
            .textContent =
            formatPrice(
                currentTick.quote
            );

    }


    updateChartFromTicks();


    log(
        "Loaded " +
        tickHistory.length +
        " Deriv live ticks.",
        "good"
    );

}


/* =========================================================
   FORMAT PRICE
   ========================================================= */

function formatPrice(
    price
){

    if(
        !Number.isFinite(price)
    ){

        return "--";

    }

    return Number(price)
        .toFixed(2);

}


/* =========================================================
   BUILD BARS
   ========================================================= */

function buildBars(
    ticks,
    mode
){

    if(!ticks.length)
        return [];


    const bars = [];


    /* 1 TICK */

    if(
        mode === "1t"
    ){

        for(
            const t of ticks
        ){

            bars.push({

                time:t.epoch,
                open:t.quote,
                high:t.quote,
                low:t.quote,
                close:t.quote

            });

        }

        return bars.slice(-500);

    }


    /* 5 TICKS */

    if(
        mode === "5t"
    ){

        for(
            let i=0;
            i<ticks.length;
            i+=5
        ){

            const group =
                ticks.slice(
                    i,
                    i+5
                );

            if(!group.length)
                continue;


            const values =
                group.map(
                    x=>x.quote
                );


            bars.push({

                time:
                    group[0].epoch,

                open:
                    values[0],

                high:
                    Math.max(
                        ...values
                    ),

                low:
                    Math.min(
                        ...values
                    ),

                close:
                    values[
                        values.length-1
                    ]

            });

        }

        return bars.slice(-500);

    }


    let seconds =
        60;


    if(
        mode === "5m"
    )
        seconds = 300;


    if(
        mode === "15m"
    )
        seconds = 900;


    let bucket =
        null;

    let bar =
        null;


    for(
        const t of ticks
    ){

        const key =
            Math.floor(
                t.epoch / seconds
            ) *
            seconds;


        if(
            bucket !== key
        ){

            if(bar)
                bars.push(bar);


            bucket =
                key;


            bar = {

                time:
                    key,

                open:
                    t.quote,

                high:
                    t.quote,

                low:
                    t.quote,

                close:
                    t.quote

            };

        }
        else{

            bar.high =
                Math.max(
                    bar.high,
                    t.quote
                );

            bar.low =
                Math.min(
                    bar.low,
                    t.quote
                );

            bar.close =
                t.quote;

        }

    }


    if(bar)
        bars.push(bar);


    return bars.slice(-500);

}

/* =========================================================
   SHARED CHART COORDINATES
   ========================================================= */

function getChartView(){

    const rect =
        viewport
        .getBoundingClientRect();

    const W =
        rect.width;

    const H =
        rect.height;


    const visible =
        Math.max(
            20,
            Math.floor(
                85 / zoomLevel
            )
        );


    const end =
        chartBars.length -
        Math.max(
            0,
            Math.floor(
                panOffset
            )
        );


    const start =
        Math.max(
            0,
            end-visible
        );


    const view =
        chartBars.slice(
            start,
            end
        );


    if(!view.length)
        return null;


    let min =
        Math.min(
            ...view.map(
                b=>b.low
            )
        );


    let max =
        Math.max(
            ...view.map(
                b=>b.high
            )
        );


    const range =
        max-min || 1;


    min -=
        range*.08;

    max +=
        range*.08;


    const topPad =
        35;

    const bottomPad =
        30;


    const plotW =
        W-50;


    const spacing =
        plotW /
        Math.max(
            1,
            view.length
        );


    function priceY(
        price
    ){

        return(
            topPad +
            (
                max-price
            ) /
            (max-min) *
            (
                H-topPad-bottomPad
            )
        );

    }


    return{

        W,
        H,
        view,
        start,
        end,
        min,
        max,
        topPad,
        bottomPad,
        plotW,
        spacing,
        priceY

    };

}

/* =========================================================
   MAIN CHART
   ========================================================= */

function drawChart(){

    const rect =
        viewport
        .getBoundingClientRect();

    const W =
        rect.width;

    const H =
        rect.height;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "#071321";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const viewData =
        getChartView();


    if(!viewData){

        ctx.fillStyle =
            "#60768c";

        ctx.font =
            "12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            connected
                ? "Waiting for Deriv live price..."
                : "Connect to load Deriv market",
            W/2,
            H/2
        );

        return;

    }


    const {

        view,
        min,
        max,
        topPad,
        bottomPad,
        plotW,
        spacing,
        priceY

    } = viewData;


    /* GRID */

    ctx.strokeStyle =
        "rgba(90,120,150,.14)";

    ctx.lineWidth =
        1;


    for(
        let i=1;
        i<6;
        i++
    ){

        const y =
            topPad +
            (
                H-
                topPad-
                bottomPad
            )*
            i/6;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }


    for(
        let i=1;
        i<8;
        i++
    ){

        const x =
            W*i/8;


        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();

    }


    /* PRICE LABELS */

    ctx.textAlign =
        "right";

    ctx.font =
        "10px Arial";

    ctx.fillStyle =
        "#61778d";


    for(
        let i=0;
        i<=5;
        i++
    ){

        const p =
            max-
            (
                max-min
            )*
            i/5;


        const y =
            topPad+
            (
                H-
                topPad-
                bottomPad
            )*
            i/5;


        ctx.fillText(
            formatPrice(p),
            W-5,
            y-2
        );

    }


    /* MA ON MAIN CHART */

    if(
        activeIndicator === "MA" &&
        indicatorSettings.MA.placement ===
        "main"
    ){

        drawMainMA(
            view,
            spacing,
            priceY
        );

    }


    /* CANDLES */

    if(
        currentChartStyle ===
        "line"
    ){

        ctx.beginPath();


        view.forEach(
            (bar,i)=>{

                const x =
                    5+
                    i*spacing+
                    spacing/2;


                const y =
                    priceY(
                        bar.close
                    );


                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);

            }
        );


        ctx.strokeStyle =
            "#3ab8ff";

        ctx.lineWidth =
            1.7;

        ctx.stroke();

    }
    else{

        const candleW =
            Math.max(
                3,
                spacing*.68
            );


        view.forEach(
            (bar,i)=>{

                const x =
                    5+
                    i*spacing+
                    spacing/2;


                const openY =
                    priceY(
                        bar.open
                    );

                const closeY =
                    priceY(
                        bar.close
                    );

                const highY =
                    priceY(
                        bar.high
                    );

                const lowY =
                    priceY(
                        bar.low
                    );


                const bullish =
                    bar.close >=
                    bar.open;


                ctx.strokeStyle =
                    bullish
                        ? "#23c88a"
                        : "#ef536a";

                ctx.fillStyle =
                    bullish
                        ? "#23c88a"
                        : "#ef536a";


                ctx.beginPath();

                ctx.moveTo(
                    x,
                    highY
                );

                ctx.lineTo(
                    x,
                    lowY
                );

                ctx.stroke();


                const bodyTop =
                    Math.min(
                        openY,
                        closeY
                    );


                const bodyHeight =
                    Math.max(
                        1,
                        Math.abs(
                            openY-
                            closeY
                        )
                    );


                ctx.fillRect(
                    x-candleW/2,
                    bodyTop,
                    candleW,
                    bodyHeight
                );

            }
        );

    }


    /* CURRENT PRICE */

    if(currentTick){

        const y =
            priceY(
                currentTick.quote
            );


        ctx.setLineDash(
            [4,4]
        );

        ctx.strokeStyle =
            "#39b9ff";

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

        ctx.setLineDash([]);


        ctx.fillStyle =
            "#1675d1";

        ctx.fillRect(
            W-49,
            y-9,
            49,
            18
        );


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "10px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            formatPrice(
                currentTick.quote
            ),
            W-24,
            y+4
        );

    }


    /* MULTIPLE ACTUAL ENTRY LINES */

    positions.forEach(
        position => {

            if(
                position.entrySpot ==
                null
            )
                return;


            const entry =
                Number(
                    position.entrySpot
                );


            const y =
                priceY(entry);


            ctx.setLineDash(
                [6,4]
            );


            ctx.strokeStyle =
                position.direction ===
                "RISE"
                    ? "#21d68c"
                    : "#ff4e69";


            ctx.beginPath();

            ctx.moveTo(
                0,
                y
            );

            ctx.lineTo(
                W,
                y
            );

            ctx.stroke();

            ctx.setLineDash([]);


            ctx.fillStyle =
                position.direction ===
                "RISE"
                    ? "#21d68c"
                    : "#ff4e69";


            ctx.font =
                "bold 9px Arial";

            ctx.textAlign =
                "left";


            ctx.fillText(
                position.direction +
                " " +
                formatPrice(entry),
                8,
                y-5
            );

        }
    );

}


/* =========================================================
   MAIN CHART MA
   ========================================================= */

function drawMainMA(
    view,
    spacing,
    priceY
){

    const period =
        Math.max(
            1,
            Number(
                indicatorSettings.MA.period
            )
        );


    const closes =
        chartBars.map(
            b=>b.close
        );


    const values =
        calculateSMA(
            closes,
            period
        );


    const startIndex =
        chartBars.length -
        view.length -
        Math.max(
            0,
            Math.floor(panOffset)
        );


    ctx.beginPath();

    let first =
        true;


    for(
        let i=0;
        i<view.length;
        i++
    ){

        const globalIndex =
            startIndex+i;


        const value =
            values[
                globalIndex
            ];


        if(
            value == null
        )
            continue;


        const x =
            5+
            i*spacing+
            spacing/2;


        const y =
            priceY(value);


        if(first){

            ctx.moveTo(
                x,
                y
            );

            first=false;

        }
        else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        1.8;

    ctx.stroke();

}


/* =========================================================
   RSI
   ========================================================= */

function calculateRSI(
    prices,
    period=14
){

    if(
        prices.length <=
        period
    )
        return [];


    const result =
        new Array(
            prices.length
        ).fill(null);


    let gains =
        0;

    let losses =
        0;


    for(
        let i=1;
        i<=period;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];


        if(change>0)
            gains += change;
        else
            losses -= change;

    }


    let avgGain =
        gains/period;

    let avgLoss =
        losses/period;


    result[period] =
        avgLoss === 0
            ? 100
            : 100-
              (
                  100/
                  (
                      1+
                      avgGain/
                      avgLoss
                  )
              );


    for(
        let i=period+1;
        i<prices.length;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];


        const gain =
            change>0
                ? change
                : 0;


        const loss =
            change<0
                ? -change
                : 0;


        avgGain =
            (
                avgGain*
                (period-1)+
                gain
            )/period;


        avgLoss =
            (
                avgLoss*
                (period-1)+
                loss
            )/period;


        result[i] =
            avgLoss === 0
                ? 100
                : 100-
                  (
                      100/
                      (
                          1+
                          avgGain/
                          avgLoss
                      )
                  );

    }


    return result;

}


/* =========================================================
   SMA
   ========================================================= */

function calculateSMA(
    prices,
    period=20
){

    const result =
        new Array(
            prices.length
        ).fill(null);


    if(
        period<=0
    )
        return result;


    let sum=0;


    for(
        let i=0;
        i<prices.length;
        i++
    ){

        sum +=
            prices[i];


        if(
            i>=period
        ){

            sum -=
                prices[
                    i-period
                ];

        }


        if(
            i>=period-1
        ){

            result[i] =
                sum/period;

        }

    }


    return result;

}


/* =========================================================
   EMA
   ========================================================= */

function calculateEMA(
    prices,
    period
){

    const result =
        new Array(
            prices.length
        ).fill(null);


    if(
        prices.length<
        period
    )
        return result;


    let sum=0;


    for(
        let i=0;
        i<period;
        i++
    ){

        sum +=
            prices[i];

    }


    let ema =
        sum/period;


    result[
        period-1
    ] =
        ema;


    const multiplier =
        2/
        (
            period+1
        );


    for(
        let i=period;
        i<prices.length;
        i++
    ){

        ema =
            (
                prices[i]-
                ema
            )*
            multiplier+
            ema;


        result[i] =
            ema;

    }


    return result;

}


/* =========================================================
   MACD
   ========================================================= */

function calculateMACD(
    prices,
    fast=12,
    slow=26,
    signal=9
){

    const fastEMA =
        calculateEMA(
            prices,
            fast
        );


    const slowEMA =
        calculateEMA(
            prices,
            slow
        );


    const macd =
        new Array(
            prices.length
        ).fill(null);


    for(
        let i=0;
        i<prices.length;
        i++
    ){

        if(
            fastEMA[i] != null &&
            slowEMA[i] != null
        ){

            macd[i] =
                fastEMA[i]-
                slowEMA[i];

        }

    }


    const cleanMACD =
        macd.filter(
            v=>v!=null
        );


    const signalClean =
        calculateEMA(
            cleanMACD,
            signal
        );


    const signalLine =
        new Array(
            prices.length
        ).fill(null);


    const histogram =
        new Array(
            prices.length
        ).fill(null);


    let j=0;


    for(
        let i=0;
        i<prices.length;
        i++
    ){

        if(
            macd[i]==null
        )
            continue;


        signalLine[i] =
            signalClean[j];


        if(
            signalLine[i] != null
        ){

            histogram[i] =
                macd[i]-
                signalLine[i];

        }


        j++;

    }


    return{
        macd,
        signal:signalLine,
        histogram
    };

}

/* =========================================================
   RSI WINDOW
   ========================================================= */

function drawRSI(
    prices,
    view,
    spacing,
    viewData
){

    const period =
        Number(
            indicatorSettings.RSI.period
        );


    const values =
        calculateRSI(
            prices,
            period
        );


    const W =
        viewData.W;

    const H =
        viewData.H;


    const top =
        25;

    const bottom =
        20;


    function y(v){

        return(
            top+
            (
                100-v
            )/
            100*
            (
                H-top-bottom
            )
        );

    }


    /* RSI LEVELS */

    const levels =
        [5,10,90,95];


    levels.forEach(
        level=>{

            const yy =
                y(level);


            ictx.strokeStyle =
                level===5 ||
                level===95
                    ? "rgba(255,120,120,.65)"
                    : "rgba(130,170,205,.55)";


            ictx.lineWidth =
                level===5 ||
                level===95
                    ? 1.4
                    : 1;


            ictx.beginPath();

            ictx.moveTo(
                0,
                yy
            );

            ictx.lineTo(
                W,
                yy
            );

            ictx.stroke();


            ictx.fillStyle =
                "#90a9bd";

            ictx.font =
                "9px Arial";

            ictx.textAlign =
                "right";

            ictx.fillText(
                String(level),
                W-4,
                yy-2
            );

        }
    );


    /* 50 MIDLINE */

    ictx.strokeStyle =
        "rgba(130,160,190,.22)";

    ictx.lineWidth=1;

    ictx.beginPath();

    ictx.moveTo(
        0,
        y(50)
    );

    ictx.lineTo(
        W,
        y(50)
    );

    ictx.stroke();


    /* RSI LINE */

    const startIndex =
        chartBars.length-
        view.length-
        Math.max(
            0,
            Math.floor(panOffset)
        );


    ictx.beginPath();

    let first=true;


    for(
        let i=0;
        i<view.length;
        i++
    ){

        const global =
            startIndex+i;


        const value =
            values[global];


        if(value==null)
            continue;


        const x =
            indicatorX(
                i,
                spacing
            );


        const yy =
            y(value);


        if(first){

            ictx.moveTo(
                x,
                yy
            );

            first=false;

        }
        else{

            ictx.lineTo(
                x,
                yy
            );

        }

    }


    ictx.strokeStyle =
        "#b86cff";

    ictx.lineWidth =
        2;

    ictx.stroke();


    /* CURRENT RSI */

    const currentIndex =
        values.length-1;


    if(
        values[currentIndex]!=null
    ){

        const current =
            values[currentIndex];


        ictx.fillStyle =
            "#b86cff";

        ictx.font =
            "bold 10px Arial";

        ictx.textAlign =
            "left";

        ictx.fillText(
            "RSI " +
            current.toFixed(1),
            7,
            15
        );

    }

}


/* =========================================================
   MACD WINDOW
   ========================================================= */

function drawMACD(
    prices,
    view,
    spacing,
    viewData
){

    const fast =
        Number(
            indicatorSettings.MACD.fast
        );

    const slow =
        Number(
            indicatorSettings.MACD.slow
        );

    const signal =
        Number(
            indicatorSettings.MACD.signal
        );


    const data =
        calculateMACD(
            prices,
            fast,
            slow,
            signal
        );


    const W =
        viewData.W;

    const H =
        viewData.H;


    let values=[];


    for(
        let i=0;
        i<view.length;
        i++
    ){

        const global =
            chartBars.length-
            view.length-
            Math.max(
                0,
                Math.floor(panOffset)
            )+
            i;


        if(
            data.macd[global]!=null
        ){

            values.push(
                data.macd[global]
            );

            if(
                data.signal[global]!=null
            )
                values.push(
                    data.signal[global]
                );

            if(
                data.histogram[global]!=null
            )
                values.push(
                    data.histogram[global]
                );

        }

    }


    if(!values.length)
        return;


    let min =
        Math.min(...values);

    let max =
        Math.max(...values);


    const range =
        max-min || 1;


    min -=
        range*.15;

    max +=
        range*.15;


    const top=24;
    const bottom=18;


    function y(v){

        return(
            top+
            (
                max-v
            )/
            (max-min)*
            (
                H-top-bottom
            )
        );

    }


    const zeroY =
        y(0);


    ictx.strokeStyle =
        "rgba(130,160,190,.35)";

    ictx.lineWidth=1;

    ictx.beginPath();

    ictx.moveTo(
        0,
        zeroY
    );

    ictx.lineTo(
        W,
        zeroY
    );

    ictx.stroke();


    const startIndex =
        chartBars.length-
        view.length-
        Math.max(
            0,
            Math.floor(panOffset)
        );


    /* HISTOGRAM */

    for(
        let i=0;
        i<view.length;
        i++
    ){

        const global =
            startIndex+i;


        const hist =
            data.histogram[
                global
            ];


        if(
            hist==null
        )
            continue;


        const x =
            indicatorX(
                i,
                spacing
            );


        const yy =
            y(hist);


        ictx.fillStyle =
            hist>=0
                ? "rgba(45,205,145,.65)"
                : "rgba(239,83,106,.65)";


        ictx.fillRect(
            x-spacing*.35,
            Math.min(
                yy,
                zeroY
            ),
            Math.max(
                2,
                spacing*.7
            ),
            Math.abs(
                yy-zeroY
            )
        );

    }


    /* MACD LINE */

    drawIndicatorLine(
        data.macd,
        startIndex,
        view.length,
        spacing,
        y,
        "#45c9ff"
    );


    /* SIGNAL LINE */

    drawIndicatorLine(
        data.signal,
        startIndex,
        view.length,
        spacing,
        y,
        "#ffb84d"
    );


    ictx.fillStyle =
        "#45c9ff";

    ictx.font =
        "bold 10px Arial";

    ictx.textAlign =
        "left";

    ictx.fillText(
        "MACD " +
        fast +
        "," +
        slow +
        "," +
        signal,
        7,
        15
    );

}


/* =========================================================
   GENERIC INDICATOR LINE
   ========================================================= */

function drawIndicatorLine(
    values,
    startIndex,
    length,
    spacing,
    y,
    stroke
){

    ictx.beginPath();

    let first=true;


    for(
        let i=0;
        i<length;
        i++
    ){

        const global =
            startIndex+i;


        const value =
            values[global];


        if(value==null)
            continue;


        const x =
            indicatorX(
                i,
                spacing
            );


        const yy =
            y(value);


        if(first){

            ictx.moveTo(
                x,
                yy
            );

            first=false;

        }
        else{

            ictx.lineTo(
                x,
                yy
            );

        }

    }


    ictx.strokeStyle =
        stroke;

    ictx.lineWidth =
        1.7;

    ictx.stroke();

}

/* =========================================================
   REMAINING TIME
   ========================================================= */

function formatRemaining(
    position
){

    if(
        !position.expiryTime
    )
        return "--";


    const seconds =
        Math.max(
            0,
            Math.ceil(
                (
                    position.expiryTime-
                    Date.now()
                )/1000
            )
        );


    const minutes =
        Math.floor(
            seconds/60
        );


    const secs =
        seconds%60;


    return(
        minutes+
        ":"+
        String(secs)
            .padStart(
                2,
                "0"
            )
    );

}


/* =========================================================
   EXPIRY
   ========================================================= */

function expiryToObject(
    value
){

    if(
        value ===
        "custom"
    ){

        return{

            duration:
                customExpirySeconds,

            unit:
                "s"

        };

    }


    if(
        value.endsWith("t")
    ){

        return{

            duration:
                Number(
                    value.replace(
                        "t",
                        ""
                    )
                ),

            unit:
                "t"

        };

    }


    if(
        value.endsWith("m")
    ){

        return{

            duration:
                Number(
                    value.replace(
                        "m",
                        ""
                    )
                ),

            unit:
                "m"

        };

    }


    return{

        duration:5,
        unit:"m"

    };

}

/* =========================================================
   CONNECT
   ========================================================= */

async function connect(){

    pat =
        $("pat")
        .value
        .trim();


    if(!pat){

        log(
            "Paste your PAT before connecting.",
            "bad"
        );

        return;

    }


    $("connectBtn")
        .disabled =
        true;


    $("chartStatus")
        .textContent =
        "AUTHENTICATING";


    try{

        const accounts =
            await getAccounts();


        const wanted =
            selectedAccountType ===
            "demo"
                ? "DOT"
                : "CR";


        let account =
            accounts.find(
                a=>
                    String(
                        a.account_id ||
                        a.loginid ||
                        ""
                    ).startsWith(
                        wanted
                    )
            );


        if(!account){

            account =
                accounts.find(
                    a=>
                        String(
                            a.account_type ||
                            ""
                        ).toLowerCase() ===
                        selectedAccountType
                );

        }


        if(!account){

            throw new Error(
                "No "+
                selectedAccountType+
                " Options account was found."
            );

        }


        accountId =
            account.account_id ||
            account.loginid ||
            account.id;


        accountCurrency =
            account.currency ||
            "USD";


        const wsUrl =
            await getOTP(
                accountId
            );


        await openAuthenticatedWS(
            wsUrl
        );


        connected =
            true;


        $("connectBtn")
            .textContent =
            "CONNECTED";


        $("connectBtn")
            .classList.add(
                "connected"
            );


        $("chartStatus")
            .textContent =
            "CONNECTED";


        log(
            selectedAccountType
            .toUpperCase()+
            " account connected.",
            "good"
        );


        subscribeAuthenticatedData();


        if(
            !publicWS ||
            publicWS.readyState !==
            WebSocket.OPEN
        ){

            openPublicWS();

        }
        else{

            subscribeMarketData();

        }

    }
    catch(error){

        log(
            error.message ||
            "Connection failed.",
            "bad"
        );


        $("chartStatus")
            .textContent =
            "CONNECTION FAILED";

    }
    finally{

        $("connectBtn")
            .disabled =
            false;

    }

}


/* =========================================================
   GET ACCOUNTS
   ========================================================= */

async function getAccounts(){

    const response =
        await fetch(
            API_BASE+
            "/trading/v1/options/accounts",
            {

                method:"GET",

                headers:{

                    "Deriv-App-ID":
                        APP_ID,

                    "Authorization":
                        "Bearer "+
                        pat

                }

            }
        );


    const json =
        await response.json();


    if(
        !response.ok
    ){

        throw new Error(
            json?.errors?.[0]?.message ||
            "Unable to retrieve Deriv accounts."
        );

    }


    if(
        json.data &&
        Array.isArray(
            json.data.accounts
        )
    ){

        return json.data.accounts;

    }


    if(
        json.data &&
        Array.isArray(
            json.data
        )
    ){

        return json.data;

    }


    if(
        Array.isArray(
            json.accounts
        )
    ){

        return json.accounts;

    }


    throw new Error(
        "Deriv returned no Options accounts."
    );

}


/* =========================================================
   OTP

async function getOTP(
    account
){

    const response =
        await fetch(
            API_BASE+
            "/trading/v1/options/accounts/"+
            encodeURIComponent(account)+
            "/otp",
            {

                method:"POST",

                headers:{

                    "Deriv-App-ID":
                        APP_ID,

                    "Authorization":
                        "Bearer "+
                        pat

                }

            }
        );


    const json =
        await response.json();


    if(
        !response.ok
    ){

        throw new Error(
            json?.errors?.[0]?.message ||
            "Unable to obtain Deriv WebSocket OTP."
        );

    }


    if(
        !json.data ||
        !json.data.url
    ){

        throw new Error(
            "Deriv did not return a WebSocket URL."
        );

    }


    return json.data.url;

}


/* =========================================================
   AUTH WS
   ========================================================= */

function openAuthenticatedWS(
    url
){

    return new Promise(
        (resolve,reject)=>{

            let settled =
                false;


            authenticatedWS =
                new WebSocket(
                    url
                );


            const timeout =
                setTimeout(
                    ()=>{

                        if(!settled){

                            settled =
                                true;

                            try{

                                authenticatedWS
                                    .close();

                            }
                            catch{}

                            reject(
                                new Error(
                                    "Authenticated WebSocket timed out."
                                )
                            );

                        }

                    },
                    15000
                );


            authenticatedWS.onopen =
                ()=>{

                    clearTimeout(
                        timeout
                    );


                    if(!settled){

                        settled =
                            true;

                        resolve();

                    }

                };


            authenticatedWS.onerror =
                ()=>{

                    clearTimeout(
                        timeout
                    );


                    if(!settled){

                        settled =
                            true;

                        reject(
                            new Error(
                                "Deriv trading WebSocket failed."
                            )
                        );

                    }

                };


            authenticatedWS.onclose =
                ()=>{

                    if(connected){

                        connected =
                            false;


                        $("connectBtn")
                            .textContent =
                            "CONNECT";


                        $("connectBtn")
                            .classList.remove(
                                "connected"
                            );


                        $("chartStatus")
                            .textContent =
                            "DISCONNECTED";


                        log(
                            "Deriv trading connection closed.",
                            "warn"
                        );

                    }

                };


            authenticatedWS.onmessage =
                event=>{

                    let data;


                    try{

                        data =
                            JSON.parse(
                                event.data
                            );

                    }
                    catch{

                        return;

                    }


                    handleAuthenticatedMessage(
                        data
                    );

                };

        }
    );

}


/* =========================================================
   AUTH SUBSCRIPTIONS
   ========================================================= */

function subscribeAuthenticatedData(){

    if(
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    )
        return;


    balanceSubscription =
        req();


    authenticatedWS.send(
        JSON.stringify({

            balance:1,

            subscribe:1,

            req_id:
                balanceSubscription

        })
    );


    /* Portfolio stream allows the
       application to discover existing
       open positions. */

    authenticatedWS.send(
        JSON.stringify({

            portfolio:1,

            subscribe:1,

            req_id:req()

        })
    );

}


/* =========================================================
   AUTH MESSAGE
   ========================================================= */

function handleAuthenticatedMessage(
    data
){

    if(data.error){

        log(
            data.error.message ||
            "Deriv API error.",
            "bad"
        );

        return;

    }


    if(
        data.msg_type ===
        "balance"
    ){

        const b =
            data.balance;


        if(b){

            $("balance")
                .textContent =
                Number(
                    b.balance
                ).toFixed(2)+
                " "+
                (
                    b.currency ||
                    accountCurrency
                );

        }

        return;

    }


    if(
        data.msg_type ===
        "buy"
    ){

        handleBuyResponse(
            data.buy
        );

        return;

    }


    if(
        data.msg_type ===
        "proposal"
    ){

        handleProposal(
            data.proposal
        );

        return;

    }


    if(
        data.msg_type ===
        "proposal_open_contract"
    ){

        handleOpenContract(
            data.proposal_open_contract
        );

        return;

    }


    if(
        data.msg_type ===
        "portfolio"
    ){

        handlePortfolio(
            data.portfolio
        );

        return;

    }

}


/* =========================================================
   FAST TRADE
   ========================================================= */

$("riseBtn")
    .onclick =
    ()=>placeTrade(
        "RISE"
    );


$("fallBtn")
    .onclick =
    ()=>placeTrade(
        "FALL"
    );


async function placeTrade(
    direction
){

    if(
        !connected ||
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){

        log(
            "Connect to Deriv before trading.",
            "bad"
        );

        return;

    }


    const stake =
        Number(
            $("stake").value
        );


    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){

        log(
            "Minimum stake is 1.",
            "bad"
        );

        return;

    }


    const expiry =
        $("tradeExpiry").value;


    const exp =
        expiryToObject(
            expiry
        );


    pendingTradeDirection =
        direction;


    pendingTradeStake =
        stake;


    const contractType =
        direction ===
        "RISE"
            ? "CALL"
            : "PUT";


    /* NO ARTIFICIAL DELAY */

    authenticatedWS.send(
        JSON.stringify({

            proposal:1,

            amount:
                stake,

            basis:
                "stake",

            contract_type:
                contractType,

            currency:
                accountCurrency,

            duration:
                exp.duration,

            duration_unit:
                exp.unit,

            underlying_symbol:
                currentMarket,

            req_id:
                req()

        })
    );


    log(
        direction+
        " proposal requested.",
        "info"
    );

}


/* =========================================================
   PROPOSAL
   ========================================================= */

function handleProposal(
    proposal
){

    if(!proposal)
        return;


    const direction =
        pendingTradeDirection;


    if(!direction)
        return;


    const askPrice =
        Number(
            proposal.ask_price
        );


    if(
        !Number.isFinite(
            askPrice
        )
    ){

        log(
            "Invalid Deriv proposal price.",
            "bad"
        );

        return;

    }


    /* Immediate buy request */

    authenticatedWS.send(
        JSON.stringify({

            buy:
                proposal.id,

            price:
                askPrice,

            req_id:
                req()

        })
    );


    log(
        "Buying "+
        direction+
        " at Deriv price "+
        askPrice.toFixed(2)+
        ".",
        "info"
    );


    pendingTradeDirection =
        null;

}


/* =========================================================
   BUY RESPONSE
   ========================================================= */

function handleBuyResponse(
    buy
){

    if(!buy)
        return;


    const contractId =
        buy.contract_id;


    if(!contractId){

        log(
            "No contract ID returned by Deriv.",
            "bad"
        );

        return;

    }


    const position = {

        id:
            contractId,

        market:
            currentMarket,

        direction:
            pendingTradeDirection ||
            "RISE",

        stake:
            pendingTradeStake,

        entrySpot:
            null,

        buyPrice:
            Number(
                buy.buy_price ||
                0
            ),

        profit:
            0,

        expiryTime:
            null,

        finished:
            false

    };


    positions.set(
        String(contractId),
        position
    );


    updatePositionTable();

    drawAll();


    log(
        "Contract purchased: "+
        contractId,
        "good"
    );


    authenticatedWS.send(
        JSON.stringify({

            proposal_open_contract:
                1,

            contract_id:
                contractId,

            subscribe:
                1,

            req_id:
                req()

        })
    );


    /* Clear only after creating
       the position. */

    pendingTradeDirection =
        null;

    pendingTradeStake =
        0;

}


/* =========================================================
   OPEN CONTRACT
   ========================================================= */

function handleOpenContract(
    contract
){

    if(!contract)
        return;


    const id =
        String(
            contract.contract_id
        );


    let position =
        positions.get(id);


    if(!position){

        position = {

            id,

            market:
                currentMarket,

            direction:
                contract.contract_type ===
                "CALL"
                    ? "RISE"
                    : "FALL",

            stake:
                Number(
                    contract.buy_price ||
                    0
                ),

            entrySpot:
                null,

            buyPrice:
                Number(
                    contract.buy_price ||
                    0
                ),

            profit:
                Number(
                    contract.profit ||
                    0
                ),

            expiryTime:
                null,

            finished:
                false

        };


        positions.set(
            id,
            position
        );

    }


    if(
        contract.contract_type
    ){

        position.direction =
            contract.contract_type ===
            "CALL"
                ? "RISE"
                : "FALL";

    }


    if(
        contract.entry_spot !=
        null
    ){

        position.entrySpot =
            Number(
                contract.entry_spot
            );

    }


    if(
        contract.date_expiry !=
        null
    ){

        position.expiryTime =
            Number(
                contract.date_expiry
            )*1000;

    }


    if(
        contract.profit !=
        null
    ){

        position.profit =
            Number(
                contract.profit
            );

    }


    updatePositionTable();

    drawAll();


    if(
        contract.is_sold ||
        contract.status ===
        "sold" ||
        contract.status ===
        "won" ||
        contract.status ===
        "lost"
    ){

        finishPosition(
            position,
            contract
        );

    }

}


/* =========================================================
   PORTFOLIO
   ========================================================= */

function handlePortfolio(
    portfolio
){

    if(!portfolio)
        return;


    const contracts =
        portfolio.contracts ||
        portfolio;


    if(
        !Array.isArray(
            contracts
        )
    )
        return;


    contracts.forEach(
        contract=>{

            if(
                !contract.contract_id
            )
                return;


            const id =
                String(
                    contract.contract_id
                );


            if(
                !positions.has(id)
            ){

                positions.set(
                    id,
                    {

                        id,

                        market:
                            contract.symbol ||
                            currentMarket,

                        direction:
                            contract.contract_type ===
                            "CALL"
                                ? "RISE"
                                : "FALL",

                        stake:
                            Number(
                                contract.buy_price ||
                                0
                            ),

                        entrySpot:
                            contract.entry_spot != null
                                ? Number(
                                    contract.entry_spot
                                  )
                                : null,

                        buyPrice:
                            Number(
                                contract.buy_price ||
                                0
                            ),

                        profit:
                            Number(
                                contract.profit ||
                                0
                            ),

                        expiryTime:
                            contract.date_expiry
                                ? Number(
                                    contract.date_expiry
                                  )*1000
                                : null,

                        finished:false

                    }
                );

            }

        }
    );


    updatePositionTable();

    drawAll();

}


/* =========================================================
   FINISH POSITION
   ========================================================= */

function finishPosition(
    position,
    contract
){

    if(
        position.finished
    )
        return;


    position.finished =
        true;


    position.profit =
        Number(
            contract.profit ||
            0
        );


    log(
        position.direction+
        " settled: "+
        (
            position.profit>=0
                ? "WIN "
                : "LOSS "
        )+
        position.profit.toFixed(2),

        position.profit>=0
            ? "good"
            : "bad"
    );


    updatePositionTable();


    setTimeout(
        ()=>{

            positions.delete(
                String(
                    position.id
                )
            );


            updatePositionTable();

            drawAll();

        },
        1500
    );

}

function changeMarket(
    symbol
){

    if(!symbol)
        return;


    currentMarket =
        symbol;


    $("chartMarketName")
        .textContent =
        symbol;


    tickHistory =
        [];

    chartBars =
        [];

    currentTick =
        null;

    panOffset =
        0;


    $("livePrice")
        .textContent =
        "--";


    if(
        publicWS &&
        publicWS.readyState ===
        WebSocket.OPEN
    ){

        try{

            if(
                tickSubscription
            ){

                publicWS.send(
                    JSON.stringify({

                        forget:
                            tickSubscription

                    })
                );

            }

        }
        catch{}


        subscribeMarketData();

    }


    drawAll();

}

/* =========================================================
   DRAG
   ========================================================= */

viewport.addEventListener(
    "pointerdown",
    e=>{

        dragging =
            true;

        dragStartX =
            e.clientX;

        dragStartPan =
            panOffset;


        viewport.setPointerCapture(
            e.pointerId
        );

    }
);


viewport.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX-
            dragStartX;


        const barsPerPixel =
            Math.max(
                .08,
                90/
                Math.max(
                    100,
                    viewport.clientWidth
                )
            );


        panOffset =
            dragStartPan+
            Math.round(
                dx*
                barsPerPixel*
                -1
            );


        const maxPan =
            Math.max(
                0,
                chartBars.length-20
            );


        panOffset =
            Math.max(
                0,
                Math.min(
                    maxPan,
                    panOffset
                )
            );


        drawAll();

    }
);


viewport.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


viewport.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =========================================================
   DISCONNECT
   ========================================================= */

function disconnectAll(){

    connected =
        false;


    try{

        if(
            authenticatedWS
        )
            authenticatedWS.close();

    }
    catch{}


    try{

        if(
            publicWS
        )
            publicWS.close();

    }
    catch{}


    authenticatedWS =
        null;

    publicWS =
        null;

    accountId =
        null;


    positions.clear();


    tickHistory =
        [];

    chartBars =
        [];

    currentTick =
        null;


    $("connectBtn")
        .textContent =
        "CONNECT";


    $("connectBtn")
        .classList.remove(
            "connected"
        );


    $("chartStatus")
        .textContent =
        "DISCONNECTED";


    $("balance")
        .textContent =
        "--";


    $("livePrice")
        .textContent =
        "--";


    updatePositionTable();

    drawAll();


    log(
        "Disconnected.",
        "warn"
    );

}
