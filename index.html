<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AJ @ Ganeva</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
    overflow-y:hidden;
}

button,select,input{
    font:inherit;
}

.app{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:6px;
    box-sizing:border-box;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr 1.3fr;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    flex-shrink:0;
}

.logo{
    font-size:18px;
    font-weight:900;
    color:#fff;
    white-space:nowrap;
}

.headerMetric{
    text-align:center;
    min-width:0;
}

.headerLabel{
    font-size:9px;
    color:#71859a;
    text-transform:uppercase;
}

.headerValue{
    margin-top:2px;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#livePrice{
    color:#48d8ff;
    font-size:16px;
}

#balance{
    color:#ffc94d;
}

#digitalTime{
    font-size:10px;
    font-weight:700;
    color:#c3d2e2;
}

/* =========================================================
   CONNECTION
   ========================================================= */

.connection{
    display:flex;
    align-items:center;
    gap:5px;
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.patInput{
    width:235px;
    max-width:38%;
    height:36px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:6px;
    padding:0 10px;
    outline:none;
    font-size:12px;
}

.patInput:focus{
    border-color:#269cff;
}

.connectBtn{
    height:36px;
    width:92px;
    border:1px solid #d7dee9;
    border-radius:10px;
    background:#e9edf5;
    color:#1b2436;
    font-size:11px;
    font-weight:800;
    transition:
        background .15s ease,
        transform .08s ease;
}

.connectBtn:active{
    transform:scale(.97);
}

.connectBtn:disabled{
    opacity:.55;
}

.connectBtn.connected{
    background:#d3f3e2;
    border-color:#a9e6c4;
    color:#0e6b3c;
}

/* =========================================================
   TOP CONTROLS
   ========================================================= */

.controlGrid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.control{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:8px;
    padding:4px;
    min-height:50px;
}

.controlTitle{
    text-align:center;
    color:#52b7ff;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:3px;
}

.controlValue{
    width:100%;
    height:30px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#fff;
    text-align:center;
    font-weight:800;
    font-size:11px;
    outline:none;
}

.accountSwitch{
    display:flex;
    gap:4px;
}

.accountSwitch button{
    flex:1;
    height:30px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#aebfd2;
    font-size:11px;
    font-weight:900;
}

.accountSwitch button.active{
    background:#145e99;
    border-color:#2d9fea;
    color:#fff;
}

/* =========================================================
   MAIN / POSITION LAYOUT
   ========================================================= */

.mainRow{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    gap:6px;
    margin-bottom:6px;
    overflow:hidden;
}

.chartColumn{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    min-width:0;
    gap:6px;
    overflow:hidden;
}

/* Side-by-side chart + positions only kicks in on genuinely
   wide screens (tablet/desktop). Phones always get the
   full-width stacked layout below - no breakpoint guessing,
   so the chart never gets squeezed into half the screen. */

@media(min-width:900px){

    .mainRow{
        flex:1;
        min-height:0;
    }
}

.chartPanel{
    background:#071321;
    border:1px solid #1c3855;
    border-radius:9px;
    overflow:hidden;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
}

.chartTop{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    padding:5px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
}

.chartControl label{
    display:block;
    color:#7288a0;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.chartControl select{
    width:100%;
    height:40px;
    border:1px solid #294967;
    border-radius:5px;
    background:#071321;
    color:#fff;
    padding:0 6px;
    outline:none;
    font-size:13px;
}

.chartViewport{
    position:relative;
    width:100%;
    flex:1;
    min-height:110px;
    background:#071321;
    overflow:hidden;
    touch-action:none;
}

#chartCanvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
}

.chartInfo{
    display:none;
    position:absolute;
    top:7px;
    left:7px;
    z-index:5;
    padding:6px 8px;
    border-radius:6px;
    background:rgba(5,13,23,.88);
    border:1px solid rgba(83,130,170,.35);
    pointer-events:none;
}

.chartInfo .market{
    font-weight:900;
    font-size:11px;
}

.chartInfo .sub{
    color:#91a6bc;
    font-size:9px;
    margin-top:2px;
}

.chartStatus{
    display:none;
    position:absolute;
    right:7px;
    top:7px;
    z-index:5;
    font-size:9px;
    padding:4px 6px;
    border-radius:4px;
    background:rgba(0,0,0,.55);
    color:#65c5ff;
    pointer-events:none;
}

/* =========================================================
   OPEN POSITIONS TICKER
   Compact strip along the top of the chart, replacing the
   old full-size Open Positions panel. New positions are
   prepended so the strip reads newest-first, right to left.
   ========================================================= */

.positionsTicker{
    position:absolute;
    top:5px;
    left:5px;
    right:5px;
    z-index:6;
    display:flex;
    flex-direction:row-reverse;
    gap:6px;
    overflow-x:auto;
    pointer-events:none;
}

.posTick{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:46px;
    background:rgba(5,13,23,.82);
    border:1px solid rgba(83,130,170,.3);
    border-radius:5px;
    padding:2px 5px;
    line-height:1.35;
}

.posTick .posSym{
    font-size:9px;
    font-weight:900;
    color:#dce8f5;
    white-space:nowrap;
}

.posTick .posArrow.up{
    color:#35d68d;
}

.posTick .posArrow.down{
    color:#ff526b;
}

.posTick .posPL{
    font-size:9px;
    font-weight:800;
}

.posTick .posPL.pos{
    color:#45d58b;
}

.posTick .posPL.neg{
    color:#ff6176;
}

.posTick .posTime{
    font-size:8px;
    color:#9fb3c8;
}

.chartNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:3px 5px;
    background:#0b192a;
    border-top:1px solid #162d45;
    flex-shrink:0;
}

.chartNav button{
    border:1px solid #294967;
    background:#071321;
    color:#a9bdd1;
    border-radius:5px;
    width:26px;
    height:26px;
    padding:0;
    font-size:14px;
    font-weight:900;
    line-height:1;
}

.chartNav span{
    color:#627991;
    font-size:9px;
}

/* =========================================================
   WINDOW 1
   ========================================================= */

.indicatorWindow{
    display:none;
    background:#071321;
    border:1px solid #1c3855;
    border-radius:8px;
    margin-top:0;
    overflow:hidden;
    flex-shrink:0;
}

.indicatorWindow.visible{
    display:block;
}

.indicatorHeader{
    height:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8px;
    background:#0b192a;
    border-bottom:1px solid #1c3855;
    font-size:10px;
    font-weight:900;
    color:#52b7ff;
}

.indicatorHeader button{
    border:0;
    background:transparent;
    color:#7890a7;
    font-size:15px;
    line-height:1;
}

#indicatorCanvas{
    width:100%;
    height:clamp(64px,11vh,110px);
    display:block;
}

/* =========================================================
   TRADE PAD
   ========================================================= */

.tradePad{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:6px;
    flex-shrink:0;
}

.tradeBtn{
    height:clamp(52px,9vh,80px);
    border:0;
    border-radius:12px;
    color:#fff;
    font-weight:900;
    font-size:clamp(15px,3.4vh,20px);
    cursor:pointer;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);
    touch-action:manipulation;
    user-select:none;
}

.tradeBtn.rise{
    background:#118447;
}

.tradeBtn.fall{
    background:#b92d43;
}

.tradeBtn:active{
    transform:scale(.97);
}

.tradeBtn.sending{
    opacity:.65;
    pointer-events:none;
    font-size:19px;
    letter-spacing:1px;
}

.tradeArrow{
    font-size:22px;
    margin-right:5px;
}

/* =========================================================
   BOTTOM CONTROL ROW
   ========================================================= */

.bottomRow{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:5px;
    margin-bottom:6px;
    flex-shrink:0;
}

.bottomBox{
    background:#0d1a2b;
    border:1px solid #1c3855;
    border-radius:7px;
    padding:4px 3px;
    min-width:0;
}

.bottomLabel{
    display:block;
    text-align:center;
    color:#7288a0;
    font-size:8px;
    text-transform:uppercase;
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stakeInput,
.bottomSelect{
    width:100%;
    height:32px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:5px;
    text-align:center;
    font-weight:900;
    outline:none;
    font-size:11px;
}

.indicatorButton,
.logButton{
    width:100%;
    height:32px;
    border:1px solid #294967;
    background:#071321;
    color:#fff;
    border-radius:5px;
    font-weight:900;
    font-size:10px;
}

.indicatorMenu{
    display:none;
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    bottom:calc(100% + 4px);
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    overflow:hidden;
}

.indicatorMenu.show{
    display:block;
}

.indicatorMenu button{
    display:block;
    width:100%;
    border:0;
    border-bottom:1px solid #1c3855;
    background:#0d1a2b;
    color:#fff;
    text-align:left;
    padding:8px 10px;
    font-size:11px;
}

.indicatorMenu button:hover{
    background:#145e99;
}

.indicatorBox{
    position:relative;
}

.indicatorSettings{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:38px;
    z-index:50;
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    padding:7px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
}

.indicatorSettings.show{
    display:block;
}

.settingRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    margin-bottom:8px;
    font-size:12px;
    color:#a8bacd;
}

.settingRow:last-child{
    margin-bottom:0;
}

.settingRow input,
.settingRow select{
    width:86px;
    height:34px;
    background:#071321;
    border:1px solid #294967;
    border-radius:4px;
    color:#fff;
    text-align:center;
    font-size:12px;
}

/* =========================================================
   SYSTEM LOG
   ========================================================= */

.logBox{
    position:relative;
}

.logPanel{
    display:none;
    position:absolute;
    z-index:100;
    left:0;
    right:0;
    bottom:calc(100% + 4px);
    background:#0d1a2b;
    border:1px solid #294967;
    border-radius:6px;
    padding:6px;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    max-height:26vh;
    overflow-y:auto;
}

.logPanel.show{
    display:block;
}

.log{
    max-height:100px;
    overflow-y:auto;
    font-family:monospace;
    font-size:9px;
    line-height:1.5;
}

.logLine{
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:2px 0;
}

.logTime{
    color:#597089;
}

.good{color:#45d58b}
.bad{color:#ff6176}
.info{color:#74c8ff}
.warn{color:#ffc857}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:850px){

    .header{
        grid-template-columns:1.4fr 1fr 1fr 1.2fr;
    }
}

@media(max-width:700px){

    .app{
        padding:4px;
    }

    .header{
        grid-template-columns:1.35fr .9fr .9fr 1.15fr;
        gap:4px;
    }

    .connection{
        padding:4px;
    }

    .patInput{
        width:auto;
        max-width:none;
        flex:1;
    }

    .tradeBtn{
        font-size:16px;
    }
}

@media(max-width:450px){

    .logo{
        font-size:16px;
    }

    .headerValue{
        font-size:11px;
    }

    #livePrice{
        font-size:14px;
    }

    .chartTop{
        gap:4px;
        padding:5px;
    }

    .chartControl select{
        height:34px;
        font-size:11px;
    }

    .bottomRow{
        gap:4px;
    }

    .bottomBox{
        min-height:auto;
        padding:3px 2px;
    }

    .bottomLabel{
        font-size:7px;
    }

    .stakeInput,
    .bottomSelect,
    .indicatorButton,
    .logButton{
        height:30px;
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">
        AJ @ Ganeva
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Balance</div>
        <div id="balance" class="headerValue">--</div>
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Time</div>
        <div id="digitalTime" class="headerValue">--:--:--</div>
    </div>

    <div class="headerMetric">
        <div class="headerLabel">Deriv Live Price</div>
        <div id="livePrice" class="headerValue">--</div>
    </div>

</div>


<!-- =====================================================
     PAT
===================================================== -->

<div class="connection">

    <input
        id="pat"
        class="patInput"
        type="password"
        autocomplete="off"
        placeholder="Paste Deriv PAT here">

    <button id="connectBtn" class="connectBtn">
        CONNECT
    </button>

</div>


<!-- =====================================================
     COMPACT TOP CONTROLS
===================================================== -->

<div class="controlGrid">

    <div class="control">

        <div class="controlTitle">
            Account
        </div>

        <div class="accountSwitch">

            <button id="demoBtn"
                    class="active"
                    type="button">
                DEMO
            </button>

            <button id="liveBtn"
                    type="button">
                LIVE
            </button>

        </div>

    </div>


    <div class="control">

        <div class="controlTitle">
            Market
        </div>

        <select id="marketSelect"
                class="controlValue">

            <option value="R_25">R_25</option>
            <option value="R_50">R_50</option>
            <option value="R_75">R_75</option>
            <option value="R_100">R_100</option>

        </select>

    </div>


    <div class="control">

        <div class="controlTitle">
            Chart Time
        </div>

        <select id="chartTime"
                class="controlValue">

            <option value="1t">1T</option>
            <option value="5t">5T</option>
            <option value="1m" selected>1M</option>
            <option value="5m">5M</option>
            <option value="15m">15M</option>

        </select>

    </div>


    <div class="control">

        <div class="controlTitle">
            Chart
        </div>

        <select id="chartStyle"
                class="controlValue">

            <option value="candles" selected>
                Candles
            </option>

            <option value="line">
                Line
            </option>

        </select>

    </div>

</div>


<!-- =====================================================
     CHART
===================================================== -->

<div class="mainRow">

    <div class="chartColumn">

        <div class="chartPanel">

            <div id="chartViewport"
                 class="chartViewport">

                <canvas id="chartCanvas"></canvas>

                <div class="chartInfo">

                    <div id="chartMarketName"
                         class="market">
                        R_25
                    </div>

                    <div id="chartInfoText"
                         class="sub">
                        Waiting for Deriv live market...
                    </div>

                </div>

                <div id="chartStatus"
                     class="chartStatus">
                    DISCONNECTED
                </div>

                <div id="positionsTicker"
                     class="positionsTicker">
                </div>

            </div>


            <div class="chartNav">

                <button id="zoomOut">−</button>

                <span>
                    Drag to view older Deriv prices
                </span>

                <button id="zoomIn">+</button>

            </div>

        </div>


        <!-- =================================================
             INDICATOR WINDOW 1
        ================================================== -->

        <div id="indicatorWindow"
             class="indicatorWindow">

            <div class="indicatorHeader">

                <span id="indicatorTitle">
                    INDICATOR WINDOW 1
                </span>

                <button id="closeIndicator">
                    ×
                </button>

            </div>

            <canvas id="indicatorCanvas"></canvas>

        </div>

    </div>

</div>



<!-- =====================================================
     MANUAL ENTRY
===================================================== -->

<div class="tradePad">

    <button id="riseBtn"
            class="tradeBtn rise">

        <span class="tradeArrow">↑</span>
        RISE

    </button>


    <button id="fallBtn"
            class="tradeBtn fall">

        FALL
        <span class="tradeArrow">↓</span>

    </button>

</div>


<!-- =====================================================
     BOTTOM ROW
===================================================== -->

<div class="bottomRow">

    <div class="bottomBox">

        <label class="bottomLabel">
            Stake
        </label>

        <input
            id="stake"
            class="stakeInput"
            type="number"
            min="1"
            step="0.01"
            value="1">

    </div>


    <div class="bottomBox">

        <label class="bottomLabel">
            Expiry Time
        </label>

        <select id="tradeExpiry"
                class="bottomSelect">

            <option value="5t">5T</option>
            <option value="10t">10T</option>
            <option value="15t">15T</option>
            <option value="5m" selected>5M</option>
            <option value="10m">10M</option>
            <option value="custom">Custom</option>

        </select>

    </div>


    <div class="bottomBox indicatorBox">

        <label class="bottomLabel">
            Indicator
        </label>

        <button id="indicatorButton"
                class="indicatorButton">
            SELECT ▼
        </button>

        <div id="indicatorMenu"
             class="indicatorMenu">

            <button data-indicator="RSI">
                RSI
            </button>

            <button data-indicator="MACD">
                MACD
            </button>

            <button data-indicator="MA">
                MA
            </button>

            <button data-indicator="MA_SETTINGS">
                SETTING
            </button>

        </div>


        <div id="indicatorSettings"
             class="indicatorSettings">

            <div class="settingRow">

                <span>MA Length</span>

                <input
                    id="maLength"
                    type="number"
                    min="1"
                    value="20">

            </div>

            <div class="settingRow">

                <span>MA Location</span>

                <select id="maLocation">

                    <option value="main">
                        Main Chart
                    </option>

                    <option value="window">
                        Window 1
                    </option>

                </select>

            </div>

            <div class="settingRow">

                <span>RSI Period</span>

                <input
                    id="rsiPeriod"
                    type="number"
                    min="1"
                    value="14">

            </div>

            <div class="settingRow">

                <span>MACD Fast</span>

                <input
                    id="macdFast"
                    type="number"
                    min="1"
                    value="12">

            </div>

            <div class="settingRow">

                <span>MACD Slow</span>

                <input
                    id="macdSlow"
                    type="number"
                    min="2"
                    value="26">

            </div>

            <div class="settingRow">

                <span>MACD Signal</span>

                <input
                    id="macdSignal"
                    type="number"
                    min="1"
                    value="9">

            </div>

        </div>

    </div>


    <div class="bottomBox logBox">

        <label class="bottomLabel">
            System Log
        </label>

        <button id="logButton"
                class="logButton">
            LOG ▼
        </button>

        <div id="logPanel"
             class="logPanel">

            <div id="log"
                 class="log">
            </div>

        </div>

    </div>

</div>

/* =========================================================

function handlePublicMessage(data){

    /*
       Authorize, balance, proposal, buy, and open-contract
       messages (and any errors attached to them) now arrive
       on this same socket, since authenticatedWS and publicWS
       are the same connection after authorize() succeeds.
       Route those to the authenticated handler - including
       their error responses - before the generic public-error
       branch below would otherwise swallow them.
    */

    const AUTH_MSG_TYPES = [
        "authorize",
        "balance",
        "proposal",
        "buy",
        "proposal_open_contract",
        "portfolio"
    ];

    if(
        AUTH_MSG_TYPES.includes(data.msg_type) ||
        pendingAuthorize.has(
            Number(data.req_id)
        )
    ){

        handleAuthenticatedMessage(data);
        return;
    }

    if(data.error){

        log(
            data.error.message ||
            "Deriv market error.",
            "bad"
        );

        return;
    }

    if(
        data.msg_type ===
        "history"
    ){

        processHistoricalTicks(data);
        return;

    if(
        data.msg_type ===
        "tick"
    ){

        const tick =
            data.tick;

        if(!tick) return;

        const quote =
            Number(tick.quote);

        const epoch =
            Number(tick.epoch);

/* =========================================================
   BUILD BARS
========================================================= */

function buildBars(ticks,mode){

    if(!ticks.length) return [];

    const bars = [];

    if(mode === "1t"){

        for(const t of ticks){

            bars.push({
                time:t.epoch,
                open:t.quote,
                high:t.quote,
                low:t.quote,
                close:t.quote
            });
        }

        return bars.slice(-500);
    }

    if(mode === "5t"){

        for(
            let i=0;
            i<ticks.length;
            i+=5
        ){

            const group =
                ticks.slice(i,i+5);

            if(!group.length) continue;

            const values =
                group.map(
                    x=>x.quote
                );

            bars.push({
                time:group[0].epoch,
                open:values[0],
                high:Math.max(...values),
                low:Math.min(...values),
                close:
                    values[
                        values.length-1
                    ]
            });
        }

        return bars.slice(-500);
    }

    let seconds = 60;

    if(mode === "5m")
        seconds = 300;

    if(mode === "15m")
        seconds = 900;

    let bucket = null;
    let bar = null;

    for(const t of ticks){

        const key =
            Math.floor(
                t.epoch/seconds
            )*seconds;

        if(bucket !== key){

            if(bar)
                bars.push(bar);

            bucket = key;

            bar = {
                time:key,
                open:t.quote,
                high:t.quote,
                low:t.quote,
                close:t.quote
            };

        }else{

            bar.high =
                Math.max(
                    bar.high,
                    t.quote
                );

            bar.low =
                Math.min(
                    bar.low,
                    t.quote
                );

            bar.close =
                t.quote;
        }
    }

    if(bar)
        bars.push(bar);

    return bars.slice(-500);
}

function getVisibleRange(totalBars){

        Math.max(

            Math.floor(panOffset)

    const start =
        Math.max(

            end-visible

        end

}


/* =========================================================

   so the horizontal x-position of a given bar index lines
   up exactly between the two canvases, and so the newest
   candle always sits at least one grid column in from the
   right edge instead of touching it)
========================================================= */

function getPlotGeometry(W){

    const left = 4;

    const priceLabelReserve = 48;

    const gridGap =
        W/8;

    const plotW =
        Math.max(
            40,
            W-
            priceLabelReserve-
            gridGap
        );

    return {
        left,
        plotW
    };
}

/* =========================================================

function drawChart(){

    const rect =
        viewport.getBoundingClientRect();

    const W = rect.width;
    const H = rect.height;

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle =
        "#071321";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!chartBars.length){

        ctx.fillStyle =
            "#60768c";

        ctx.font =
            "12px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            connected
            ? "Waiting for Deriv live price..."
            : "Connect to load Deriv market",
            W/2,
            H/2
        );

        return;
    }

    const {
        start,
        end
    } = getVisibleRange(
        chartBars.length
    );

    const view =
        chartBars.slice(
            start,
            end
        );

    if(!view.length) return;

    let min =
        Math.min(
            ...view.map(
                b=>b.low
            )
        );

    let max =
        Math.max(
            ...view.map(
                b=>b.high
            )
        );

    const range =
        max-min || 1;

    min -= range*.08;
    max += range*.08;

    const topPad = 28;
    const bottomPad = 25;

    /* GRID
       Columns are fixed at 8; rows are derived from the same
       pixel cell size so grid squares stay uniform instead
       of stretching thin now that the chart's height is
       flexible and varies by device/panel state. */

    ctx.strokeStyle =
        "rgba(90,120,150,.14)";

    ctx.lineWidth = 1;

    const gridCols = 8;

    const cellSize =
        W/gridCols;

    const plotAreaH =
        H-topPad-bottomPad;

    const gridRows =
        Math.max(
            2,
            Math.round(
                plotAreaH/cellSize
            )
        );

    for(let i=1;i<gridRows;i++){

        const y =
            topPad+
            plotAreaH*i/gridRows;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    for(let i=1;i<gridCols;i++){

        const x =
            W*i/gridCols;

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    function priceY(price){

        return (
            topPad+
            (
                max-price
            )/(max-min)*
            (
                H-topPad-bottomPad
            )
        );
    }

    /* PRICE SCALE - aligned to the same rows as the grid */

    ctx.font =
        "9px Arial";

    ctx.textAlign =
        "right";

    ctx.fillStyle =
        "#61778d";

    for(let i=0;i<=gridRows;i++){

        const p =
            max-
            (
                max-min
            )*i/gridRows;

        const y =
            topPad+
            plotAreaH*i/gridRows;

        ctx.fillText(
            formatPrice(p),
            W-4,
            y-2
        );
    }

    const {
        left,
        plotW
    } = getPlotGeometry(W);

    if(currentChartStyle === "line"){

        ctx.beginPath();

        view.forEach(
            (bar,i)=>{

                const x =
                    left+
                    i*
                    (
                        plotW/
                        Math.max(
                            1,
                            view.length-1
                        )
                    );

                const y =
                    priceY(
                        bar.close
                    );

                if(i===0)
                    ctx.moveTo(x,y);
                else
                    ctx.lineTo(x,y);
            }
        );

        ctx.strokeStyle =
            "#3ab8ff";

        ctx.lineWidth = 1.6;

        ctx.stroke();

    }else{

        const spacing =
            plotW/view.length;

        const candleW =
            Math.max(
                2,
                spacing*.65
            );

        view.forEach(
            (bar,i)=>{

                const x =
                    left+
                    i*spacing+
                    spacing/2;

                const openY =
                    priceY(bar.open);

                const closeY =
                    priceY(bar.close);

                const highY =
                    priceY(bar.high);

                const lowY =
                    priceY(bar.low);

                const up =
                    bar.close >=
                    bar.open;

                ctx.strokeStyle =
                    up
                    ? "#23c88a"
                    : "#ef536a";

                ctx.fillStyle =
                    ctx.strokeStyle;

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    highY
                );

                ctx.lineTo(
                    x,
                    lowY
                );

                ctx.stroke();

                ctx.fillRect(
                    x-candleW/2,
                    Math.min(
                        openY,
                        closeY
                    ),
                    candleW,
                    Math.max(
                        1,
                        Math.abs(
                            openY-closeY
                        )
                    )
                );
            }
        );
    }

    /* MA ON MAIN CHART */

    if(
        activeIndicator === "MA" &&
        maLocation === "main"
    ){

        const values =
            calculateSMA(
                view.map(
                    b=>b.close
                ),
                maLength
            );

        drawMainMA(
            values,
            view,
            priceY,
            left,
            plotW
        );
    }

    /* LIVE PRICE */

    if(currentTick){

        const y =
            priceY(
                currentTick.quote
            );

        ctx.setLineDash([
            4,
            4
        ]);

        ctx.strokeStyle =
            "#39b9ff";

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle =
            "#1675d1";

        ctx.fillRect(
            W-49,
            y-9,
            49,
            18
        );

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "9px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            formatPrice(
                currentTick.quote
            ),
            W-24,
            y+3
        );
    }

    /* POSITION LINES */

    for(const position of positions){

        if(
            position.entrySpot == null
        ){
            continue;
        }

        const entry =
            Number(
                position.entrySpot
            );

        const y =
            priceY(entry);

        ctx.setLineDash([
            7,
            4
        ]);

        ctx.strokeStyle =
            position.direction === "RISE"
            ? "#21d68c"
            : "#ff4e69";

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

        ctx.setLineDash([]);

        ctx.fillStyle =
            position.direction === "RISE"
            ? "#21d68c"
            : "#ff4e69";

        ctx.font =
            "bold 9px Arial";

        ctx.textAlign =
            "left";

        ctx.fillText(
            position.direction+
            " "+
            formatPrice(entry),
            7,
            y-4
        );
    }
}


/* =========================================================
   SMA
========================================================= */

function calculateSMA(prices,period){

    const result =
        new Array(
            prices.length
        ).fill(null);

    if(
        !prices.length ||
        period < 1
    ){
        return result;
    }

    let sum = 0;

    for(
        let i=0;
        i<prices.length;
        i++
    ){

        sum +=
            Number(prices[i]);

        if(i>=period){
            sum -=
                Number(
                    prices[i-period]
                );
        }

        if(
            i>=period-1
        ){
            result[i] =
                sum/period;
        }
    }

    return result;
}


/* =========================================================
   RSI
   Based on supplied source
========================================================= */

function calculateRSIValues(
    prices,
    period=14
){

    const result =
        new Array(
            prices.length
        ).fill(null);

    if(
        prices.length <= period ||
        period < 1
    ){
        return result;
    }

    let gains = 0;
    let losses = 0;

    for(
        let i=1;
        i<=period;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];

        if(change>0)
            gains += change;
        else
            losses -= change;
    }

    let avgGain =
        gains/period;

    let avgLoss =
        losses/period;

    result[period] =
        avgLoss===0
        ? 100
        : 100-
          (
            100/
            (
                1+
                avgGain/avgLoss
            )
          );

    for(
        let i=period+1;
        i<prices.length;
        i++
    ){

        const change =
            prices[i]-
            prices[i-1];

        const gain =
            change>0
            ? change
            : 0;

        const loss =
            change<0
            ? -change
            : 0;

        avgGain =
            (
                avgGain*(period-1)+
                gain
            )/period;

        avgLoss =
            (
                avgLoss*(period-1)+
                loss
            )/period;

        result[i] =
            avgLoss===0
            ? 100
            : 100-
              (
                100/
                (
                    1+
                    avgGain/avgLoss
                )
              );
    }

    return result;
}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
    values,
    period
){

    const result =
        new Array(
            values.length
        ).fill(null);

    if(
        values.length===0 ||
        period<1
    ){
        return result;
    }

    const k =
        2/(period+1);

    let seed = 0;
    let count = 0;
    let previous = null;

    for(
        let i=0;
        i<values.length;
        i++
    ){

        const value =
            Number(values[i]);

        if(!Number.isFinite(value))
            continue;

        if(count<period){

            seed += value;
            count++;

            if(count===period){

                previous =
                    seed/period;

                result[i] =
                    previous;
            }

        }else{

            previous =
                value*k+
                previous*(1-k);

            result[i] =
                previous;
        }
    }

    return result;
}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(
    prices,
    fast=12,
    slow=26,
    signal=9
){

    const fastEMA =
        calculateEMA(
            prices,
            fast
        );

    const slowEMA =
        calculateEMA(
            prices,
            slow
        );

    const macd =
        new Array(
            prices.length
        ).fill(null);

    for(
        let i=0;
        i<prices.length;
        i++
    ){

        if(
            fastEMA[i] != null &&
            slowEMA[i] != null
        ){

            macd[i] =
                fastEMA[i]-
                slowEMA[i];
        }
    }

    const validMACD =
        macd.map(
            x =>
                x == null
                ? 0
                : x
        );

    const signalLine =
        calculateEMA(
            validMACD,
            signal
        );

    const histogram =
        macd.map(
            (x,i)=>
                x == null ||
                signalLine[i] == null
                ? null
                : x-signalLine[i]
        );

    return {
        macd,
        signal:signalLine,
        histogram
    };
}


/* =========================================================
   DRAW MAIN MA
========================================================= */

function drawMainMA(
    values,
    bars,
    priceY,
    left,
    plotW
){

    const spacing =
        plotW/bars.length;

    ctx.beginPath();

    let started = false;

    values.forEach(
        (value,i)=>{

            if(value==null)
                return;

            const x =
                left+
                i*spacing+
                spacing/2;

            const y =
                priceY(value);

            if(!started){

                ctx.moveTo(x,y);
                started=true;

            }else{

                ctx.lineTo(x,y);
            }
        }
    );

    if(started){

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 1.7;

        ctx.stroke();
    }
}

/* =========================================================
   INDICATOR DRAW
========================================================= */

function drawIndicatorWindow(){

    const W =
        indicatorCanvas.clientWidth;

    const H =
        indicatorCanvas.clientHeight;

    ictx.clearRect(
        0,
        0,
        W,
        H
    );

    ictx.fillStyle =
        "#071321";

    ictx.fillRect(
        0,
        0,
        W,
        H
    );

    if(
        !chartBars.length ||
        !activeIndicator
    ){
        return;
    }

    const {
        start,
        end
    } = getVisibleRange(
        chartBars.length
    );

    const bars =
        chartBars.slice(
            start,
            end
        );

    if(!bars.length) return;

    /* Full close-price history is used for the indicator
       math (so RSI/MACD/MA have proper lookback), then the
       result is sliced to the same start:end window the
       main chart is showing - keeping both panels locked
       together as the chart is panned or zoomed. */

    const fullPrices =
        chartBars.map(
            b=>b.close
        );

    if(
        activeIndicator ===
        "RSI"
    ){

        drawRSI(
            fullPrices,
            start,
            end
        );

    }else if(
        activeIndicator ===
        "MACD"
    ){

        drawMACD(
            fullPrices,
            start,
            end
        );

    }else if(
        activeIndicator ===
        "MA"
    ){

        drawWindowMA(
            fullPrices,
            start,
            end
        );
    }
}

/* =========================================================
   MACD WINDOW
========================================================= */

function drawMACD(
    fullPrices,
    start,
    end
){

    const W =
        indicatorCanvas.clientWidth;

    const H =
        indicatorCanvas.clientHeight;

    const fullResult =
        calculateMACD(
            fullPrices,
            macdFast,
            macdSlow,
            macdSignal
        );

    const result = {
        macd:
            fullResult.macd.slice(
                start,
                end
            ),
        signal:
            fullResult.signal.slice(
                start,
                end
            ),
        histogram:
            fullResult.histogram.slice(
                start,
                end
            )
    };

    let all = [];

    result.macd.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    result.signal.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    result.histogram.forEach(
        x=>{
            if(x!=null)
                all.push(x);
        }
    );

    if(!all.length)
        return;

    let max =
        Math.max(
            ...all
        );

    let min =
        Math.min(
            ...all
        );

    const range =
        max-min || 1;

    max += range*.12;
    min -= range*.12;

    function y(v){

        return 8+
            (
                max-v
            )/
            (max-min)*
            (
                H-26
            );
    }

    const zeroY =
        y(0);

    ictx.strokeStyle =
        "rgba(120,140,160,.35)";

    ictx.beginPath();

    ictx.moveTo(
        0,
        zeroY
    );

    ictx.lineTo(
        W,
        zeroY
    );

    ictx.stroke();

    const {
        left:histLeft,
        plotW:histPlotW
    } = getPlotGeometry(W);

    const spacing =
        histPlotW/
        result.histogram.length;

    result.histogram.forEach(
        (value,i)=>{

            if(value==null)
                return;

            const x =
                histLeft+
                i*spacing+
                spacing/2;

            const yy =
                y(value);

            ictx.fillStyle =
                value>=0
                ? "rgba(45,210,145,.75)"
                : "rgba(239,83,106,.75)";

            ictx.fillRect(
                x-spacing*.3,
                Math.min(
                    yy,
                    zeroY
                ),
                spacing*.6,
                Math.max(
                    1,
                    Math.abs(
                        yy-zeroY
                    )
                )
            );
        }
    );

    drawIndicatorLine(
        result.macd,
        y,
        W,
        H,
        "#45b9ff"
    );

    drawIndicatorLine(
        result.signal,
        y,
        W,
        H,
        "#ffc857"
    );

    drawIndicatorLabel(
        "MACD "+
        macdFast+
        ","+
        macdSlow+
        ","+
        macdSignal,
        "#45b9ff"
    );
}


/* =========================================================
   MA WINDOW
========================================================= */

function drawWindowMA(
    fullPrices,
    start,
    end
){

    const values =
        calculateSMA(

        ).slice(

        );

        Math.max(...valid);

    const range =
        max-min || 1;

    min -= range*.1;
    max += range*.1;

    function y(v){

        return 8+
            (
                max-v
            )/
            (max-min)*
            (
                H-26
            );
    }

    );

}


/* =========================================================
   GENERIC INDICATOR LINE
========================================================= */

function drawIndicatorLine(
    values,
    y,
    W,
    H,
    strokeColor
){

    if(!values.length)
        return;

    /* Same left margin + plot width as the main chart, and
       the same "bar-center" x formula used for candles, so
       the last (current) indicator value sits directly
       under the current candle - not stretched to the
       canvas edge. */

    const {
        left,
        plotW
    } = getPlotGeometry(W);

    const spacing =
        plotW/
        values.length;

    ictx.beginPath();

    let started=false;

    values.forEach(
        (value,i)=>{

            if(
                value==null ||
                !Number.isFinite(value)
            ){
                return;
            }

            const x =
                left+
                i*spacing+
                spacing/2;

            const yy =
                y(value);

            if(!started){

                ictx.moveTo(
                    x,
                    yy
                );

                started=true;

            }else{

                ictx.lineTo(
                    x,
                    yy
                );
            }
        }
    );

    if(started){

        ictx.strokeStyle =
            strokeColor;

        ictx.lineWidth=1.6;

        ictx.stroke();
    }
}

/* =========================================================
   REMAINING TIME
========================================================= */

function formatRemaining(
    expiryTime
){

    if(!expiryTime)
        return "--";

    const remaining =
        Math.max(
            0,
            expiryTime-
            Date.now()
        );

    const seconds =
        Math.ceil(
            remaining/1000
        );

    if(seconds<=0)
        return "SETTLING";

    const m =
        Math.floor(
            seconds/60
        );

    const s =
        seconds%60;

    return (
        m+
        ":"+
        String(s)
            .padStart(2,"0")
    );
}

/* =========================================================
   EXPIRY OBJECT
========================================================= */

function expiryToObject(value){

    if(value === "custom"){

        return {
            duration:
                customExpirySeconds,
            unit:"s"
        };
    }

    if(value.endsWith("t")){

        return {
            duration:
                Number(
                    value.replace("t","")
                ),
            unit:"t"
        };
    }

    if(value.endsWith("m")){

        return {
            duration:
                Number(
                    value.replace("m","")
                ),
            unit:"m"
        };
    }

    return {
        duration:5,
        unit:"m"
    };
}


/* =========================================================
   REFRESH LIVE PROPOSALS
   Re-subscribes the background CALL/PUT price stream
   whenever the market, stake, or expiry actually changes.
   Cancels the previous subscriptions first so the server
   doesn't accumulate stale streams.
========================================================= */

function refreshLiveProposals(){

    if(
        !connected ||
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    const stake =
        Number(
            $("stake").value
        );

    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){
        return;
    }

    const expiryValue =
        $("tradeExpiry").value;

    const exp =
        expiryToObject(
            expiryValue
        );

    const key =
        currentMarket+
        "|"+
        stake+
        "|"+
        exp.duration+
        exp.unit;

    if(key === liveProposalKey){
        return;
    }

    liveProposalKey = key;

    /* Cancel whatever was previously streaming */

    ["RISE","FALL"].forEach(
        direction=>{

            const subId =
                liveProposalSubIds[
                    direction
                ];

            if(
                subId &&
                authenticatedWS.readyState ===
                WebSocket.OPEN
            ){

                authenticatedWS.send(
                    JSON.stringify({
                        forget:subId
                    })
                );
            }

            liveProposalSubIds[
                direction
            ] = null;

            liveProposals[
                direction
            ] = null;
        }
    );

    ["RISE","FALL"].forEach(
        direction=>{

            const contractType =
                direction === "RISE"
                ? "CALL"
                : "PUT";

            const reqId =
                req();

            liveProposalReqIds[
                reqId
            ] = direction;

            authenticatedWS.send(
                JSON.stringify({
                    proposal:1,
                    subscribe:1,
                    amount:stake,
                    basis:"stake",
                    contract_type:
                        contractType,
                    currency:
                        accountCurrency,
                    duration:
                        exp.duration,
                    duration_unit:
                        exp.unit,
                    underlying_symbol:
                        currentMarket,
                    req_id:reqId
                })
            );
        }
    );
}

/* =========================================================
   AUTHENTICATED SESSION (single-socket authorize flow)

   Replaces the old two-step REST "/accounts" -> "/otp" ->
   second WebSocket dance, which repeatedly failed to reach
   Deriv live. This uses the same public WebSocket endpoint
   that is confirmed to connect reliably, and authenticates
   it in place by sending a single "authorize" request over
   it - the standard, long-established way every real Deriv
   integration logs a socket into an account. No REST calls,
   no OTP, no second socket: authenticatedWS becomes the same
   object as publicWS once authorize succeeds.
========================================================= */

let pendingAuthorize =
    new Map();


function waitForOpenSocket(){

    return new Promise(
        (resolve,reject)=>{

            openPublicWS();

            const started =
                Date.now();

            const check =
                setInterval(
                    ()=>{

                        if(
                            publicWS &&
                            publicWS.readyState ===
                            WebSocket.OPEN
                        ){

                            clearInterval(check);

                            resolve(publicWS);

                            return;
                        }

                        if(
                            Date.now()-started >
                            15000
                        ){

                            clearInterval(check);

                            reject(
                                new Error(
                                    "Timed out waiting for the Deriv market socket to open."
                                )
                            );
                        }

                    },
                    100
                );
        }
    );
}


function authorizeSession(generation){

    return new Promise(
        async (resolve,reject)=>{

            try{

                const socket =
                    await waitForOpenSocket();

                if(generation !== connectionGeneration){

                    reject(
                        new Error("Superseded.")
                    );

                    return;
                }

                const authReq =
                    req();

                pendingAuthorize.set(
                    authReq,
                    {resolve,reject}
                );

                socket.send(
                    JSON.stringify({
                        authorize:pat,
                        req_id:authReq
                    })
                );

                setTimeout(
                    ()=>{

                        if(
                            pendingAuthorize.has(authReq)
                        ){

                            pendingAuthorize.delete(authReq);

                            reject(
                                new Error(
                                    "Deriv did not respond to the authorize request."
                                )
                            );
                        }

                    },
                    15000
                );

            }catch(error){

                reject(error);
            }
        }
    );
}


/* =========================================================
   AUTH SUBSCRIPTIONS
========================================================= */

function subscribeAuthenticatedData(){

    if(
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    authenticatedWS.send(
        JSON.stringify({
            balance:1,
            subscribe:1,
            req_id:req()
        })
    );
}


/* =========================================================
   AUTH MESSAGE
========================================================= */

function handleAuthenticatedMessage(data){

    /*
       Resolve/reject the in-flight authorize() call from
       connectToDeriv(). This must run before the generic
       error branch below so a failed authorize reaches the
       connect flow's own catch block with a clear message,
       instead of just being logged and silently dropped.
    */

    if(
        pendingAuthorize.has(
            Number(data.req_id)
        )
    ){

        const waiter =
            pendingAuthorize.get(
                Number(data.req_id)
            );

        pendingAuthorize.delete(
            Number(data.req_id)
        );

        if(data.error){

            waiter.reject(
                new Error(
                    data.error.message ||
                    "Deriv authorization failed."
                )
            );

        }else{

            waiter.resolve(
                data.authorize
            );
        }

        return;
    }

    if(data.error){

        log(
            data.error.message ||
            "Deriv API error.",
            "bad"
        );

        const failedTrade =
            pendingTrades.get(
                Number(data.req_id)
            );

        if(failedTrade && failedTrade.btn){

            unlockTradeButton(
                failedTrade.direction,
                failedTrade.btn,
                failedTrade.originalHTML
            );

            pendingTrades.delete(
                Number(data.req_id)
            );
        }

        return;
    }

    if(
        data.msg_type ===
        "balance"
    ){

        const b =
            data.balance;

        if(b){

            $("balance")
                .textContent =
                "$"+
                Number(
                    b.balance
                ).toFixed(2);
        }

        return;
    }

    if(
        data.msg_type ===
        "proposal"
    ){

        handleProposal(data);

        return;
    }

    if(
        data.msg_type ===
        "buy"
    ){

        handleBuyResponse(data);

        return;
    }

    if(
        data.msg_type ===
        "proposal_open_contract"
    ){

        handleOpenContract(
            data.proposal_open_contract
        );

        return;
    }
}


/* =========================================================
   TRADE BUTTONS
   Both "pointerdown" (fires the instant a finger/mouse
   touches the button, for the fastest possible feel) and
   "click" (the universally-supported fallback that always
   works, even on devices/browsers with partial or no
   Pointer Events support) are wired up. A short time-based
   debounce - not an event-type check - stops the pair from
   ever placing the same order twice.
========================================================= */

let tradeLock = {
    RISE:false,
    FALL:false
};

let lastTradeFire = {
    RISE:0,
    FALL:0
};

function fireTrade(direction,event){

    if(event && event.cancelable){
        event.preventDefault();
    }

    const now =
        Date.now();

    if(
        now-lastTradeFire[direction] <
        600
    ){
        /* Same tap already fired this order via the other
           event type a moment ago - ignore the duplicate. */
        return;
    }

    lastTradeFire[direction] =
        now;

    placeTrade(direction);
}

["riseBtn","fallBtn"].forEach(
    id=>{

        const direction =
            id === "riseBtn"
            ? "RISE"
            : "FALL";

        const btn =
            $(id);

        btn.addEventListener(
            "pointerdown",
            e=>fireTrade(direction,e)
        );

        btn.addEventListener(
            "click",
            e=>fireTrade(direction,e)
        );
    }
);


/* =========================================================
   PLACE TRADE
========================================================= */

function placeTrade(direction){

    if(tradeLock[direction]){
        return;
    }

    if(!connected){

        log(
            "Connect to Deriv before trading.",
            "bad"
        );

        return;
    }

    if(
        !authenticatedWS ||
        authenticatedWS.readyState !==
        WebSocket.OPEN
    ){

        log(
            "Trading connection is not ready.",
            "bad"
        );

        return;
    }

    const stake =
        Number(
            $("stake").value
        );

    if(
        !Number.isFinite(stake) ||
        stake < 1
    ){

        log(
            "Minimum stake is 1.",
            "bad"
        );

        return;
    }

    const expiry =
        $("tradeExpiry").value;

    const exp =
        expiryToObject(
            expiry
        );

    const contractType =
        direction === "RISE"
        ? "CALL"
        : "PUT";

    /* Lock + instant visual feedback, before the network
       call goes out, so the tap always feels immediate. */

    tradeLock[direction] = true;

    const btn =
        direction === "RISE"
        ? $("riseBtn")
        : $("fallBtn");

    const originalHTML =
        btn.innerHTML;

    btn.classList.add(
        "sending"
    );

    btn.innerHTML =
        "SENDING…";

    /* FAST PATH: a live-streamed proposal for this exact
       direction/stake/expiry/market is already cached from
       the background subscription - buy on it immediately,
       skipping the proposal request/response round trip
       entirely. This is what makes entry fast. */

    const key =
        currentMarket+
        "|"+
        stake+
        "|"+
        exp.duration+
        exp.unit;

    const cached =
        liveProposals[direction];

    if(
        cached &&
        key === liveProposalKey &&
        (Date.now()-cached.updatedAt) <
        LIVE_PROPOSAL_MAX_AGE_MS
    ){

        const buyReq =
            req();

        pendingTrades.set(
            buyReq,
            {
                direction,
                stake,
                expiry,
                market:currentMarket,
                btn,
                originalHTML
            }
        );

        authenticatedWS.send(
            JSON.stringify({
                buy:
                    cached.id,
                price:
                    cached.price,
                req_id:
                    buyReq
            })
        );

        log(
            "Fast entry: "+
            direction+
            " (live price).",
            "info"
        );

        setTimeout(
            ()=>{
                if(
                    tradeLock[direction] &&
                    btn.classList.contains(
                        "sending"
                    )
                ){
                    unlockTradeButton(
                        direction,
                        btn,
                        originalHTML
                    );
                }
            },
            8000
        );

        return;
    }

    /* FALLBACK: no fresh cached price yet (e.g. right after
       connecting, or the stream hasn't answered), so request
       a one-off proposal the normal way. */

    const request =
        req();

    pendingTrades.set(
        request,
        {
            direction,
            stake,
            expiry,
            market:currentMarket,
            btn,
            originalHTML
        }
    );

    authenticatedWS.send(
        JSON.stringify({
            proposal:1,
            amount:stake,
            basis:"stake",
            contract_type:
                contractType,
            currency:
                accountCurrency,
            duration:
                exp.duration,
            duration_unit:
                exp.unit,
            underlying_symbol:
                currentMarket,
            req_id:request
        })
    );

    log(
        "Requesting Deriv "+
        direction+
        " proposal...",
        "info"
    );

    /* Safety unlock in case the stream never answers */

    setTimeout(
        ()=>{
            if(
                tradeLock[direction] &&
                btn.classList.contains(
                    "sending"
                )
            ){
                unlockTradeButton(
                    direction,
                    btn,
                    originalHTML
                );
            }
        },
        8000
    );
}


function unlockTradeButton(
    direction,
    btn,
    originalHTML
){

    tradeLock[direction] = false;

    btn.classList.remove(
        "sending"
    );

    btn.innerHTML =
        originalHTML;
}


/* =========================================================
   PROPOSAL
========================================================= */

function handleProposal(data){

    const proposal =
        data.proposal;

    if(!proposal)
        return;

    const reqId =
        Number(data.req_id);

    /* Background live-stream update - cache it and stop,
       this is not a one-off trade request. */

    const liveDirection =
        liveProposalReqIds[reqId];

    if(liveDirection){

        const liveAsk =
            Number(
                proposal.ask_price
            );

        if(
            proposal.id &&
            Number.isFinite(liveAsk)
        ){

            liveProposals[
                liveDirection
            ] = {
                id:proposal.id,
                price:liveAsk,
                updatedAt:Date.now()
            };

            if(
                data.subscription &&
                data.subscription.id
            ){

                liveProposalSubIds[
                    liveDirection
                ] =
                    data.subscription.id;
            }
        }

        return;
    }

    const trade =
        pendingTrades.get(reqId);

    if(!trade)
        return;

    pendingTrades.delete(reqId);

    const askPrice =
        Number(
            proposal.ask_price
        );

    if(
        !proposal.id ||
        !Number.isFinite(askPrice)
    ){

        log(
            "Invalid Deriv proposal.",
            "bad"
        );

        if(trade.btn){

            unlockTradeButton(
                trade.direction,
                trade.btn,
                trade.originalHTML
            );
        }

        return;
    }

    const buyReq =
        req();

    pendingTrades.set(
        buyReq,
        {
            ...trade,
            proposalId:
                proposal.id,
            askPrice
        }
    );

    authenticatedWS.send(
        JSON.stringify({
            buy:
                proposal.id,
            price:
                askPrice,
            req_id:
                buyReq
        })
    );
}


/* =========================================================
   BUY
========================================================= */

function handleBuyResponse(data){

    const buy =
        data.buy;

    if(!buy)
        return;

    const trade =
        pendingTrades.get(
            Number(data.req_id)
        );

    if(!trade){

        log(
            "Received buy response without matching request.",
            "warn"
        );

        return;
    }

    pendingTrades.delete(
        Number(data.req_id)
    );

    if(trade.btn){

        unlockTradeButton(
            trade.direction,
            trade.btn,
            trade.originalHTML
        );
    }

    if(!buy.contract_id){

        log(
            "No contract ID returned by Deriv.",
            "bad"
        );

        return;
    }

    const position = {

        id:
            buy.contract_id,

        market:
            trade.market,

        direction:
            trade.direction,

        stake:
            trade.stake,

        entrySpot:
            null,

        profit:0,

        expiryTime:null,

        buyPrice:
            Number(
                buy.buy_price ||
                trade.askPrice ||
                0
            )
    };

    positions.push(
        position
    );

    renderPositions();

    drawChart();

    log(
        "Opened "+
        trade.direction+
        " position on "+
        trade.market+
        ".",
        "good"
    );

    authenticatedWS.send(
        JSON.stringify({
            proposal_open_contract:1,
            contract_id:
                position.id,
            subscribe:1,
            req_id:req()
        })
    );
}


/* =========================================================
   OPEN CONTRACT
========================================================= */

function handleOpenContract(contract){

    if(!contract)
        return;

    const id =
        String(
            contract.contract_id
        );

    const position =
        positions.find(
            p =>
                String(p.id) === id
        );

    if(!position)
        return;

    if(
        contract.entry_spot != null
    ){

        position.entrySpot =
            Number(
                contract.entry_spot
            );
    }

    if(
        contract.date_expiry != null
    ){

        position.expiryTime =
            Number(
                contract.date_expiry
            )*1000;
    }

    if(
        contract.profit != null
    ){

        position.profit =
            Number(
                contract.profit
            );
    }

    renderPositions();

    drawChart();

    if(
        contract.is_sold ||
        contract.status === "sold" ||
        contract.status === "won" ||
        contract.status === "lost"
    ){

        finishPosition(
            position,
            contract
        );
    }
}


/* =========================================================
   FINISH POSITION
========================================================= */

function finishPosition(
    position,
    contract
){

    const profit =
        Number(
            contract.profit ||
            position.profit ||
            0
        );

    log(
        position.market+
        " "+
        position.direction+
        " settled: "+
        (
            profit>=0
            ? "WIN "
            : "LOSS "
        )+
        profit.toFixed(2),
        profit>=0
        ? "good"
        : "bad"
    );

    positions =
        positions.filter(
            p =>
                String(p.id) !==
                String(position.id)
        );

    renderPositions();

    drawChart();
}

/* =========================================================
   CHART DRAG
========================================================= */

viewport.addEventListener(
    "pointerdown",
    event=>{

        dragging=true;

        dragStartX =
            event.clientX;

        dragStartPan =
            panOffset;

        viewport.setPointerCapture(
            event.pointerId
        );
    }
);


viewport.addEventListener(
    "pointermove",
    event=>{

        if(!dragging)
            return;

        const dx =
            event.clientX-
            dragStartX;

        const barsPerPixel =
            Math.max(
                .08,
                90/
                Math.max(
                    100,
                    viewport.clientWidth
                )
            );

        panOffset =
            dragStartPan+
            Math.round(
                dx*
                barsPerPixel*
                -1
            );

        const maxPan =
            Math.max(
                0,
                chartBars.length-20
            );

        panOffset =
            Math.max(
                0,
                Math.min(
                    maxPan,
                    panOffset
                )
            );

        drawChart();
    }
);


viewport.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);

viewport.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =========================================================
   ACCOUNT MASK
========================================================= */

function maskAccount(id){

    if(!id)
        return "Not connected";

    const s =
        String(id);

    if(s.length<=5)
        return s;

    return (
        s.slice(0,2)+
        "•••••"+
        s.slice(-3)
    );
}


/* =========================================================
   CONNECT
========================================================= */

async function connectToDeriv(isAutoRetry){

    if(!pat){

        log(
            "Paste your PAT before connecting.",
            "bad"
        );

        return false;
    }

    /*
       Every connect attempt gets its own generation number.
       If a newer attempt starts (user switches DEMO/LIVE and
       hits connect again, or the watchdog retries) while this
       one is still awaiting the network, this attempt bails
       out instead of clobbering the newer connection's state.
    */

    const generation =
        ++connectionGeneration;

    if(!isAutoRetry){

        $("connectBtn")
            .disabled =
            true;
    }

    $("chartStatus")
        .textContent =
        isAutoRetry
        ? "RECONNECTING"
        : "AUTHENTICATING";

    try{

        const authInfo =
            await authorizeSession(
                generation
            );

        if(generation !== connectionGeneration){
            return false;
        }

        const isDemo =
            authInfo.is_virtual === 1 ||
            authInfo.is_virtual === true;

        const actualType =
            isDemo ? "demo" : "live";

        if(actualType !== selectedAccountType){

            throw new Error(
                "This PAT authorizes a "+
                actualType.toUpperCase()+
                " account, but "+
                selectedAccountType.toUpperCase()+
                " is selected. Generate a "+
                selectedAccountType.toUpperCase()+
                " API token at app.deriv.com/account/api-token and paste that instead."
            );
        }

        accountId =
            authInfo.loginid;

        accountCurrency =
            authInfo.currency ||
            "USD";

        authenticatedWS =
            publicWS;

        log(
            "Authorized "+
            selectedAccountType.toUpperCase()+
            " account "+
            maskAccount(accountId)+
            ".",
            "info"
        );

        if(generation !== connectionGeneration){
            return false;
        }

        connected=true;

        shouldStayConnected=true;

        reconnectAttempts=0;

        $("connectBtn")
            .textContent =
            "CONNECTED";

        $("connectBtn")
            .classList
            .add(
                "connected"
            );

        $("chartStatus")
            .textContent =
            "CONNECTED";

        subscribeAuthenticatedData();

        liveProposalKey = null;

        refreshLiveProposals();
