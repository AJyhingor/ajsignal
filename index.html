  const lx=X(E-1),ly0=Y(a[E-1].p);x.lineTo(lx,h-B);x.lineTo(X(st),h-B);x.closePath();x.fillStyle="rgba(120,160,230,.10)";x.fill();x.lineWidth=1;

/* ---------- trading ---------- */
const isRate=e=>/rate|too many|limit/i.test(e.message||""),isInt=e=>/internal|server error|error occurred|timed out|temporar/i.test(e.message||"");
async function findNew(pr,amt,t0){try{const d=await rq({portfolio:1},6000,0),l=(d.portfolio&&d.portfolio.contracts)||[];
  const c=l.find(x=>!open.has(+x.contract_id)&&x.symbol===pr[SK]&&Math.abs(+x.buy_price-amt)<.011&&+x.purchase_time>=t0-3);return c?{buy:{contract_id:c.contract_id,payout:c.payout}}:null}catch(e){return null}}
async function tryBuy(pr,amt,t0){
  for(let a=0;a<3;a++){
    try{return await rq({buy:1,price:amt,parameters:pr},9000,0)}
    catch(e){const m=e.message||"";
      if(/symbol/i.test(m)&&a===0){const v=pr[SK];delete pr[SK];SK=SK==="symbol"?"underlying_symbol":"symbol";pr[SK]=v;continue}
      if(isRate(e)){await sleep(300);continue}
      if(isInt(e)){const f=await findNew(pr,amt,t0);if(f)return f;if(a<2){await sleep(200);continue}}
      throw e}}
  throw new Error("Buy failed")}
async function buy(up){
  if(!authed){msg("Connect to Deriv first.","var(--red)");return}
  const amt=Math.round(Number(S.stake)*100)/100;if(!(amt>=0.35)){msg("Minimum stake is 0.35","var(--red)");return}
  const mu=S.tt==="acc",sym=cs(),name=MK[S.m][0];if(mu&&sym!=="R_75"){msg("Accumulators trade only on V75.","var(--red)");return}
  if(!mu&&BC(sym)){msg(name+" can only be traded as Multiplier.","var(--red)");return}
  if(!isOpen(sym)){msg(name+" market is closed.","var(--red)");return}
  const side=mu?"ACCU":(up?"CALL":"PUT"),ex=mu?0:S.ex,t0=Date.now()/1000,pr={amount:amt,basis:"stake",contract_type:side,currency:cur};
  if(mu)pr.growth_rate=0.05;else{pr.duration=ex;pr.duration_unit="m"}pr[SK]=sym;
  const lb=(mu?"◆ BUY ":up?"▲ BUY ":"▼ SELL ")+name+" "+(mu?"ACC 5%":ex+"m");
  const r0=tryBuy(pr,amt,t0);                                    /* the buy leaves first, the screen is updated after */
  msg(lb+" sending...");
  try{const r=await r0,b=r.buy;if(!b||!b.contract_id)throw new Error("No buy confirmation");const id=+b.contract_id;
    open.set(id,{id,side,sym,name,ex,mult:0,stake:amt,entry:0,pl:0,end:mu?0:Date.now()/1000+ex*60});send({proposal_open_contract:1,contract_id:id,subscribe:1});
    msg("Bought "+lb+" • "+Math.round((Date.now()/1000-t0)*1000)+"ms","var(--green)");lists()}
  catch(e){msg(e.message,"var(--red)")}}
async function closeM(id){const t=open.get(id);if(!t||t.closing)return;t.closing=1;msg("Closing "+t.name+"...");
  try{await rq({sell:id,price:0},9000,1);send({proposal_open_contract:1,contract_id:id})}catch(e){t.closing=0;msg(e.message,"var(--red)")}}
async function sync(){try{const d=await rq({portfolio:1},8000),l=(d.portfolio&&d.portfolio.contracts)||[],ids=new Set(l.map(c=>+c.contract_id));
  l.forEach(c=>{const id=+c.contract_id;if(open.has(id))return;const m=MK.find(x=>x[1]===c.symbol),a=+c.purchase_time||0,z=+c.expiry_time||+c.date_expiry||0,ct=String(c.contract_type||"");
    open.set(id,{id,side:/^MULT/.test(ct)?ct:/^PUT/.test(ct)?"PUT":/^CALL/.test(ct)?"CALL":ct,mult:/^MULT/.test(ct)?100:0,sym:c.symbol,name:m?m[0]:(c.symbol||"?"),ex:z&&a?Math.max(1,Math.round((z-a)/60)):0,stake:+c.buy_price||0,entry:0,pl:0,end:/^MULT/.test(ct)?0:z});
    send({proposal_open_contract:1,contract_id:id,subscribe:1})});
  open.forEach(o=>{if(!ids.has(o.id))send({proposal_open_contract:1,contract_id:o.id})});   /* closed while away: get its result */
  lists();renderPL();rd()}catch(e){}}
function poc(p){const t=p&&open.get(+p.contract_id);if(!t)return;
  if(p.entry_spot!==undefined)t.entry=+p.entry_spot;if(p.date_expiry)t.end=+p.date_expiry;t.pl=Number(p.profit)||0;
  if(p.entry_tick!==undefined&&!t.entry)t.entry=+p.entry_tick;
  if(t.side==="ACCU"){const hb=+p.high_barrier,lb=+p.low_barrier;if(hb&&lb&&hb>lb)t.dist=(hb-lb)/2;const sp=+p.current_spot;if(t.entry&&t.tpHi===undefined&&S.tp>0){t.tpHi=t.entry+S.tp;t.tpLo=t.entry-S.tp}if(sp&&t.tpHi!==undefined&&!t.closing&&p.status==="open"&&!p.is_sold&&(sp>=t.tpHi||sp<=t.tpLo))closeM(t.id)}
  if(p.is_sold||p.status==="won"||p.status==="lost"){open.delete(t.id);real+=t.pl;t.pl>0?W++:L++;hist.unshift(t);hist.length=Math.min(hist.length,50);persist();msg((t.pl>0?"WIN +":"LOSS ")+t.pl.toFixed(2),t.pl>0?"var(--green)":"var(--red)")}
  renderPL();lists();rd()}
function renderPL(){const t=real,e=$("pl");e.textContent=(t>=0?"+":"")+t.toFixed(2);e.className="plb mono "+(t>=0?"green":"red");$("wl").textContent=W+"W / "+L+"L"}
const isUp=z=>z==="CALL"||z==="MULTUP";
function row(t,live){const mu=!!t.mult||/^MULT/.test(t.side)||t.side==="ACCU",left=Math.max(0,Math.round(t.end-Date.now()/1000)),tm=live&&!mu?" • "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"";
  const pl='<b class="'+(t.pl>=0?"green":"red")+'">'+(t.pl>=0?"+":"")+t.pl.toFixed(2)+"</b>",xb=live&&mu?'<button class="xb" data-x="'+t.id+'">x</button>':"";
  return '<div class="k mono"><span>'+(isUp(t.side)?"▲":t.side==="PUT"||t.side==="MULTDOWN"?"▼":"◆")+" "+t.name+(t.side==="ACCU"?" ACC 5%":mu?" "+(t.mult||100)+"x":t.ex?" "+t.ex+"m":"")+" • "+t.stake.toFixed(2)+tm+'</span><span style="display:flex;align-items:center;gap:8px">'+pl+xb+"</span></div>"}
